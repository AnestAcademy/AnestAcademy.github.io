<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-P · 52 câu hỏi khác biệt</title>
<meta name="description" content="Ôn tập 52 câu hỏi khác biệt: 3 câu từ trainer và 49 câu từ learning_tool.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-P-52')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  height:40px;min-height:40px;
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.explanation,.explanation-body{display:contents}
.explanation-toggle{display:none}
.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
.revgrid .sech,.revgrid .prose,.revgrid .elim li{font-size:13px}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

.origin{font-family:var(--sans);font-size:12px;line-height:1.65;color:var(--ink-2);margin:0 0 14px;overflow-wrap:anywhere}
.stem{white-space:normal}.prose a{color:var(--pick);text-decoration:underline}.prose code,.tx code,.stem code{font-family:var(--mono);font-size:.9em;overflow-wrap:anywhere}
@media(max-width:600px){.mark .s{display:none}}
</style>

        </div>
        <div class="blk">
          <span class="lbl" data-t="lStatus">Trạng thái</span>

const DATA = {"meta":{"code":"CCAR-P-52","title":{"en":"CCAR-P — 52 differing questions","vi":"CCAR-P — 52 câu hỏi khác biệt"},"org":"Anthropic","pass":70},"topics":[{"n":1,"title":{"vi":"Chỉ có ở trainer · 3 câu","en":"Trainer only · 3 questions"},"questions":[{"id":"diff-trainer-11","n":11,"topic":1,"type":"mcq","stem":{"en":"You are diagnosing a Claude Code session whose subagent uses 50,000 tokens of context before the engineer types a single message. Which root cause is most likely?","vi":"Bạn đang chẩn đoán một phiên Mã Claude có tác nhân phụ sử dụng 50.000 mã thông báo ngữ cảnh trước khi kỹ sư nhập một tin nhắn. Nguyên nhân gốc rễ nào có khả năng xảy ra nhất?","jp":"エンジニアが 1 つのメッセージを入力する前に、サブエージェントが 50,000 個のコンテキスト トークンを使用するクロード コード セッションを診断しています。 どの根本原因が最も考えられますか?"},"options":[{"k":"A","t":{"en":"The developer's keyboard layout or input-method configuration is the cause of the elevated context consumption, introducing extra tokens before the engineer types any message.","vi":"Bố cục bàn phím hoặc cấu hình phương thức nhập của nhà phát triển là nguyên nhân khiến mức tiêu thụ ngữ cảnh tăng cao, đưa ra các mã thông báo bổ sung trước khi kỹ sư nhập bất kỳ thông báo nào.","jp":"開発者のキーボード レイアウトまたは入力方法の構成がコンテキストの消費量の増加の原因となり、エンジニアがメッセージを入力する前に余分なトークンが導入されます。"}},{"k":"B","t":{"en":"Many MCP servers are configured, each contributing tool definitions to the context budget; Tool Search is not enabled, so all definitions load upfront.","vi":"Nhiều máy chủ MCP được định cấu hình, mỗi máy chủ đóng góp các định nghĩa công cụ vào ngân sách ngữ cảnh; Tìm kiếm bằng công cụ chưa được bật nên tất cả các định nghĩa đều được tải trước.","jp":"多くの MCP サーバーが構成されており、それぞれがコンテキスト バジェットにツール定義を提供します。ツール検索が有効になっていないため、すべての定義が事前に読み込まれます。"}},{"k":"C","t":{"en":"The model has internal personal preferences or default behaviors that silently consume large portions of context budget before any user message is processed, independent of tool configuration.","vi":"Mô hình này có các tùy chọn cá nhân nội bộ hoặc hành vi mặc định âm thầm tiêu tốn phần lớn ngân sách ngữ cảnh trước khi bất kỳ thông báo nào của người dùng được xử lý, không phụ thuộc vào cấu hình công cụ.","jp":"このモデルには、ツールの設定とは関係なく、ユーザー メッセージが処理される前にコンテキスト バジェットの大部分を静かに消費する内部の個人的な設定またはデフォルトの動作があります。"}},{"k":"D","t":{"en":"The font rendering or display-scaling settings of the IDE are converting visual output into additional context tokens, causing the high pre-session context consumption.","vi":"Cài đặt hiển thị phông chữ hoặc tỷ lệ hiển thị của IDE đang chuyển đổi kết quả trực quan thành mã thông báo ngữ cảnh bổ sung, gây ra mức tiêu thụ ngữ cảnh trước phiên cao.","jp":"IDE のフォント レンダリングまたは表示スケーリング設定により、ビジュアル出力が追加のコンテキスト トークンに変換され、セッション前のコンテキスト消費量が増加します。"}}],"answer":["B"],"multi":false,"explain":{"text":"Claude Code constructs the model context before the first user message. That initial context can include the system prompt, project instructions, subagent configuration, MCP server instructions, and tool definitions expressed as JSON schemas. When numerous MCP servers expose many tools and Tool Search is disabled, those schemas must be loaded upfront. A large collection of verbose tool descriptions and parameter schemas can therefore consume tens of thousands of tokens before the engineer enters any text.\u003cbr>Tool Search is specifically designed to prevent this form of context inflation. With Tool..."},"source":"CCAR-P_trainer.html","sourceSet":1,"sourceN":11},{"id":"diff-trainer-27","n":27,"topic":1,"type":"mcq","stem":{"en":"Engineering leadership wants to roll out Claude Skills to 280 developers across 14 teams. Skills will encode internal coding standards, code-review checklists, and incident-postmortem templates. Leadership has asked how to govern Skill authorship so that Skills remain trustworthy without bottlenecking on a single central team. Which governance model should you recommend?","vi":"Lãnh đạo kỹ thuật muốn triển khai Claude Skills cho 280 nhà phát triển thuộc 14 nhóm. Các kỹ năng sẽ mã hóa các tiêu chuẩn mã hóa nội bộ, danh sách kiểm tra đánh giá mã và các mẫu sau khi xảy ra sự cố. Ban lãnh đạo đã hỏi cách quản lý quyền tác giả Kỹ năng để Kỹ năng vẫn đáng tin cậy mà không gây cản trở cho một nhóm trung tâm duy nhất. Bạn nên giới thiệu mô hình quản trị nào?","jp":"エンジニアリングのリーダーシップは、14 チームの 280 人の開発者にクロード スキルを展開したいと考えています。 スキルは、内部コーディング標準、コードレビューチェックリスト、インシデント事後分析テンプレートをエンコードします。リーダーたちは、単一の中央チームがボトルネックになることなくスキルの信頼性を維持できるように、スキルの作成者を管理する方法を求めています。 どのガバナンス モデルを推奨する必要がありますか?"},"options":[{"k":"A","t":{"en":"Per-developer authorship across the 280 engineers with no team-level coordination required.","vi":"Quyền tác giả của mỗi nhà phát triển đối với 280 kỹ sư mà không cần sự phối hợp ở cấp độ nhóm.","jp":"チームレベルの調整を必要とせず、280 人のエンジニア全体にわたる開発者ごとのオーサーシップ。"}},{"k":"B","t":{"en":"Centralized authorship by a single platform team responsible for every Skill produced.","vi":"Quyền tác giả tập trung bởi một nhóm nền tảng duy nhất chịu trách nhiệm về mọi Kỹ năng được tạo ra.","jp":"作成されたすべてのスキルを担当する単一のプラットフォーム チームによる集中的な権限。"}},{"k":"C","t":{"en":"Fully decentralized authorship across the 14 teams with no review before publication.","vi":"Quyền tác giả được phân cấp hoàn toàn trên 14 nhóm mà không cần xem xét trước khi xuất bản.","jp":"著者は 14 チームに完全に分散されており、出版前にレビューはありません。"}},{"k":"D","t":{"en":"Federated authorship across the 14 teams with a central review and publication gate.","vi":"Quyền tác giả liên kết giữa 14 nhóm với cổng xuất bản và đánh giá trung tâm.","jp":"中央のレビューと出版ゲートを備えた 14 チームにわたる著者の連合。"}}],"answer":["D"],"multi":false,"explain":{"text":"Federated authorship allows each domain team to maintain the procedural knowledge it understands while preserving organization-wide trust through a central publication gate. Team authors can update coding standards, review practices, and postmortem procedures without waiting for a single platform group to write every change. Central reviewers can validate ownership, security, tool permissions, duplication, versioning, testing evidence, and compliance before publication. Perdeveloper or fully decentralized publication creates inconsistent and potentially unsafe Skills. Fully centralized authors..."},"source":"CCAR-P_trainer.html","sourceSet":2,"sourceN":27},{"id":"diff-trainer-106","n":106,"topic":1,"type":"mcq","stem":{"en":"You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration. Which two steps must be completed BEFORE piloting the configuration with a small group of engineers? (Select two.) Each correct answer presents part of the solution.  [Chọn 2 đáp án]","vi":"Bạn đang triển khai cấu hình Mã Claude được tiêu chuẩn hóa cho nhóm kỹ thuật và phải hoàn thành các bước lập kế hoạch trước khi thử nghiệm cấu hình. Hai bước nào phải được hoàn thành TRƯỚC KHI thí điểm cấu hình với một nhóm nhỏ kỹ sư? (Chọn hai.) Mỗi ​​câu trả lời đúng trình bày một phần của giải pháp.  [Chọn 2 đáp án]","jp":"標準化されたクロード コード構成をエンジニアリング チームに展開しようとしているため、構成を試験運用する前に計画手順を完了する必要があります。 少人数のエンジニア グループで構成を試験運用する前に、完了する必要がある 2 つの手順はどれですか? (2 つ選択してください。) それぞれの正解は、解決策の一部を示しています。  [Chọn 2 đáp án]"},"options":[{"k":"A","t":{"en":"Define the project-scope baseline covering Model Context Protocol (MCP) servers, permission rules, and subagents.","vi":"Xác định đường cơ sở của phạm vi dự án bao gồm các máy chủ Giao thức bối cảnh mô hình (MCP), quy tắc cấp phép và tác nhân phụ.","jp":"モデル コンテキスト プロトコル (MCP) サーバー、権限ルール、およびサブエージェントを対象とするプロジェクト スコープのベースラインを定義します。"}},{"k":"B","t":{"en":"Onboard every engineer in the organization to the new configuration through mandatory training sessions.","vi":"Đưa mọi kỹ sư trong tổ chức vào cấu hình mới thông qua các buổi đào tạo bắt buộc.","jp":"必須のトレーニング セッションを通じて、組織内のすべてのエンジニアを新しい構成に慣れさせます。"}},{"k":"C","t":{"en":"Roll out the stabilized configuration to additional teams with documentation and a defined support channel.","vi":"Triển khai cấu hình ổn định cho các nhóm bổ sung kèm theo tài liệu và kênh hỗ trợ được xác định.","jp":"ドキュメントと定義されたサポート チャネルを使用して、安定した構成を追加のチームに展開します。"}},{"k":"D","t":{"en":"Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope.","vi":"Xác định quy trình làm việc của nhóm, ranh giới bảo mật và quyết định nào thuộc về cấu hình được quản lý so với phạm vi dự án.","jp":"チームのワークフロー、セキュリティ境界、および管理対象の構成とプロジェクトの範囲に属する決定を特定します。"}},{"k":"E","t":{"en":"Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout.","vi":"Lặp lại cấu hình dựa trên những phát hiện thí điểm và ổn định đường cơ sở trước khi triển khai rộng hơn.","jp":"パイロットの結果に基づいて構成を繰り返し、より広範囲に展開する前にベースラインを安定させます。"}}],"answer":["A","D"],"multi":true,"explain":{"text":"Before a pilot begins, the architect must understand the workflows being enabled, the associated security boundaries, and the correct ownership of each configuration decision. Option D establishes this foundation.\u003cbr>Organization-wide, non-overridable controls belong in managed configuration, whereas repositoryspecific MCP servers, shared permissions, and team subagents generally belong in project scope.\u003cbr>Option A then converts those decisions into an initial project baseline that the pilot group can use.\u003cbr>The baseline should identify approved MCP endpoints, minimum permission rules, denied operati..."},"source":"CCAR-P_trainer.html","sourceSet":6,"sourceN":106}]},{"n":2,"title":{"vi":"Chỉ có ở learning_tool · 49 câu","en":"Learning tool only · 49 questions"},"questions":[{"id":"diff-learning-69","n":69,"topic":2,"type":"mcq","multi":false,"answer":["C"],"stem":{"en":"You are designing the prompt for a ticket-triage classifier with thirty well-defined categories and clear category\u003cbr>descriptions in the prompt.\u003cbr>\u003cbr>Which technique is most appropriate as the starting point?","vi":"Bạn đang thiết kế prompt cho một bộ phân loại ticket (ticket-triage classifier) với ba mươi danh mục được định nghĩa rõ và mô tả danh mục rõ ràng trong prompt.\u003cbr>\u003cbr>Kỹ thuật nào phù hợp nhất làm điểm khởi đầu?"},"options":[{"k":"A","t":{"en":"a prompt that demands the model invent new categories when the supplied ones do not fit","vi":"một prompt yêu cầu model tự tạo ra danh mục mới khi các danh mục được cung cấp không phù hợp"}},{"k":"B","t":{"en":"a chain-of-thought prompt for a routing decision that does not require multi-step reasoning","vi":"một prompt chain-of-thought cho một quyết định định tuyến không đòi hỏi suy luận nhiều bước"}},{"k":"C","t":{"en":"a zero-shot prompt that specifies the categories with their descriptions and the required output format","vi":"một prompt zero-shot nêu rõ các danh mục kèm mô tả và định dạng đầu ra bắt buộc"}},{"k":"D","t":{"en":"a prompt with no category descriptions, expecting the model to infer the category set","vi":"một prompt không có mô tả danh mục, kỳ vọng model tự suy ra tập danh mục"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> một prompt zero-shot nêu rõ các danh mục kèm mô tả và định dạng đầu ra bắt buộc\u003cbr>\u003cbr>Zero-shot với đủ tên, mô tả của 30 nhóm và định dạng đầu ra là điểm xuất phát hợp lý cho phân loại tập đóng. Đánh giá lỗi thực tế rồi mới bổ sung ví dụ hoặc cách xử lý khó hơn nếu cần, thay vì tăng độ phức tạp ngay từ đầu.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>một prompt yêu cầu model tự tạo ra danh mục mới khi các danh mục được cung cấp không phù hợp\u003c/strong>: Cho phép tự tạo nhóm làm phá vỡ tập 30 nhãn đã định nghĩa và hợp đồng routing phía sau.\u003cbr>- \u003cstrong>một prompt chain-of-thought cho một quyết định định tuyến không đòi hỏi suy luận nhiều bước\u003c/strong>: Yêu cầu suy luận nhiều bước cho quyết định đơn giản tăng độ phức tạp mà chưa có lỗi nào cho thấy cần thiết.\u003cbr>- \u003cstrong>một prompt không có mô tả danh mục, kỳ vọng model tự suy ra tập danh mục\u003c/strong>: Thiếu mô tả khiến model phải đoán ranh giới nhãn thay vì áp dụng quy tắc phân loại của hệ thống.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview\" target=\"_blank\" rel=\"noopener noreferrer\">Prompt engineering overview\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":9,"sourceN":69},{"id":"diff-learning-80","n":80,"topic":2,"type":"mcq","multi":true,"answer":["A","E"],"stem":{"en":"You are designing a human-in-the-loop validation workflow.\u003cbr>\u003cbr>Which two design elements belong in the workflow? (Choose two.)\u003cbr>Each correct answer presents a complete solution.","vi":"Bạn đang thiết kế một workflow xác thực có con người tham gia (human-in-the-loop).\u003cbr>\u003cbr>Hai yếu tố thiết kế nào thuộc workflow này? (Chọn hai.)\u003cbr>Mỗi đáp án đúng là một giải pháp hoàn chỉnh."},"options":[{"k":"A","t":{"en":"capture of reviewer decisions as labeled data that feeds the evaluation set over time","vi":"ghi nhận các quyết định của người rà soát dưới dạng dữ liệu có gán nhãn, bổ sung dần vào tập đánh giá theo thời gian"}},{"k":"B","t":{"en":"mandatory reviewer agreement with the model output to maintain consistent reviewer-model alignment","vi":"bắt buộc người rà soát đồng ý với đầu ra của model để duy trì sự thống nhất giữa người rà soát và model"}},{"k":"C","t":{"en":"aggregate reviewer throughput metrics published weekly to leadership for headcount planning","vi":"các metric tổng hợp về năng suất của người rà soát, được công bố hằng tuần cho ban lãnh đạo để hoạch định nhân sự"}},{"k":"D","t":{"en":"uniform sampling of all model outputs to give every request an equal chance of review","vi":"lấy mẫu đồng đều trên mọi đầu ra của model để mỗi yêu cầu đều có cơ hội được rà soát như nhau"}},{"k":"E","t":{"en":"risk-stratified sampling that concentrates reviewer attention on low-confidence and high-impact outputs","vi":"lấy mẫu phân tầng theo rủi ro (risk-stratified sampling), tập trung sự chú ý của người rà soát vào các đầu ra có độ tin cậy thấp và tác động cao"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> ghi nhận các quyết định của người rà soát dưới dạng dữ liệu có gán nhãn, bổ sung dần vào tập đánh giá theo thời gian; lấy mẫu phân tầng theo rủi ro (risk-stratified sampling), tập trung sự chú ý của người rà soát vào các đầu ra có độ tin cậy thấp và tác động cao\u003cbr>\u003cbr>Lấy mẫu theo rủi ro tập trung người duyệt vào kết quả thiếu chắc chắn hoặc tác động cao, nơi sai sót đáng quan tâm nhất. Ghi quyết định người duyệt thành nhãn và đưa vào bộ đánh giá biến giám sát thành bằng chứng để cải tiến; nhãn vẫn cần hướng dẫn và kiểm tra chất lượng.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>bắt buộc người rà soát đồng ý với đầu ra của model để duy trì sự thống nhất giữa người rà soát và model\u003c/strong>: Bắt người duyệt đồng ý với model triệt tiêu kiểm tra độc lập và che lỗi thay vì phát hiện lỗi.\u003cbr>- \u003cstrong>các metric tổng hợp về năng suất của người rà soát, được công bố hằng tuần cho ban lãnh đạo để hoạch định nhân sự\u003c/strong>: Throughput hữu ích cho lập kế hoạch nhân sự nhưng không quy định mẫu rủi ro hoặc nội dung phán xét chất lượng.\u003cbr>- \u003cstrong>lấy mẫu đồng đều trên mọi đầu ra của model để mỗi yêu cầu đều có cơ hội được rà soát như nhau\u003c/strong>: Lấy mẫu đều có ích để ước lượng chất lượng tổng thể, nhưng một mình nó có thể lấy quá ít trường hợp hiếm mà tác động cao; khóa ưu tiên phân tầng rủi ro.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/\" target=\"_blank\" rel=\"noopener noreferrer\">AI RMF Core\u003c/a>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success criteria and build evaluations\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":20,"sourceN":80},{"id":"diff-learning-90","n":90,"topic":2,"type":"mcq","multi":false,"answer":["C"],"stem":{"en":"You are defining where human review must remain in a planned automated pipeline.\u003cbr>\u003cbr>Which placement reflects sound human-in-the-loop design?","vi":"Bạn đang xác định những vị trí mà bước rà soát của con người phải được giữ lại trong một pipeline tự động đã được lên kế hoạch.\u003cbr>\u003cbr>Vị trí đặt nào phản ánh thiết kế human-in-the-loop đúng đắn?"},"options":[{"k":"A","t":{"en":"Remove all human review steps from the pipeline to maximize throughput, accepting that high-impact and irreversible actions will be taken without any human approval or oversight.","vi":"Loại bỏ mọi bước rà soát của con người khỏi pipeline để tối đa hóa thông lượng, chấp nhận rằng các hành động có tác động lớn và không thể đảo ngược sẽ được thực hiện mà không có bất kỳ sự phê duyệt hay giám sát nào của con người."}},{"k":"B","t":{"en":"Place a human reviewer in the loop for a randomly selected sample of requests, without defining criteria for what the reviewer should check or which output categories require mandatory review.","vi":"Đặt một người rà soát trong vòng lặp cho một mẫu yêu cầu được chọn ngẫu nhiên, mà không xác định tiêu chí người rà soát cần kiểm tra hay những loại đầu ra nào bắt buộc phải được rà soát."}},{"k":"C","t":{"en":"Place a human reviewer between the model’s output and any high-impact, irreversible action, with explicit criteria for what the reviewer must check before approval.","vi":"Đặt một người rà soát giữa đầu ra của model và bất kỳ hành động nào có tác động lớn, không thể đảo ngược, kèm theo tiêu chí rõ ràng về những gì người rà soát phải kiểm tra trước khi phê duyệt."}},{"k":"D","t":{"en":"Place a human reviewer only after the irreversible action has already executed, making the review a post-hoc audit rather than a meaningful pre-action check or approval gate.","vi":"Chỉ đặt người rà soát sau khi hành động không thể đảo ngược đã được thực thi, biến việc rà soát thành một cuộc kiểm toán hậu kỳ thay vì một bước kiểm tra hay cổng phê duyệt có ý nghĩa trước hành động."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Đặt một người rà soát giữa đầu ra của model và bất kỳ hành động nào có tác động lớn, không thể đảo ngược, kèm theo tiêu chí rõ ràng về những gì người rà soát phải kiểm tra trước khi phê duyệt.\u003cbr>\u003cbr>Đặt reviewer giữa đầu ra model và hành động tác động cao, không thể đảo ngược tạo cơ hội chặn lỗi trước khi gây hậu quả. Tiêu chí duyệt cụ thể giúp người duyệt biết phải kiểm gì và khi nào từ chối hoặc chuyển cấp, thay vì chỉ bấm đồng ý theo cảm tính.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Loại bỏ mọi bước rà soát của con người khỏi pipeline để tối đa hóa thông lượng, chấp nhận rằng các hành động có tác động lớn và không thể đảo ngược sẽ được thực hiện mà không có bất kỳ sự phê duyệt hay giám sát nào của con người.\u003c/strong>: Bỏ mọi review tối đa hóa throughput bằng cách loại luôn cơ hội kiểm soát trước hành động khó khắc phục.\u003cbr>- \u003cstrong>Đặt một người rà soát trong vòng lặp cho một mẫu yêu cầu được chọn ngẫu nhiên, mà không xác định tiêu chí người rà soát cần kiểm tra hay những loại đầu ra nào bắt buộc phải được rà soát.\u003c/strong>: Mẫu ngẫu nhiên không có tiêu chí có thể bỏ sót hành động nguy hiểm và khiến reviewer đánh giá không nhất quán.\u003cbr>- \u003cstrong>Chỉ đặt người rà soát sau khi hành động không thể đảo ngược đã được thực thi, biến việc rà soát thành một cuộc kiểm toán hậu kỳ thay vì một bước kiểm tra hay cổng phê duyệt có ý nghĩa trước hành động.\u003c/strong>: Duyệt sau hành động không thể đảo ngược chỉ còn là kiểm toán; nó không còn khả năng ngăn tác động ban đầu.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/\" target=\"_blank\" rel=\"noopener noreferrer\">AI RMF Core\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":30,"sourceN":90},{"id":"diff-learning-91","n":91,"topic":2,"type":"mcq","multi":false,"answer":["C"],"stem":{"en":"An engineer inadvertently commits an API key to the repository by placing it in .claude/settings.json.\u003cbr>\u003cbr>Which configuration design principle was violated?","vi":"Một kỹ sư vô tình commit một API key vào repository do đặt nó trong .claude/settings.json.\u003cbr>\u003cbr>Nguyên tắc thiết kế cấu hình nào đã bị vi phạm?"},"options":[{"k":"A","t":{"en":"Project-scope configuration should always override user-scope configuration.","vi":"Cấu hình project scope luôn phải ghi đè cấu hình user scope."}},{"k":"B","t":{"en":"MCP server definitions must reside in environment variables to prevent scope conflicts.","vi":"Các định nghĩa MCP server phải nằm trong biến môi trường để tránh xung đột scope."}},{"k":"C","t":{"en":"Credentials must be resolved at runtime from a secret store and never stored in version-controlled files.","vi":"Thông tin xác thực (credential) phải được lấy vào lúc chạy (runtime) từ một kho bí mật (secret store) và không bao giờ được lưu trong các tệp nằm dưới quản lý phiên bản."}},{"k":"D","t":{"en":"Managed configuration must be applied before project-scope configuration is read.","vi":"Cấu hình được quản lý (managed) phải được áp dụng trước khi cấu hình project scope được đọc."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Thông tin xác thực (credential) phải được lấy vào lúc chạy (runtime) từ một kho bí mật (secret store) và không bao giờ được lưu trong các tệp nằm dưới quản lý phiên bản.\u003cbr>\u003cbr>Credential phải được lấy lúc chạy từ cơ chế quản lý secret, không ghi giá trị khóa vào tệp theo dõi bằng Git. settings.json cấp dự án là nơi chia sẻ cấu hình, nên đưa khóa vào đó làm bí mật đi cùng lịch sử repository; thay đổi precedence không giải quyết rò rỉ này.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Cấu hình project scope luôn phải ghi đè cấu hình user scope.\u003c/strong>: Thứ tự ưu tiên cấu hình quyết định giá trị nào có hiệu lực, không quyết định liệu khóa đã bị công khai trong Git hay chưa.\u003cbr>- \u003cstrong>Các định nghĩa MCP server phải nằm trong biến môi trường để tránh xung đột scope.\u003c/strong>: MCP server có thể được định nghĩa trong tệp cấu hình; điều cần tách là giá trị secret, không phải bắt mọi định nghĩa nằm trong biến môi trường.\u003cbr>- \u003cstrong>Cấu hình được quản lý (managed) phải được áp dụng trước khi cấu hình project scope được đọc.\u003c/strong>: Đọc managed config trước không làm biến mất credential đã commit và không phải nguyên tắc lưu bí mật bị vi phạm ở đây.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/settings\" target=\"_blank\" rel=\"noopener noreferrer\">Settings files and precedence\u003c/a>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/security\" target=\"_blank\" rel=\"noopener noreferrer\">Security\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":31,"sourceN":91},{"id":"diff-learning-101","n":101,"topic":2,"type":"mcq","multi":true,"answer":["C","E"],"stem":{"en":"An architect at Trenova Systems, Inc. is reviewing two draft communication packages for the same architectural\u003cbr>decision.\u003cbr>\u003cbr>Package 1 contains a threat model, residual-risk register, and control-mapping table.\u003cbr>\u003cbr>Package 2 contains\u003cbr>a list of capabilities delivered and feature-level roadmap dependencies.\u003cbr>\u003cbr>Which two audiences are correctly matched to these packages? (Choose two.)","vi":"Một kiến trúc sư tại Trenova Systems, Inc. đang rà soát hai gói truyền thông dự thảo cho cùng một quyết định kiến trúc. Gói 1 gồm mô hình mối đe dọa (threat model), sổ đăng ký rủi ro tồn dư và bảng ánh xạ biện pháp kiểm soát. Gói 2 gồm danh sách các năng lực đã bàn giao và các phụ thuộc lộ trình (roadmap) ở cấp tính năng.\u003cbr>Hai đối tượng nào được ghép đúng với các gói này? (Chọn hai.)"},"options":[{"k":"A","t":{"en":"Package 2 --&gt; executive sponsor","vi":"Gói 2 --&gt; nhà tài trợ cấp điều hành (executive sponsor)"}},{"k":"B","t":{"en":"Package 1 --&gt; engineering implementation team","vi":"Gói 1 --&gt; nhóm kỹ thuật triển khai"}},{"k":"C","t":{"en":"Package 2 --&gt; product manager owning the roadmap","vi":"Gói 2 --&gt; product manager phụ trách lộ trình"}},{"k":"D","t":{"en":"Package 2 --&gt; security and compliance reviewer","vi":"Gói 2 --&gt; người rà soát bảo mật và tuân thủ"}},{"k":"E","t":{"en":"Package 1 --&gt; security and compliance reviewer","vi":"Gói 1 --&gt; người rà soát bảo mật và tuân thủ"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Gói 2 --&gt; product manager phụ trách lộ trình; Gói 1 --&gt; người rà soát bảo mật và tuân thủ\u003cbr>\u003cbr>Threat model, residual-risk register và bảng map kiểm soát phục vụ security/compliance reviewer đánh giá nguy cơ và độ bao phủ kiểm soát. Danh sách năng lực và phụ thuộc roadmap theo tính năng phù hợp product manager quyết định thứ tự giao hàng; đây là hai audience khớp trực tiếp nhất, dù tài liệu có thể được chia sẻ rộng hơn.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Gói 2 --&gt; nhà tài trợ cấp điều hành (executive sponsor)\u003c/strong>: Executive sponsor có thể quan tâm năng lực, nhưng package theo phụ thuộc từng tính năng trực tiếp phục vụ người quản lý roadmap hơn bản tổng hợp giá trị và quyết định đầu tư.\u003cbr>- \u003cstrong>Gói 1 --&gt; nhóm kỹ thuật triển khai\u003c/strong>: Kỹ sư có thể dùng threat model, nhưng một bộ chủ yếu rủi ro và mapping kiểm soát không thay hợp đồng giao diện, luồng thực thi và cấu hình cần để xây.\u003cbr>- \u003cstrong>Gói 2 --&gt; người rà soát bảo mật và tuân thủ\u003c/strong>: Danh sách feature và roadmap không cung cấp phân tích đe dọa hay bằng chứng kiểm soát mà người duyệt tuân thủ cần.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/\" target=\"_blank\" rel=\"noopener noreferrer\">AI RMF Core\u003c/a>\u003cbr>- \u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html\" target=\"_blank\" rel=\"noopener noreferrer\">Architectural decision record process\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":41,"sourceN":101},{"id":"diff-learning-102","n":102,"topic":2,"type":"mcq","multi":false,"answer":["D"],"stem":{"en":"You are reviewing a peer’s draft ADR.\u003cbr>\u003cbr>The ADR states the decision and the technical detail but does not state the\u003cbr>alternatives considered or the trade-offs accepted.\u003cbr>\u003cbr>Which response is most appropriate?","vi":"Bạn đang rà soát bản nháp ADR của một đồng nghiệp. ADR nêu quyết định và chi tiết kỹ thuật nhưng không nêu các phương án thay thế đã cân nhắc hay các đánh đổi đã chấp nhận.\u003cbr>\u003cbr>Cách phản hồi nào phù hợp nhất?"},"options":[{"k":"A","t":{"en":"Delete the ADR entirely and rely on the engineering team’s collective memory to reconstruct the decision context, alternatives, and trade-offs during future audits or onboarding.","vi":"Xóa hoàn toàn ADR và dựa vào trí nhớ tập thể của nhóm kỹ thuật để tái dựng bối cảnh quyết định, các phương án thay thế và các đánh đổi trong các đợt kiểm toán hoặc onboarding sau này."}},{"k":"B","t":{"en":"Approve the ADR as written on the grounds that the decision itself is documented, accepting that reviewers and future maintainers will lack the context to evaluate or revisit it.","vi":"Phê duyệt ADR như đã viết với lý do bản thân quyết định đã được ghi lại, chấp nhận rằng người rà soát và những người bảo trì sau này sẽ thiếu bối cảnh để đánh giá hoặc xem xét lại quyết định."}},{"k":"C","t":{"en":"Replace the ADR with a different decision unrelated to the one drafted.","vi":"Thay ADR bằng một quyết định khác không liên quan đến quyết định đã được soạn thảo."}},{"k":"D","t":{"en":"Ask the author to add the alternatives considered and the trade-offs accepted before publishing the ADR.","vi":"Yêu cầu tác giả bổ sung các phương án thay thế đã cân nhắc và các đánh đổi đã chấp nhận trước khi công bố ADR."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Yêu cầu tác giả bổ sung các phương án thay thế đã cân nhắc và các đánh đổi đã chấp nhận trước khi công bố ADR.\u003cbr>\u003cbr>Yêu cầu bổ sung các lựa chọn đã cân nhắc và đánh đổi được chấp nhận giúp ADR giải thích vì sao quyết định phù hợp với ràng buộc khi đó. Người bảo trì sau này có thể xem điều kiện nào đã đổi trước khi quyết định lại, thay vì chỉ thấy chi tiết kỹ thuật của giải pháp được chọn.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Xóa hoàn toàn ADR và dựa vào trí nhớ tập thể của nhóm kỹ thuật để tái dựng bối cảnh quyết định, các phương án thay thế và các đánh đổi trong các đợt kiểm toán hoặc onboarding sau này.\u003c/strong>: Xóa ADR làm mất cả quyết định đã ghi và phụ thuộc trí nhớ của người có thể không còn ở dự án.\u003cbr>- \u003cstrong>Phê duyệt ADR như đã viết với lý do bản thân quyết định đã được ghi lại, chấp nhận rằng người rà soát và những người bảo trì sau này sẽ thiếu bối cảnh để đánh giá hoặc xem xét lại quyết định.\u003c/strong>: Chỉ phê duyệt quyết định hiện tại để lại thiếu lý do và hệ quả, khiến người sau khó đánh giá hoặc điều chỉnh.\u003cbr>- \u003cstrong>Thay ADR bằng một quyết định khác không liên quan đến quyết định đã được soạn thảo.\u003c/strong>: Đổi sang quyết định không liên quan không sửa tài liệu thiếu và còn thay phạm vi mà không có lý do từ bài toán.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html\" target=\"_blank\" rel=\"noopener noreferrer\">Architectural decision record process\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":42,"sourceN":102},{"id":"diff-learning-103","n":103,"topic":2,"type":"mcq","multi":true,"answer":["A","C"],"stem":{"en":"You are running a discovery engagement for a new Claude-based capability and must complete the requirements-\u003cbr>gathering steps before validating with stakeholders.\u003cbr>\u003cbr>Which two steps must be completed BEFORE validating the captured requirements with stakeholders? (Choose\u003cbr>two.)\u003cbr>Each correct answer presents part of the solution.","vi":"Bạn đang thực hiện một đợt khám phá (discovery) cho một năng lực mới dựa trên Claude và phải hoàn tất các bước thu thập yêu cầu trước khi xác nhận với các bên liên quan.\u003cbr>\u003cbr>Hai bước nào phải được hoàn tất TRƯỚC KHI xác nhận các yêu cầu đã thu thập với các bên liên quan? (Chọn hai.)\u003cbr>Mỗi đáp án đúng là một phần của giải pháp."},"options":[{"k":"A","t":{"en":"Capture the business goals, success criteria, and the in-scope user population for the engagement.","vi":"Ghi nhận các mục tiêu kinh doanh, tiêu chí thành công và nhóm người dùng nằm trong phạm vi của đợt triển khai."}},{"k":"B","t":{"en":"Produce architecture decision records that capture the rationale for major design choices.","vi":"Soạn các bản ghi quyết định kiến trúc (ADR) ghi lại lý do cho các lựa chọn thiết kế quan trọng."}},{"k":"C","t":{"en":"Identify the non-functional constraints covering latency, cost, audit, data sensitivity, and regulatory needs.","vi":"Xác định các ràng buộc phi chức năng bao gồm latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu và các yêu cầu pháp lý."}},{"k":"D","t":{"en":"Schedule the rollout milestones and dependencies with engineering and product partners.","vi":"Lên lịch các mốc triển khai và các phụ thuộc với các đối tác kỹ thuật và sản phẩm."}},{"k":"E","t":{"en":"Document the consolidated requirements with traceability to the source stakeholder for each item.","vi":"Ghi lại các yêu cầu đã hợp nhất, kèm khả năng truy vết tới bên liên quan là nguồn gốc của từng mục."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Ghi nhận các mục tiêu kinh doanh, tiêu chí thành công và nhóm người dùng nằm trong phạm vi của đợt triển khai.; Xác định các ràng buộc phi chức năng bao gồm latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu và các yêu cầu pháp lý.\u003cbr>\u003cbr>Mục tiêu kinh doanh, tiêu chí thành công và nhóm người dùng xác định kết quả và phạm vi cần xác nhận. Các giới hạn latency, chi phí, audit, dữ liệu và quy định xác định điều kiện giải pháp phải đáp ứng. Khóa nguồn chọn hai nhóm nội dung này, nhưng tài liệu hợp nhất có traceability cũng có thể cần trước validation; không nên diễn giải rằng việc ghi yêu cầu chỉ làm sau khi xác nhận.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Soạn các bản ghi quyết định kiến trúc (ADR) ghi lại lý do cho các lựa chọn thiết kế quan trọng.\u003c/strong>: ADR ghi lựa chọn thiết kế dựa trên yêu cầu; chốt lý do kiến trúc không phải công việc thu thập yêu cầu cốt lõi trước xác nhận.\u003cbr>- \u003cstrong>Lên lịch các mốc triển khai và các phụ thuộc với các đối tác kỹ thuật và sản phẩm.\u003c/strong>: Mốc rollout và phụ thuộc là kế hoạch giao hàng cần dựa vào phạm vi đã hiểu, không thay việc thu thập mục tiêu và ràng buộc.\u003cbr>- \u003cstrong>Ghi lại các yêu cầu đã hợp nhất, kèm khả năng truy vết tới bên liên quan là nguồn gốc của từng mục.\u003c/strong>: Hợp nhất yêu cầu và chỉ ra stakeholder nguồn là thực hành đúng, có thể phải có trước validation. Vì thế đây là phương án hợp lý ngoài khóa, làm câu hỏi choose-two cần sửa.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Giữ khóa nguồn. Documentation có traceability cũng là bước có thể phải hoàn tất trước validation; nên hỏi hai nhóm nội dung cần thu thập để tránh nhiều hơn hai đáp án hợp lý.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success criteria and build evaluations\u003c/a>\u003cbr>- \u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html\" target=\"_blank\" rel=\"noopener noreferrer\">Architectural decision record process\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":43,"sourceN":103},{"id":"diff-learning-105","n":105,"topic":2,"type":"mcq","multi":false,"answer":["C"],"stem":{"en":"You are selecting the documentation set that should accompany a Claude-based deployment at handoff.\u003cbr>\u003cbr>Which set is most complete?","vi":"Bạn đang chọn bộ tài liệu đi kèm một hệ thống triển khai dựa trên Claude khi bàn giao.\u003cbr>\u003cbr>Bộ tài liệu nào đầy đủ nhất?"},"options":[{"k":"A","t":{"en":"a verbal handover walkthrough conducted on the day of transition, with no written architecture overview, ADRs, runbooks, playbook, or known limitations captured for future reference","vi":"một buổi hướng dẫn bàn giao bằng lời vào ngày chuyển giao, không có bản tổng quan kiến trúc, ADR, runbook, playbook hay các giới hạn đã biết được ghi lại bằng văn bản để tham khảo sau này"}},{"k":"B","t":{"en":"code comments scattered across individual source files with no integrating architecture overview, no ADRs, no runbooks, and no on-call playbook to orient operators or new team members","vi":"các chú thích mã (code comment) rải rác trong từng tệp nguồn, không có bản tổng quan kiến trúc tích hợp, không có ADR, không có runbook và không có playbook trực on-call để định hướng cho người vận hành hay thành viên mới"}},{"k":"C","t":{"en":"architecture overview, ADRs, component-level diagrams, runbooks for common operations, on-call playbook, and a list of known limitations","vi":"bản tổng quan kiến trúc, ADR, sơ đồ cấp thành phần, runbook cho các thao tác vận hành thường gặp, playbook trực on-call và danh sách các giới hạn đã biết"}},{"k":"D","t":{"en":"a single one-page architecture diagram with no ADRs, no runbooks, no on-call playbook, and no list of known limitations to support operators or future maintainers","vi":"một sơ đồ kiến trúc duy nhất dài một trang, không có ADR, không có runbook, không có playbook trực on-call và không có danh sách các giới hạn đã biết để hỗ trợ người vận hành hay những người bảo trì sau này"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> bản tổng quan kiến trúc, ADR, sơ đồ cấp thành phần, runbook cho các thao tác vận hành thường gặp, playbook trực on-call và danh sách các giới hạn đã biết\u003cbr>\u003cbr>Bộ gồm tổng quan kiến trúc, ADR, sơ đồ thành phần, runbook, playbook on-call và giới hạn đã biết bao phủ cách hệ thống tổ chức, vì sao được chọn, cách vận hành và khi nào cần can thiệp. Sự kết hợp này giúp nhóm nhận bàn giao có tài liệu bền vững cho cả bảo trì lẫn sự cố.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>một buổi hướng dẫn bàn giao bằng lời vào ngày chuyển giao, không có bản tổng quan kiến trúc, ADR, runbook, playbook hay các giới hạn đã biết được ghi lại bằng văn bản để tham khảo sau này\u003c/strong>: Walkthrough bằng lời có thể bổ trợ nhưng không lưu cách vận hành hoặc giới hạn để người vắng mặt và ca trực tương lai tra cứu.\u003cbr>- \u003cstrong>các chú thích mã (code comment) rải rác trong từng tệp nguồn, không có bản tổng quan kiến trúc tích hợp, không có ADR, không có runbook và không có playbook trực on-call để định hướng cho người vận hành hay thành viên mới\u003c/strong>: Comment mã giải thích cục bộ, không kết nối bức tranh hệ thống, lý do quyết định và hành động xử lý sự cố.\u003cbr>- \u003cstrong>một sơ đồ kiến trúc duy nhất dài một trang, không có ADR, không có runbook, không có playbook trực on-call và không có danh sách các giới hạn đã biết để hỗ trợ người vận hành hay những người bảo trì sau này\u003c/strong>: Một sơ đồ một trang cho biết hình dạng hệ thống nhưng thiếu hướng dẫn thao tác, hệ quả quyết định và giới hạn cần khi vận hành.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html\" target=\"_blank\" rel=\"noopener noreferrer\">Architectural decision record process\u003c/a>\u003cbr>- \u003ca href=\"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/\" target=\"_blank\" rel=\"noopener noreferrer\">AI RMF Core\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":45,"sourceN":105},{"id":"diff-learning-109","n":109,"topic":2,"type":"mcq","multi":false,"answer":["B"],"stem":{"en":"You are running a discovery session with a business sponsor who asks for “an AI system to fix our customer\u003cbr>escalations”\u003cbr>.\u003cbr>\u003cbr>Which approach best yields actionable requirements?","vi":"Bạn đang tổ chức một buổi khám phá (discovery) với một nhà tài trợ nghiệp vụ, người yêu cầu “một hệ thống AI để khắc phục các vụ leo thang khiếu nại của khách hàng”.\u003cbr>\u003cbr>Cách tiếp cận nào mang lại các yêu cầu có thể hành động được tốt nhất?"},"options":[{"k":"A","t":{"en":"Defer the discovery session indefinitely on the grounds that the sponsor must fully specify the system before the architect can ask any clarifying or scoping questions.","vi":"Hoãn buổi khám phá vô thời hạn với lý do nhà tài trợ phải đặc tả đầy đủ hệ thống trước khi kiến trúc sư có thể đặt bất kỳ câu hỏi làm rõ hay xác định phạm vi nào."}},{"k":"B","t":{"en":"Decompose the request by asking targeted questions about who escalates, what triggers escalation, what good resolution looks like, and which constraints (latency, cost, audit, data sensitivity) apply.","vi":"Phân rã yêu cầu bằng cách đặt các câu hỏi có trọng tâm về việc ai leo thang, điều gì kích hoạt leo thang, một cách giải quyết tốt trông như thế nào, và những ràng buộc nào (latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu) được áp dụng."}},{"k":"C","t":{"en":"Accept the sponsor’s original phrasing as a complete and final requirement and proceed directly to design without asking targeted questions to surface actors, triggers, or constraints.","vi":"Chấp nhận cách diễn đạt ban đầu của nhà tài trợ như một yêu cầu hoàn chỉnh và cuối cùng, rồi chuyển thẳng sang thiết kế mà không đặt các câu hỏi có trọng tâm để làm rõ các tác nhân, điều kiện kích hoạt hay ràng buộc."}},{"k":"D","t":{"en":"Assume the requirement matches the architect’s previous engagement in a different industry and proceed with that context, without validating actors, triggers, or constraints for this sponsor.","vi":"Giả định rằng yêu cầu giống với dự án trước đây của kiến trúc sư trong một ngành khác và tiếp tục với bối cảnh đó, mà không xác nhận các tác nhân, điều kiện kích hoạt hay ràng buộc đối với nhà tài trợ này."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Phân rã yêu cầu bằng cách đặt các câu hỏi có trọng tâm về việc ai leo thang, điều gì kích hoạt leo thang, một cách giải quyết tốt trông như thế nào, và những ràng buộc nào (latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu) được áp dụng.\u003cbr>\u003cbr>Tách yêu cầu “sửa escalations” thành người tham gia, trigger, kết quả tốt và ràng buộc tạo yêu cầu có thể thiết kế và kiểm thử. Các câu hỏi latency, chi phí, audit và độ nhạy dữ liệu giúp giới hạn giải pháp trước khi chọn kỹ thuật.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Hoãn buổi khám phá vô thời hạn với lý do nhà tài trợ phải đặc tả đầy đủ hệ thống trước khi kiến trúc sư có thể đặt bất kỳ câu hỏi làm rõ hay xác định phạm vi nào.\u003c/strong>: Hoãn vô hạn đòi sponsor tự làm toàn bộ discovery, trong khi vai trò của architect là giúp làm rõ đề bài.\u003cbr>- \u003cstrong>Chấp nhận cách diễn đạt ban đầu của nhà tài trợ như một yêu cầu hoàn chỉnh và cuối cùng, rồi chuyển thẳng sang thiết kế mà không đặt các câu hỏi có trọng tâm để làm rõ các tác nhân, điều kiện kích hoạt hay ràng buộc.\u003c/strong>: Chấp nhận câu chung là yêu cầu cuối cùng bỏ trống tác nhân, trigger và tiêu chí thành công để đánh giá thiết kế.\u003cbr>- \u003cstrong>Giả định rằng yêu cầu giống với dự án trước đây của kiến trúc sư trong một ngành khác và tiếp tục với bối cảnh đó, mà không xác nhận các tác nhân, điều kiện kích hoạt hay ràng buộc đối với nhà tài trợ này.\u003c/strong>: Mượn nguyên bối cảnh ngành khác có thể nhập sai quy trình hoặc giới hạn dữ liệu chưa được sponsor xác nhận.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success criteria and build evaluations\u003c/a>\u003cbr>- \u003ca href=\"https://airc.nist.gov/airmf-resources/airmf/5-sec-core/\" target=\"_blank\" rel=\"noopener noreferrer\">AI RMF Core\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":49,"sourceN":109},{"id":"diff-learning-118","n":118,"topic":2,"type":"mcq","multi":true,"answer":["C","D"],"stem":{"en":"You are resolving a Claude Code operational issue reported by the team and must complete the diagnostic steps\u003cbr>before applying a targeted fix.\u003cbr>\u003cbr>Which two steps must be completed BEFORE applying the targeted fix? (Choose two.)\u003cbr>Each correct answer presents part of the solution.","vi":"Bạn đang xử lý một sự cố vận hành Claude Code do nhóm báo cáo và phải hoàn tất các bước chẩn đoán trước khi áp dụng một bản sửa lỗi có mục tiêu.\u003cbr>\u003cbr>Hai bước nào phải được hoàn tất TRƯỚC KHI áp dụng bản sửa lỗi có mục tiêu? (Chọn hai.)\u003cbr>Mỗi đáp án đúng là một phần của giải pháp."},"options":[{"k":"A","t":{"en":"Open a permanent change request in the change-management system to formalize the upcoming fix.","vi":"Mở một yêu cầu thay đổi (change request) thường trực trong hệ thống quản lý thay đổi để chính thức hóa bản sửa lỗi sắp tới."}},{"k":"B","t":{"en":"Document the root cause and the fix in the team runbook for future occurrences.","vi":"Ghi lại nguyên nhân gốc và bản sửa lỗi vào runbook của nhóm cho các lần xảy ra sau."}},{"k":"C","t":{"en":"Form a hypothesis about the most likely root cause given the symptom, configuration, and recent changes.","vi":"Đưa ra giả thuyết về nguyên nhân gốc có khả năng nhất dựa trên triệu chứng, cấu hình và các thay đổi gần đây."}},{"k":"D","t":{"en":"Reproduce the issue with a minimal reproduction case to confirm the symptom and isolate variables.","vi":"Tái hiện sự cố bằng một trường hợp tái hiện tối giản để xác nhận triệu chứng và cô lập các biến."}},{"k":"E","t":{"en":"Notify the affected users that a fix has been deployed and the operational issue is resolved.","vi":"Thông báo cho người dùng bị ảnh hưởng rằng bản sửa lỗi đã được triển khai và sự cố vận hành đã được giải quyết."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Đưa ra giả thuyết về nguyên nhân gốc có khả năng nhất dựa trên triệu chứng, cấu hình và các thay đổi gần đây.; Tái hiện sự cố bằng một trường hợp tái hiện tối giản để xác nhận triệu chứng và cô lập các biến.\u003cbr>\u003cbr>Giả thuyết dựa trên triệu chứng, cấu hình và thay đổi gần đây định hướng điều cần kiểm tra. Tái hiện tối thiểu loại bỏ biến nhiễu và xác nhận lỗi, nhờ đó bản sửa nhắm vào nguyên nhân thay vì phỏng đoán.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Mở một yêu cầu thay đổi (change request) thường trực trong hệ thống quản lý thay đổi để chính thức hóa bản sửa lỗi sắp tới.\u003c/strong>: Change request có thể là thủ tục bắt buộc nhưng không xác định nguyên nhân.\u003cbr>- \u003cstrong>Ghi lại nguyên nhân gốc và bản sửa lỗi vào runbook của nhóm cho các lần xảy ra sau.\u003c/strong>: Runbook cần kết luận đã được kiểm chứng; chưa thể ghi bản sửa là đúng trước chẩn đoán.\u003cbr>- \u003cstrong>Thông báo cho người dùng bị ảnh hưởng rằng bản sửa lỗi đã được triển khai và sự cố vận hành đã được giải quyết.\u003c/strong>: Thông báo đã giải quyết phải chờ triển khai và kiểm tra thành công.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/mcp\" target=\"_blank\" rel=\"noopener noreferrer\">Connect Claude Code to tools via MCP\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":58,"sourceN":118},{"id":"diff-learning-119","n":119,"topic":2,"type":"mcq","multi":true,"answer":["A","B"],"stem":{"en":"A Claude architect is configuring a shared Claude Code environment for a twelve-person development team.\u003cbr>\u003cbr>Which two configuration decisions most directly establish a consistent, secure team environment? (Choose two.)","vi":"Một kiến trúc sư Claude đang cấu hình một môi trường Claude Code dùng chung cho một nhóm phát triển mười hai người.\u003cbr>\u003cbr>Hai quyết định cấu hình nào thiết lập trực tiếp nhất một môi trường nhóm nhất quán và an toàn? (Chọn hai.)"},"options":[{"k":"A","t":{"en":"applying managed configuration to enforce non-overridable security and compliance policies across all team members","vi":"áp dụng cấu hình được quản lý (managed configuration) để thực thi các chính sách bảo mật và tuân thủ không thể ghi đè đối với mọi thành viên trong nhóm"}},{"k":"B","t":{"en":"committing shared MCP server definitions and tool permissions in project-scope configuration files alongside the repository","vi":"commit các định nghĩa MCP server và quyền tool dùng chung trong các tệp cấu hình project scope cùng với repository"}},{"k":"C","t":{"en":"instructing each engineer to configure their preferred Claude model in personal user-scope settings","vi":"hướng dẫn mỗi kỹ sư cấu hình model Claude ưa thích của mình trong thiết lập user scope cá nhân"}},{"k":"D","t":{"en":"storing the team’s shared API key in the project-scope settings.json so all engineers use the same credential","vi":"lưu API key dùng chung của nhóm trong settings.json ở project scope để mọi kỹ sư dùng cùng một thông tin xác thực"}},{"k":"E","t":{"en":"setting editor theme and display preferences at the project scope so they are uniform across workstations","vi":"đặt giao diện (theme) trình soạn thảo và các tùy chọn hiển thị ở project scope để chúng đồng nhất trên mọi máy trạm"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> áp dụng cấu hình được quản lý (managed configuration) để thực thi các chính sách bảo mật và tuân thủ không thể ghi đè đối với mọi thành viên trong nhóm; commit các định nghĩa MCP server và quyền tool dùng chung trong các tệp cấu hình project scope cùng với repository\u003cbr>\u003cbr>Managed settings đặt chính sách bảo mật ở tầng ưu tiên tổ chức. Cấu hình project được commit chia sẻ bộ MCP và permissions cho cùng repository. Hai tầng bổ sung nhau: mặc định chung cho nhóm và giới hạn do quản trị viên áp đặt.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>hướng dẫn mỗi kỹ sư cấu hình model Claude ưa thích của mình trong thiết lập user scope cá nhân\u003c/strong>: Tùy chọn model cá nhân không thiết lập chính sách bảo mật chung.\u003cbr>- \u003cstrong>lưu API key dùng chung của nhóm trong settings.json ở project scope để mọi kỹ sư dùng cùng một thông tin xác thực\u003c/strong>: Commit API key làm lộ bí mật và khó thu hồi quyền riêng từng người.\u
