003cbr>- \u003cstrong>đặt giao diện (theme) trình soạn thảo và các tùy chọn hiển thị ở project scope để chúng đồng nhất trên mọi máy trạm\u003c/strong>: Theme editor chỉ ảnh hưởng trình bày, không kiểm soát quyền công cụ.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/settings\" target=\"_blank\" rel=\"noopener noreferrer\">Settings files and precedence\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":59,"sourceN":119},{"id":"diff-learning-120","n":120,"topic":2,"type":"mcq","multi":false,"answer":["D"],"stem":{"en":"You are configuring Claude Code for a team that needs every engineer to share the same MCP server set,\u003cbr>permission rules, and project context across the engineering monorepo.\u003cbr>\u003cbr>Which configuration scope best supports this requirement?","vi":"Bạn đang cấu hình Claude Code cho một nhóm cần mọi kỹ sư dùng chung cùng một bộ MCP server, quy tắc quyền và ngữ cảnh project trên toàn bộ monorepo kỹ thuật.\u003cbr>\u003cbr>Scope cấu hình nào hỗ trợ tốt nhất yêu cầu này?"},"options":[{"k":"A","t":{"en":"user scope configured individually on each engineer’s machine, with no shared configuration committed to the repository and no guarantee of consistency across the team","vi":"user scope được cấu hình riêng trên máy của từng kỹ sư, không có cấu hình dùng chung nào được commit vào repository và không có bảo đảm về tính nhất quán trong nhóm"}},{"k":"B","t":{"en":"user scope with the MCP server definitions and permission rules placed in each engineer’s ~/.claude/settings.json and synchronized manually via a shared setup script outside version control","vi":"user scope với các định nghĩa MCP server và quy tắc quyền được đặt trong ~/.claude/settings.json của từng kỹ sư và được đồng bộ thủ công thông qua một script thiết lập dùng chung nằm ngoài hệ thống quản lý phiên bản"}},{"k":"C","t":{"en":"local scope configured only on the lead architect’s machine, with no configuration present on other engineers’ machines and no mechanism to distribute MCP servers or permission rules","vi":"local scope chỉ được cấu hình trên máy của kiến trúc sư trưởng, không có cấu hình nào trên máy của các kỹ sư khác và không có cơ chế phân phối MCP server hay quy tắc quyền"}},{"k":"D","t":{"en":"project scope, with the configuration committed to the repository so every engineer working in the project picks up the same MCP servers, permissions, and context","vi":"project scope, với cấu hình được commit vào repository để mọi kỹ sư làm việc trong project đều nhận được cùng các MCP server, quyền và ngữ cảnh"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> project scope, với cấu hình được commit vào repository để mọi kỹ sư làm việc trong project đều nhận được cùng các MCP server, quyền và ngữ cảnh\u003cbr>\u003cbr>Project scope đưa cấu hình đi cùng monorepo: MCP trong .mcp.json, permissions trong .claude/settings.json và hướng dẫn dự án trong CLAUDE.md. Version control giúp nhóm cùng nhận thay đổi đã review; không có nghĩa mọi loại dữ liệu đều nằm trong một file.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>user scope được cấu hình riêng trên máy của từng kỹ sư, không có cấu hình dùng chung nào được commit vào repository và không có bảo đảm về tính nhất quán trong nhóm\u003c/strong>: Cấu hình user độc lập không đảm bảo đồng nhất theo repository.\u003cbr>- \u003cstrong>user scope với các định nghĩa MCP server và quy tắc quyền được đặt trong ~/.claude/settings.json của từng kỹ sư và được đồng bộ thủ công thông qua một script thiết lập dùng chung nằm ngoài hệ thống quản lý phiên bản\u003c/strong>: Đồng bộ tay ngoài version control dễ lệch phiên bản và không gắn thay đổi với mã.\u003cbr>- \u003cstrong>local scope chỉ được cấu hình trên máy của kiến trúc sư trưởng, không có cấu hình nào trên máy của các kỹ sư khác và không có cơ chế phân phối MCP server hay quy tắc quyền\u003c/strong>: Cấu hình local của người trưởng nhóm không phân phối sang máy đồng nghiệp.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/settings\" target=\"_blank\" rel=\"noopener noreferrer\">Settings files and precedence\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":2,"sourceI":60,"sourceN":120},{"id":"diff-learning-128","n":128,"topic":2,"type":"mcq","multi":false,"answer":["B"],"stem":{"en":"You are comparing two configurations for an internal compliance Q &amp; A assistant.\u003cbr>\u003cbr>Configuration X reduces top-k retrieval and uses a lighter model, lowering p95 latency by 38 percent while producing a measured 2 percent reduction in the accuracy benchmark.\u003cbr>\u003cbr>Configuration Y retains the existing top-k retrieval setting and heavier model, with unchanged p95 latency and no measurable change in accuracy.\u003cbr>\u003cbr>The deployment's stated priorities are accuracy first and latency second.\u003cbr>\u003cbr>Which configuration is the better recommendation?","vi":"Bạn đang so sánh hai cấu hình cho một trợ lý hỏi đáp (Q&amp;A) nội bộ về tuân thủ (compliance).\u003cbr>\u003cbr>Cấu hình X giảm top-k retrieval và dùng một model nhẹ hơn, giúp giảm 38% độ trễ p95 nhưng làm độ chính xác trên benchmark giảm 2% (đo được).\u003cbr>\u003cbr>Cấu hình Y giữ nguyên thiết lập top-k retrieval hiện tại và model nặng hơn, với độ trễ p95 không đổi và không có thay đổi đo được về độ chính xác.\u003cbr>\u003cbr>Các ưu tiên đã nêu của đợt triển khai là độ chính xác trước, độ trễ sau.\u003cbr>\u003cbr>Cấu hình nào là khuyến nghị tốt hơn?"},"options":[{"k":"A","t":{"en":"Configuration X, because the 2 percent accuracy reduction falls within normal benchmark variance and is not a meaningful regression.","vi":"Cấu hình X, vì mức giảm 2% độ chính xác nằm trong biên độ dao động thông thường của benchmark và không phải là một sự suy giảm (regression) đáng kể."}},{"k":"B","t":{"en":"Configuration Y, because the deployment's stated priority is accuracy first, and Configuration X produces a measured reduction in accuracy.","vi":"Cấu hình Y, vì ưu tiên đã nêu của đợt triển khai là độ chính xác trước tiên, và Cấu hình X tạo ra mức giảm độ chính xác đo được."}},{"k":"C","t":{"en":"Configuration X, because lower latency generally matters more than accuracy, regardless of the deployment's stated priorities.","vi":"Cấu hình X, vì độ trễ thấp hơn nhìn chung quan trọng hơn độ chính xác, bất kể các ưu tiên đã nêu của đợt triển khai."}},{"k":"D","t":{"en":"Configuration X, because a 38 percent latency improvement outweighs a 2 percent accuracy reduction as a general rule across compliance deployments.","vi":"Cấu hình X, vì mức cải thiện 38% về độ trễ có giá trị lớn hơn mức giảm 2% độ chính xác, như một quy tắc chung cho mọi đợt triển khai về compliance."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Cấu hình Y, vì ưu tiên đã nêu của đợt triển khai là độ chính xác trước tiên, và Cấu hình X tạo ra mức giảm độ chính xác đo được.\u003cbr>\u003cbr>Giữ cấu hình hiện tại bảo toàn độ chính xác, tiêu chí được ưu tiên trước. Mức giảm p95 38% chỉ là lợi ích sau đó; chưa có ngưỡng chấp nhận hoặc bằng chứng rằng giảm chính xác 2% là nhiễu để cho phép đánh đổi.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Cấu hình X, vì mức giảm 2% độ chính xác nằm trong biên độ dao động thông thường của benchmark và không phải là một sự suy giảm (regression) đáng kể.\u003c/strong>: Không thể tự gọi mức giảm đã đo là biến thiên bình thường khi thiếu khoảng tin cậy hoặc thử lặp.\u003cbr>- \u003cstrong>Cấu hình X, vì độ trễ thấp hơn nhìn chung quan trọng hơn độ chính xác, bất kể các ưu tiên đã nêu của đợt triển khai.\u003c/strong>: Ưu tiên độ trễ chung không thay thế ưu tiên chính xác mà triển khai đã nêu.\u003cbr>- \u003cstrong>Cấu hình X, vì mức cải thiện 38% về độ trễ có giá trị lớn hơn mức giảm 2% độ chính xác, như một quy tắc chung cho mọi đợt triển khai về compliance.\u003c/strong>: Hai phần trăm của các metric khác nhau không có tỷ giá đánh đổi phổ quát.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success and build evaluations\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":2,"sourceN":128},{"id":"diff-learning-130","n":130,"topic":2,"type":"mcq","multi":false,"answer":["B"],"stem":{"en":"A senior architect is preparing briefing materials on a new retrieval architecture.\u003cbr>\u003cbr>The executive sponsor has requested a summary of the architectural decision.\u003cbr>\u003cbr>Which framing is most appropriate for that audience?","vi":"Một kiến trúc sư cấp cao đang chuẩn bị tài liệu báo cáo tóm tắt (briefing) về một kiến trúc truy xuất (retrieval) mới.\u003cbr>\u003cbr>Nhà tài trợ cấp điều hành (executive sponsor) đã yêu cầu một bản tóm tắt về quyết định kiến trúc.\u003cbr>\u003cbr>Cách trình bày nào phù hợp nhất với đối tượng này?"},"options":[{"k":"A","t":{"en":"Technical alternatives evaluated, implementation implications, and component-level consequences.","vi":"Các phương án kỹ thuật đã được đánh giá, tác động đối với việc triển khai và hệ quả ở cấp thành phần."}},{"k":"B","t":{"en":"Business outcomes achieved, trade-offs accepted, and high-level risks acknowledged.","vi":"Các kết quả kinh doanh đạt được, các đánh đổi (trade-off) được chấp nhận và các rủi ro cấp cao được ghi nhận."}},{"k":"C","t":{"en":"Capabilities delivered, scope implications, and feature-level dependencies on the roadmap.","vi":"Các năng lực được cung cấp, tác động đối với phạm vi và các phụ thuộc ở cấp tính năng trên lộ trình (roadmap)."}},{"k":"D","t":{"en":"Threat model, control mappings, residual-risk acceptance, and audit traceability.","vi":"Mô hình mối đe dọa (threat model), ánh xạ các biện pháp kiểm soát, việc chấp nhận rủi ro tồn dư và khả năng truy vết phục vụ kiểm toán."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Các kết quả kinh doanh đạt được, các đánh đổi (trade-off) được chấp nhận và các rủi ro cấp cao được ghi nhận.\u003cbr>\u003cbr>Lãnh đạo bảo trợ cần hiểu kết quả kinh doanh, những đánh đổi đã chấp nhận và rủi ro còn lại để ra quyết định. Tóm tắt ở cấp này kết nối kiến trúc với giá trị và trách nhiệm, thay vì yêu cầu họ giải mã chi tiết triển khai.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Các phương án kỹ thuật đã được đánh giá, tác động đối với việc triển khai và hệ quả ở cấp thành phần.\u003c/strong>: Chi tiết thành phần phù hợp hơn với nhóm triển khai kỹ thuật.\u003cbr>- \u003cstrong>Các năng lực được cung cấp, tác động đối với phạm vi và các phụ thuộc ở cấp tính năng trên lộ trình (roadmap).\u003c/strong>: Phạm vi tính năng và roadmap phù hợp product planning nhưng chưa nêu kết quả kinh doanh và rủi ro quyết định.\u003cbr>- \u003cstrong>Mô hình mối đe dọa (threat model), ánh xạ các biện pháp kiểm soát, việc chấp nhận rủi ro tồn dư và khả năng truy vết phục vụ kiểm toán.\u003c/strong>: Threat model và control mapping dành cho review an ninh chuyên sâu.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html\" target=\"_blank\" rel=\"noopener noreferrer\">Architectural decision record process\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":4,"sourceN":130},{"id":"diff-learning-132","n":132,"topic":2,"type":"mcq","multi":false,"answer":["C"],"stem":{"en":"A software vendor wants to build a RAG assistant over its own internal support-ticket archive (not the public web) and needs the same quality of source attribution that citation-grounded answers provide, without sending queries to an external search index.\u003cbr>\u003cbr>Which feature fits this requirement?","vi":"Một nhà cung cấp phần mềm muốn xây dựng một trợ lý RAG trên kho lưu trữ ticket hỗ trợ nội bộ của chính mình (không phải web công khai) và cần chất lượng ghi nguồn (source attribution) tương đương với các câu trả lời dựa trên trích dẫn (citation-grounded), mà không gửi truy vấn tới một chỉ mục tìm kiếm (search index) bên ngoài.\u003cbr>\u003cbr>Tính năng nào phù hợp với yêu cầu này?"},"options":[{"k":"A","t":{"en":"Web search tool, because it augments Claude's knowledge with current information regardless of where the documents are hosted.","vi":"Web search tool, vì nó bổ sung kiến thức của Claude bằng thông tin cập nhật bất kể tài liệu được lưu trữ ở đâu."}},{"k":"B","t":{"en":"Web fetch, because retrieving full page content from specified URLs works equally well for private ticket archives.","vi":"Web fetch, vì việc truy xuất toàn bộ nội dung trang từ các URL được chỉ định hoạt động tốt như nhau với kho lưu trữ ticket riêng tư."}},{"k":"C","t":{"en":"Search results, because it provides citation-quality source attribution for custom knowledge bases outside the public web.","vi":"Search results, vì nó cung cấp khả năng ghi nguồn đạt chất lượng trích dẫn (citation) cho các knowledge base tùy chỉnh nằm ngoài web công khai."}},{"k":"D","t":{"en":"Code execution, because running retrieval scripts in a sandbox lets the model fetch and cite ticket content directly.","vi":"Code execution, vì chạy các script truy xuất trong sandbox cho phép model trực tiếp lấy và trích dẫn nội dung ticket."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Search results, vì nó cung cấp khả năng ghi nguồn đạt chất lượng trích dẫn (citation) cho các knowledge base tùy chỉnh nằm ngoài web công khai.\u003cbr>\u003cbr>Search results cho phép hệ truy hồi nội bộ đưa các đoạn ticket vào block có nguồn và tiêu đề để Claude trích dẫn. Bộ chỉ mục vẫn do doanh nghiệp quản lý; tính năng attribution không buộc gửi truy vấn sang công cụ tìm kiếm web. Cần bật citations cho các search result blocks được trả về.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Web search tool, vì nó bổ sung kiến thức của Claude bằng thông tin cập nhật bất kể tài liệu được lưu trữ ở đâu.\u003c/strong>: Web search tìm trên web, không tự có quyền vào kho ticket riêng.\u003cbr>- \u003cstrong>Web fetch, vì việc truy xuất toàn bộ nội dung trang từ các URL được chỉ định hoạt động tốt như nhau với kho lưu trữ ticket riêng tư.\u003c/strong>: Web fetch cần URL truy cập được và quyền phù hợp; không tự thay bộ truy hồi kho riêng.\u003cbr>- \u003cstrong>Code execution, vì chạy các script truy xuất trong sandbox cho phép model trực tiếp lấy và trích dẫn nội dung ticket.\u003c/strong>: Code execution chạy mã nhưng tự nó không cung cấp cấu trúc attribution của search result.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/search-results\" target=\"_blank\" rel=\"noopener noreferrer\">Search results\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":6,"sourceN":132},{"id":"diff-learning-133","n":133,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A long-running autonomous coding agent needs two things in its architecture: automatically clearing stale tool results from context as a session approaches the token limit, and retaining key project facts across separate sessions run days apart.\u003cbr>\u003cbr>Select all components that correctly satisfy these two needs.","vi":"Một agent lập trình tự động (autonomous coding agent) chạy dài hạn cần hai điều trong kiến trúc: tự động xóa các kết quả tool đã cũ (stale) khỏi context khi phiên làm việc tiến gần giới hạn token, và lưu giữ các thông tin quan trọng của dự án qua các phiên riêng biệt chạy cách nhau nhiều ngày.\u003cbr>\u003cbr>Chọn tất cả các thành phần đáp ứng đúng hai nhu cầu này."},"options":[{"k":"A","t":{"en":"Context editing, which supports clearing tool results automatically as a conversation approaches the token limit","vi":"Context editing, hỗ trợ tự động xóa kết quả tool khi cuộc hội thoại tiến gần giới hạn token"}},{"k":"B","t":{"en":"The memory tool, which lets Claude store and retrieve information across separate conversations over time","vi":"Memory tool, cho phép Claude lưu trữ và truy xuất thông tin qua các cuộc hội thoại riêng biệt theo thời gian"}},{"k":"C","t":{"en":"Fine-grained tool streaming, which reduces latency by streaming tool parameters without JSON buffering","vi":"Fine-grained tool streaming, giúp giảm độ trễ bằng cách stream các tham số tool mà không cần đệm (buffer) JSON"}},{"k":"D","t":{"en":"Compaction, positioned as the sole mechanism that fully replaces context editing for long-running sessions","vi":"Compaction, được định vị là cơ chế duy nhất thay thế hoàn toàn context editing cho các phiên chạy dài"}},{"k":"E","t":{"en":"Code execution, which runs code in a sandboxed container for data analysis and file processing tasks","vi":"Code execution, chạy mã trong một container sandbox cho các tác vụ phân tích dữ liệu và xử lý file"}},{"k":"F","t":{"en":"The Files API, which lets uploaded documents be referenced repeatedly without re-uploading their content","vi":"Files API, cho phép tham chiếu lặp lại các tài liệu đã tải lên mà không cần tải lại nội dung của chúng"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Context editing, hỗ trợ tự động xóa kết quả tool khi cuộc hội thoại tiến gần giới hạn token\u003cbr>\u003cbr>Context editing xóa kết quả tool cũ theo ngưỡng, giải quyết áp lực trong phiên hiện tại. Nhưng nhu cầu nhớ thông tin qua nhiều ngày cần memory tool và nơi lưu bền vững do ứng dụng cung cấp. Khóa chỉ giữ context editing nên chưa bao phủ cả hai yêu cầu.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Memory tool, cho phép Claude lưu trữ và truy xuất thông tin qua các cuộc hội thoại riêng biệt theo thời gian\u003c/strong>: Memory tool đáp ứng nhu cầu qua nhiều hội thoại; đây là đáp án hợp lệ bị khóa nguồn bỏ sót.\u003cbr>- \u003cstrong>Fine-grained tool streaming, giúp giảm độ trễ bằng cách stream các tham số tool mà không cần đệm (buffer) JSON\u003c/strong>: Streaming tham số giảm thời gian chờ tool, không dọn kết quả cũ hoặc lưu trí nhớ dài hạn.\u003cbr>- \u003cstrong>Compaction, được định vị là cơ chế duy nhất thay thế hoàn toàn context editing cho các phiên chạy dài\u003c/strong>: Compaction tóm tắt lịch sử, không phải cơ chế duy nhất và không thay mọi vai trò của context editing.\u003cbr>- \u003cstrong>Code execution, chạy mã trong một container sandbox cho các tác vụ phân tích dữ liệu và xử lý file\u003c/strong>: Sandbox xử lý mã không tự tạo chính sách dọn context hoặc nhớ xuyên phiên.\u003cbr>- \u003cstrong>Files API, cho phép tham chiếu lặp lại các tài liệu đã tải lên mà không cần tải lại nội dung của chúng\u003c/strong>: Files API giữ tài liệu upload, không tự ghi và truy hồi các sự kiện dự án quan trọng.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Khóa PDF chỉ chọn context editing dù đề yêu cầu chọn tất cả thành phần cho cả hai nhu cầu. Memory tool cũng đúng. Cần sửa khóa sau duyệt; chưa tự đổi.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-editing\" target=\"_blank\" rel=\"noopener noreferrer\">Context editing\u003c/a>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\" target=\"_blank\" rel=\"noopener noreferrer\">Memory tool\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":7,"sourceN":133},{"id":"diff-learning-134","n":134,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team is choosing between orchestrator-workers and parallelization by sectioning for a document-analysis pipeline.\u003cbr>\u003cbr>Which statements correctly distinguish orchestrator-workers from parallelization by sectioning?","vi":"Một nhóm đang cân nhắc giữa orchestrator-workers và parallelization theo kiểu sectioning cho một pipeline phân tích tài liệu.\u003cbr>\u003cbr>Những phát biểu nào phân biệt đúng orchestrator-workers với parallelization theo kiểu sectioning?"},"options":[{"k":"A","t":{"en":"In orchestrator-workers, a central LLM determines subtasks at runtime, whereas sectioning requires subtasks predefined before execution","vi":"Trong orchestrator-workers, một LLM trung tâm xác định các tác vụ con (subtask) lúc runtime, trong khi sectioning yêu cầu các tác vụ con được định nghĩa trước khi thực thi"}},{"k":"B","t":{"en":"In orchestrator-workers, worker LLMs run in a fixed, predetermined order, whereas sectioning always runs its subtasks simultaneously","vi":"Trong orchestrator-workers, các LLM worker chạy theo một thứ tự cố định, định sẵn, trong khi sectioning luôn chạy các tác vụ con của nó đồng thời"}},{"k":"C","t":{"en":"Orchestrator-workers suits subtasks that vary unpredictably case to case, while sectioning suits tasks that split cleanly into known subtasks","vi":"Orchestrator-workers phù hợp với các tác vụ con thay đổi khó đoán theo từng trường hợp, còn sectioning phù hợp với các tác vụ có thể tách gọn thành các tác vụ con đã biết"}},{"k":"D","t":{"en":"Parallelization by sectioning always requires a second LLM to evaluate the sectioned outputs before combining them into a final result","vi":"Parallelization theo kiểu sectioning luôn cần một LLM thứ hai đánh giá các đầu ra đã chia phần trước khi gộp chúng thành kết quả cuối cùng"}},{"k":"E","t":{"en":"Orchestrator-workers and parallelization by sectioning both aggregate multiple independent votes on one input to reach a majority-based answer","vi":"Orchestrator-workers và parallelization theo kiểu sectioning đều tổng hợp nhiều phiếu bầu (vote) độc lập trên cùng một đầu vào để đi đến câu trả lời theo đa số"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Trong orchestrator-workers, một LLM trung tâm xác định các tác vụ con (subtask) lúc runtime, trong khi sectioning yêu cầu các tác vụ con được định nghĩa trước khi thực thi\u003cbr>\u003cbr>Orchestrator-workers để LLM trung tâm xác định và giao việc sau khi nhìn đầu vào. Sectioning đã biết các phần việc có thể tách trước khi chạy. Vì vậy phát biểu về các subtasks thay đổi khó đoán cũng đúng; khóa nguồn chỉ chọn cơ chế runtime là thiếu.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Trong orchestrator-workers, các LLM worker chạy theo một thứ tự cố định, định sẵn, trong khi sectioning luôn chạy các tác vụ con của nó đồng thời\u003c/strong>: Worker không bắt buộc chạy theo thứ tự cố định; cách mô tả này làm mất đặc điểm phân rã động.\u003cbr>- \u003cstrong>Orchestrator-workers phù hợp với các tác vụ con thay đổi khó đoán theo từng trường hợp, còn sectioning phù hợp với các tác vụ có thể tách gọn thành các tác vụ con đã biết\u003c/strong>: Tác vụ biến thiên hợp orchestrator-workers, tác vụ tách sẵn hợp sectioning; phát biểu đúng nhưng bị bỏ khỏi khóa.\u003cbr>- \u003cstrong>Parallelization theo kiểu sectioning luôn cần một LLM thứ hai đánh giá các đầu ra đã chia phần trước khi gộp chúng thành kết quả cuối cùng\u003c/strong>: Sectioning không bắt buộc có LLM thứ hai chấm điểm; có thể ghép kết quả bằng logic phù hợp.\u003cbr>- \u003cstrong>Orchestrator-workers và parallelization theo kiểu sectioning đều tổng hợp nhiều phiếu bầu (vote) độc lập trên cùng một đầu vào để đi đến câu trả lời theo đa số\u003c/strong>: Bỏ phiếu là chạy nhiều lần cùng đầu vào, khác chia nhiệm vụ thành phần.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> PDF thiếu đáp án cho phát biểu “subtasks vary unpredictably…”. Giữ nguyên khóa; hai phát biểu về runtime decomposition và phù hợp tác vụ đều đúng.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Building effective agents\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":8,"sourceN":134},{"id":"diff-learning-135","n":135,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team is building an agent that must audit a large codebase across three distinct dimensions: security vulnerabilities, code quality, and test coverage.\u003cbr>\u003cbr>Each dimension requires a different set of tools and a different area of focus.\u003cbr>\u003cbr>Which approach best decomposes this problem using the Agent SDK?","vi":"Một nhóm đang xây dựng một agent phải kiểm toán (audit) một codebase lớn theo ba chiều riêng biệt: lỗ hổng bảo mật, chất lượng mã và độ bao phủ kiểm thử (test coverage).\u003cbr>\u003cbr>Mỗi chiều cần một bộ tool khác nhau và một trọng tâm khác nhau.\u003cbr>\u003cbr>Cách tiếp cận nào phân rã bài toán này tốt nhất bằng Agent SDK?"},"options":[{"k":"A","t":{"en":"Define an orchestrator agent that invokes specialized subagents through the Agent tool, each configured with a scoped tool set and description matching its subtask domain","vi":"Định nghĩa một agent điều phối (orchestrator) gọi các subagent chuyên biệt thông qua Agent tool, mỗi subagent được cấu hình với một bộ tool giới hạn phạm vi và phần mô tả (description) khớp với lĩnh vực tác vụ con của nó"}},{"k":"B","t":{"en":"Send one prompt to the main agent instructing it to sequentially perform code quality checks, then security scanning, then test coverage analysis without additional configuration","vi":"Gửi một prompt tới agent chính, hướng dẫn nó lần lượt thực hiện kiểm tra chất lượng mã, rồi quét bảo mật, rồi phân tích độ bao phủ kiểm thử mà không cần cấu hình bổ sung"}},{"k":"C","t":{"en":"Configure a single MCP server that exposes security, quality, and coverage checks as three separate tools, and let the primary agent call each tool directly instead of delegating","vi":"Cấu hình một MCP server duy nhất cung cấp các bước kiểm tra bảo mật, chất lượng và độ bao phủ dưới dạng ba tool riêng biệt, và để agent chính gọi trực tiếp từng tool thay vì ủy quyền (delegate)"}},{"k":"D","t":{"en":"Increase the primary agent's context window and rely on extended thinking so it can reason through all three review dimensions within one continuous session","vi":"Tăng context window của agent chính và dựa vào extended thinking để nó có thể suy luận qua cả ba chiều rà soát trong một phiên liên tục duy nhất"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Định nghĩa một agent điều phối (orchestrator) gọi các subagent chuyên biệt thông qua Agent tool, mỗi subagent được cấu hình với một bộ tool giới hạn phạm vi và phần mô tả (description) khớp với lĩnh vực tác vụ con của nó\u003cbr>\u003cbr>Orchestrator có thể gọi các subagent chuyên security, chất lượng mã và coverage bằng Agent tool. Mỗi subagent có mô tả và bộ tool đúng phạm vi, nên công việc được phân tách cả về mục tiêu lẫn quyền và ngữ cảnh.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Gửi một prompt tới agent chính, hướng dẫn nó lần lượt thực hiện kiểm tra chất lượng mã, rồi quét bảo mật, rồi phân tích độ bao phủ kiểm thử mà không cần cấu hình bổ sung\u003c/strong>: Một prompt tuần tự vẫn để mọi lĩnh vực và quyền trong cùng agent, không tạo phân rã chuyên môn.\u003cbr>- \u003cstrong>Cấu hình một MCP server duy nhất cung cấp các bước kiểm tra bảo mật, chất lượng và độ bao phủ dưới dạng ba tool riêng biệt, và để agent chính gọi trực tiếp từng tool thay vì ủy quyền (delegate)\u003c/strong>: Ba tool MCP tách thao tác nhưng vẫn để một agent điều khiển cả ba lĩnh vực.\u003cbr>- \u003cstrong>Tăng context window của agent chính và dựa vào extended thinking để nó có thể suy luận qua cả ba chiều rà soát trong một phiên liên tục duy nhất\u003c/strong>: Context lớn và suy luận dài không tự tạo ranh giới chuyên môn hoặc tool riêng.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/subagents\" target=\"_blank\" rel=\"noopener noreferrer\">Subagents in the SDK\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":9,"sourceN":135},{"id":"diff-learning-136","n":136,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"An enterprise customer's support desk has committed to a contractual 99.9% uptime and sub-2-second p95 response SLA for its Claude-powered ticket triage assistant.\u003cbr>\u003cbr>During architecture review, the team must select which platform capabilities to prioritize primarily to protect this SLA commitment.\u003cbr>\u003cbr>Which two capabilities are the most directly relevant to protecting a latency and availability SLA? (Select 2)","vi":"Bộ phận hỗ trợ (support desk) của một khách hàng doanh nghiệp đã cam kết theo hợp đồng SLA uptime 99.9% và thời gian phản hồi p95 dưới 2 giây cho trợ lý phân loại ticket (ticket triage) chạy bằng Claude.\u003cbr>\u003cbr>Trong buổi rà soát kiến trúc, nhóm phải chọn những năng lực nền tảng cần ưu tiên, chủ yếu để bảo vệ cam kết SLA này.\u003cbr>\u003cbr>Hai năng lực nào liên quan trực tiếp nhất đến việc bảo vệ SLA về độ trễ và tính sẵn sàng (availability)? (Chọn hai.)"},"options":[{"k":"A","t":{"en":"Server-side fallback, which retries a refused request against a backup model within the same API call for a timely response","vi":"Server-side fallback, cơ chế thử lại một yêu cầu bị từ chối với một model dự phòng ngay trong cùng một lệnh gọi API để có phản hồi kịp thời"}},{"k":"B","t":{"en":"Choosing a model with faster comparative latency, such as Claude Haiku 4.5, for the latency-sensitive triage path","vi":"Chọn một model có độ trễ tương đối nhanh hơn, chẳng hạn Claude Haiku 4.5, cho luồng phân loại nhạy cảm với độ trễ"}},{"k":"C","t":{"en":"Batch processing, which processes large volumes of requests asynchronously at a discounted rate over an extended completion window","vi":"Batch processing, xử lý bất đồng bộ khối lượng lớn yêu cầu với mức giá chiết khấu trong một khoảng thời gian hoàn thành kéo dài"}},{"k":"D","t":{"en":"Agent Skills, which extend Claude's capabilities with pre-built instructions and scripts for document-format tasks","vi":"Agent Skills, mở rộng năng lực của Claude bằng các hướng dẫn và script dựng sẵn cho các tác vụ liên quan đến định dạng tài liệu"}},{"k":"E","t":{"en":"The Files API, which lets documents be uploaded once and referenced across multiple requests without re-uploading content","vi":"Files API, cho phép tải tài liệu lên một lần và tham chiếu qua nhiều yêu cầu mà không cần tải lại nội dung"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Server-side fallback, cơ chế thử lại một yêu cầu bị từ chối với một model dự phòng ngay trong cùng một lệnh gọi API để có phản hồi kịp thời\u003cbr>\u003cbr>Khóa muốn dùng server-side fallback để thử model dự phòng khi model từ chối. Phải phân biệt refusal với lỗi mất dịch vụ: cơ chế đó không tự chứng minh uptime 99,9%. Chọn model nhanh hơn cũng trực tiếp hỗ trợ p95 dưới 2 giây và là lựa chọn hợp lệ bị thiếu; cần đo p95 trên tải thật.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Chọn một model có độ trễ tương đối nhanh hơn, chẳng hạn Claude Haiku 4.5, cho luồng phân loại nhạy cảm với độ trễ\u003c/strong>: Model nhanh hơn là biện pháp latency trực tiếp, nhưng cần benchmark và phải được xem lại trong khóa.\u003cbr>- \u003cstrong>Batch processing, xử lý bất đồng bộ khối lượng lớn yêu cầu với mức giá chiết khấu trong một khoảng thời gian hoàn thành kéo dài\u003c/strong>: Batch có cửa sổ hoàn tất bất đồng bộ, không phục vụ SLA phản hồi tức thời từng ticket.\u003cbr>- \u003cstrong>Agent Skills, mở rộng năng lực của Claude bằng các hướng dẫn và script dựng sẵn cho các tác vụ liên quan đến định dạng tài liệu\u003c/strong>: Skills định nghĩa cách làm nhiệm vụ, không tự bảo đảm độ trễ hoặc availability.\u003cbr>- \u003cstrong>Files API, cho phép tải tài liệu lên một lần và tham chiếu qua nhiều yêu cầu mà không cần tải lại nội dung\u003c/strong>: Files API giảm thao tác upload lặp, không giải quyết trực tiếp hai cam kết SLA này.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Đề yêu cầu hai nhưng khóa chỉ có một; model nhanh hơn cũng trực tiếp phù hợp. Fallback cho refusal không tương đương xử lý outage. Cần sửa số lượng đáp án và cách mô tả SLA sau duyệt.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success and build evaluations\u003c/a>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\" target=\"_blank\" rel=\"noopener noreferrer\">Refusals and fallback\u003c/a>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model\" target=\"_blank\" rel=\"noopener noreferrer\">Choosing the right model\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":10,"sourceN":136},{"id":"diff-learning-137","n":137,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A manufacturing client wants a Claude-based quality-inspection assistant that repeatedly analyzes the same reference specification documents alongside new inspection reports throughout the day.\u003cbr>\u003cbr>The client's stated goal is to reduce redundant token spend on the unchanging reference material while keeping individual inspection turnaround fast.\u003cbr>\u003cbr>Which architectural choice best serves this efficiency and cost goal?","vi":"Một khách hàng trong ngành sản xuất muốn có một trợ lý kiểm tra chất lượng dựa trên Claude, liên tục phân tích cùng một bộ tài liệu đặc tả tham chiếu cùng với các báo cáo kiểm tra mới trong suốt cả ngày.\u003cbr>\u003cbr>Mục tiêu đã nêu của khách hàng là giảm chi phí token dư thừa cho phần tài liệu tham chiếu không thay đổi, đồng thời giữ cho thời gian xử lý từng báo cáo kiểm tra luôn nhanh.\u003cbr>\u003cbr>Lựa chọn kiến trúc nào phục vụ tốt nhất mục tiêu hiệu quả và chi phí này?"},"options":[{"k":"A","t":{"en":"Use prompt caching so the unchanging reference specification is cached and reused across requests, cutting cost and latency","vi":"Dùng prompt caching để phần đặc tả tham chiếu không thay đổi được cache và tái sử dụng qua các yêu cầu, giúp giảm chi phí và độ trễ"}},{"k":"B","t":{"en":"Move the entire workload to the Message Batches API so all inspection reports are processed together once per day","vi":"Chuyển toàn bộ khối lượng công việc sang Message Batches API để tất cả báo cáo kiểm tra được xử lý cùng lúc, mỗi ngày một lần"}},{"k":"C","t":{"en":"Increase the effort parameter to xhigh on every inspection request so Claude reasons more thoroughly each time","vi":"Tăng tham số effort lên xhigh cho mọi yêu cầu kiểm tra để Claude suy luận kỹ lưỡng hơn mỗi lần"}},{"k":"D","t":{"en":"Re-upload the full reference specification as plain text in every single request to guarantee the model always has the latest version","vi":"Tải lại toàn bộ đặc tả tham chiếu dưới dạng văn bản thuần (plain text) trong từng yêu cầu để bảo đảm model luôn có phiên bản mới nhất"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Dùng prompt caching để phần đặc tả tham chiếu không thay đổi được cache và tái sử dụng qua các yêu cầu, giúp giảm chi phí và độ trễ\u003cbr>\u003cbr>Prompt caching tái sử dụng prefix đặc tả tham chiếu không đổi qua nhiều báo cáo mới. Khi cache hit, phần đó không phải tính lại đầy đủ, giúp giảm chi phí và thời gian xử lý mà vẫn cho phép trả từng lượt inspection ngay.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Chuyển toàn bộ khối lượng công việc sang Message Batches API để tất cả báo cáo kiểm tra được xử lý cùng lúc, mỗi ngày một lần\u003c/strong>: Gom xử lý mỗi ngày gây chờ, trái yêu cầu turnaround nhanh.\u003cbr>- \u003cstrong>Tăng tham số effort lên xhigh cho mọi yêu cầu kiểm tra để Claude suy luận kỹ lưỡng hơn mỗi lần\u003c/strong>: Effort cao hơn tăng tài nguyên suy luận, không xử lý lặp prefix tĩnh.\u003cbr>- \u003cstrong>Tải lại toàn bộ đặc tả tham chiếu dưới dạng văn bản thuần (plain text) trong từng yêu cầu để bảo đảm model luôn có phiên bản mới nhất\u003c/strong>: Gửi text lại mà không cache vẫn xử lý token lặp; tài liệu vốn không đổi trong tình huống.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\" target=\"_blank\" rel=\"noopener noreferrer\">Prompt caching\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":11,"sourceN":137},{"id":"diff-learning-138","n":138,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A coding assistant must modify an unknown number of files across a repository to implement a feature, where the exact files and scope of changes can only be determined once the assistant inspects the codebase.\u003cbr>\u003cbr>Which pattern is most appropriate?","vi":"Một trợ lý lập trình phải sửa đổi một số lượng file chưa biết trước trên toàn repository để triển khai một tính năng, trong đó các file cụ thể và phạm vi thay đổi chỉ có thể xác định sau khi trợ lý kiểm tra codebase.\u003cbr>\u003cbr>Mẫu (pattern) nào phù hợp nhất?"},"options":[{"k":"A","t":{"en":"Orchestrator-workers, where a central LLM inspects the repository and dynamically delegates each file edit to a worker LLM","vi":"Orchestrator-workers, trong đó một LLM trung tâm kiểm tra repository và ủy quyền một cách linh động từng thao tác sửa file cho một LLM worker"}},{"k":"B","t":{"en":"Prompt chaining, where the assistant edits files in a fixed sequence determined before inspecting the repository","vi":"Prompt chaining, trong đó trợ lý sửa các file theo một trình tự cố định được xác định trước khi kiểm tra repository"}},{"k":"C","t":{"en":"Parallelization by sectioning, where the assistant edits every file in the repository simultaneously using a predetermined split","vi":"Parallelization theo kiểu sectioning, trong đó trợ lý sửa đồng thời mọi file trong repository theo một cách chia định sẵn"}},{"k":"D","t":{"en":"Routing, where the assistant classifies the feature request and sends it to one of several fixed file-editing prompts","vi":"Routing, trong đó trợ lý phân loại yêu cầu tính năng và gửi nó tới một trong số các prompt sửa file cố định"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Orchestrator-workers, trong đó một LLM trung tâm kiểm tra repository và ủy quyền một cách linh động từng thao tác sửa file cho một LLM worker\u003cbr>\u003cbr>Chỉ sau khi đọc repo mới biết cần sửa những file nào. Orchestrator-workers cho phép khám phá trước rồi tạo các phần việc tương ứng, thay vì đoán trước danh sách file và trình tự. Việc điều phối vẫn phải xử lý phụ thuộc và xung đột giữa các sửa đổi.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Prompt chaining, trong đó trợ lý sửa các file theo một trình tự cố định được xác định trước khi kiểm tra repository\u003c/strong>: Chuỗi file cố định trước khám phá giả định điều đề nói chưa biết.\u003cbr>- \u003cstrong>Parallelization theo kiểu sectioning, trong đó trợ lý sửa đồng thời mọi file trong repository theo một cách chia định sẵn\u003c/strong>: Chia sẵn mọi file tạo công việc không cần thiết và không phản ánh phạm vi vừa khám phá.\u003cbr>- \u003cstrong>Routing, trong đó trợ lý phân loại yêu cầu tính năng và gửi nó tới một trong số các prompt sửa file cố định\u003c/strong>: Routing chọn một nhánh cố định, không phân rã phạm vi nhiều file xuất hiện khi khảo sát.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Building effective agents\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":12,"sourceN":138},{"id":"diff-learning-139","n":139,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A developer is building an email-triage agent that reads inbound email bodies via a tool and drafts replies.\u003cbr>\u003cbr>To harden it against embedded instructions in email bodies, which combination of design choices should the developer apply? (Select all that apply)","vi":"Một developer đang xây dựng một agent phân loại email (email triage), đọc nội dung các email đến thông qua một tool và soạn thư trả lời.\u003cbr>\u003cbr>Để gia cố agent chống lại các chỉ dẫn được nhúng trong nội dung email, developer nên áp dụng tổ hợp lựa chọn thiết kế nào? (Chọn tất cả các đáp án phù hợp.)"},"options":[{"k":"A","t":{"en":"State a system prompt policy that content returned by tools is untrusted data and must never override the system prompt or the user's original request","vi":"Nêu rõ trong system prompt một chính sách rằng nội dung do tool trả về là dữ liệu không đáng tin cậy và tuyệt đối không được ghi đè system prompt hay yêu cầu ban đầu của người dùng"}},{"k":"B","t":{"en":"JSON-encode the email body when passing it as a tool result so quotes or tags in the content cannot break out of the surrounding structure","vi":"Mã hóa JSON (JSON-encode) nội dung email khi truyền nó dưới dạng tool result để các dấu ngoặc kép hoặc thẻ (tag) trong nội dung không thể thoát ra khỏi cấu trúc bao quanh"}},{"k":"C","t":{"en":"Screen tool outputs with a lightweight classifier model before passing them to the main agent, and strip or flag content if an injection is suspected","vi":"Sàng lọc đầu ra của tool bằng một model phân loại (classifier) nhẹ trước khi chuyển cho agent chính, và loại bỏ hoặc gắn cờ nội dung nếu nghi ngờ có injection"}},{"k":"D","t":{"en":"Place the developer's own operating instructions inside the same tool_result block as the email body so both travel together in one message","vi":"Đặt các chỉ dẫn vận hành của chính developer vào cùng block tool_result với nội dung email để cả hai được truyền cùng nhau trong một message"}},{"k":"E","t":{"en":"Grant the agent broad, unscoped access to the user's full mailbox and account settings so it never needs to ask for additional permissions mid-task","vi":"Cấp cho agent quyền truy cập rộng, không giới hạn phạm vi vào toàn bộ hộp thư và các thiết lập tài khoản của người dùng để nó không bao giờ phải xin thêm quyền giữa chừng tác vụ"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Nêu rõ trong system prompt một chính sách rằng nội dung do tool trả về là dữ liệu không đáng tin cậy và tuyệt đối không được ghi đè system prompt hay yêu cầu ban đầu của người dùng\u003cbr>\u003cbr>Chính sách system phải phân biệt email do tool trả về là dữ liệu không đáng tin với chỉ dẫn có thẩm quyền. Đây là một lớp phòng vệ; JSON encoding để giữ ranh giới cấu trúc và sàng lọc output cũng có ích. Không lớp nào một mình loại bỏ mọi prompt injection, và khóa Select all đang thiếu hai biện pháp hợp lệ.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Mã hóa JSON (JSON-encode) nội dung email khi truyền nó dưới dạng tool result để các dấu ngoặc kép hoặc thẻ (tag) trong nội dung không thể thoát ra khỏi cấu trúc bao quanh\u003c/strong>: JSON encoding ngăn nội dung phá cấu trúc bao quanh, là lớp hữu ích bị bỏ sót; nó không chặn mọi chỉ dẫn độc hại theo ngữ nghĩa.\u003cbr>- \u003cstrong>Sàng lọc đầu ra của tool bằng một model phân loại (classifier) nhẹ trước khi chuyển cho agent chính, và loại bỏ hoặc gắn cờ nội dung nếu nghi ngờ có injection\u003c/strong>: Classifier có thể phát hiện và chặn hoặc gắn cờ injection, là lớp hợp lệ dù vẫn có false negative.\u003cbr>- \u003cstrong>Đặt các chỉ dẫn vận hành của chính developer vào cùng block tool_result với nội dung email để cả hai được truyền cùng nhau trong một message\u003c/strong>: Trộn chỉ dẫn vận hành vào cùng dữ liệu email làm mờ ranh giới tin cậy.\u003cbr>- \u003cstrong>Cấp cho agent quyền truy cập rộng, không giới hạn phạm vi vào toàn bộ hộp thư và các thiết lập tài khoản của người dùng để nó không bao giờ phải xin thêm quyền giữa chừng tác vụ\u003c/strong>: Quyền mailbox rộng làm tăng tác hại nếu bị injection và không cần để soạn reply trong phạm vi.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Khóa PDF bỏ sót JSON-encoding và tool-output screening dù “Select all”. Giữ nguyên khóa trong output; cần sửa theo nội dung sau khi duyệt.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\" target=\"_blank\" rel=\"noopener noreferrer\">Mitigate jailbreaks and prompt injections\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":13,"sourceN":139},{"id":"diff-learning-140","n":140,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team is building an English-to-Spanish translation feature that will be called repeatedly with different user-submitted text.\u003cbr>\u003cbr>They want to keep the instructional wording consistent across calls while making it easy to swap in new text and track changes to the instructions separately from the text being translated.\u003cbr>\u003cbr>Which approach best fits this goal?","vi":"Một nhóm đang xây dựng tính năng dịch tiếng Anh sang tiếng Tây Ban Nha, sẽ được gọi lặp lại nhiều lần với các đoạn văn bản khác nhau do người dùng gửi.\u003cbr>\u003cbr>Họ muốn giữ phần câu chữ hướng dẫn nhất quán giữa các lần gọi, đồng thời dễ dàng thay văn bản mới vào và theo dõi các thay đổi đối với phần hướng dẫn tách biệt với văn bản cần dịch.\u003cbr>\u003cbr>Cách tiếp cận nào phù hợp nhất với mục tiêu này?"},"options":[{"k":"A","t":{"en":"Define a prompt template with the fixed instruction text and a placeholder such as {{text}}, substituting only the variable content on each call while the surrounding instructions stay constant.","vi":"Định nghĩa một prompt template với phần hướng dẫn cố định và một placeholder như {{text}}, chỉ thay thế phần nội dung biến đổi ở mỗi lần gọi trong khi phần hướng dẫn xung quanh giữ nguyên."}},{"k":"B","t":{"en":"Regenerate the complete translation prompt on every call by constructing the instruction string dynamically with the user's text, ensuring that each request carries an up-to-date version of the wording.","vi":"Tạo lại toàn bộ prompt dịch ở mỗi lần gọi bằng cách dựng chuỗi hướng dẫn một cách động cùng với văn bản của người dùng, bảo đảm mỗi yêu cầu đều mang phiên bản câu chữ mới nhất."}},{"k":"C","t":{"en":"Store the entire prompt containing the fixed instructions and the user's text as one static string, editing the string by hand for each new translation request so the prompt is always up to date.","vi":"Lưu toàn bộ prompt chứa phần hướng dẫn cố định và văn bản của người dùng thành một chuỗi tĩnh duy nhất, sửa chuỗi đó thủ công cho mỗi yêu cầu dịch mới để prompt luôn được cập nhật."}},{"k":"D","t":{"en":"Send the fixed instruction text and the user's text to the model in two separate API calls, then concatenate the responses, placing the translation after the instruction output to form the final result.","vi":"Gửi phần hướng dẫn cố định và văn bản của người dùng tới model trong hai lệnh gọi API riêng biệt, sau đó nối các phản hồi lại, đặt bản dịch sau đầu ra của phần hướng dẫn để tạo thành kết quả cuối cùng."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Định nghĩa một prompt template với phần hướng dẫn cố định và một placeholder như {{text}}, chỉ thay thế phần nội dung biến đổi ở mỗi lần gọi trong khi phần hướng dẫn xung quanh giữ nguyên.\u003cbr>\u003cbr>Template cố định chỉ dẫn dịch Anh sang Tây Ban Nha và dùng placeholder cho nội dung thay đổi. Nhóm có thể version chỉ dẫn độc lập với từng đoạn text, giúp so sánh kết quả giữa các phiên bản và tránh sửa nhầm hướng dẫn khi thay dữ liệu.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Tạo lại toàn bộ prompt dịch ở mỗi lần gọi bằng cách dựng chuỗi hướng dẫn một cách động cùng với văn bản của người dùng, bảo đảm mỗi yêu cầu đều mang phiên bản câu chữ mới nhất.\u003c/strong>: Dựng lại toàn bộ wording mỗi lượt tăng nguy cơ lệch chỉ dẫn và khó theo dõi thay đổi riêng.\u003cbr>- \u003cstrong>Lưu toàn bộ prompt chứa phần hướng dẫn cố định và văn bản của người dùng thành một chuỗi tĩnh duy nhất, sửa chuỗi đó thủ công cho mỗi yêu cầu dịch mới để prompt luôn được cập nhật.\u003c/strong>: Sửa tay chuỗi chung vừa chậm vừa dễ sửa nhầm phần chỉ dẫn.\u003cbr>- \u003cstrong>Gửi phần hướng dẫn cố định và văn bản của người dùng tới model trong hai lệnh gọi API riêng biệt, sau đó nối các phản hồi lại, đặt bản dịch sau đầu ra của phần hướng dẫn để tạo thành kết quả cuối cùng.\u003c/strong>: Hai API call riêng không cho lần dịch nhìn thấy cả chỉ dẫn và dữ liệu cùng lúc; ghép câu trả lời không sửa được điều đó.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices\" target=\"_blank\" rel=\"noopener noreferrer\">Prompting best practices\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":14,"sourceN":140},{"id":"diff-learning-141","n":141,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"An agent runs long tool-use loops involving dozens of file reads per session.\u003cbr>\u003cbr>The team wants old tool results automatically cleared once input tokens exceed 30,000, while always preserving the 3 most recent tool exchanges and never clearing results from the web_search tool.\u003cbr>\u003cbr>Which context_management configuration achieves this?","vi":"Một agent chạy các vòng lặp tool use dài, gồm hàng chục lần đọc file trong mỗi phiên.\u003cbr>\u003cbr>Nhóm muốn các kết quả tool cũ được tự động xóa khi số input token vượt quá 30,000, đồng thời luôn giữ lại 3 lượt trao đổi tool gần nhất và không bao giờ xóa kết quả từ tool web_search.\u003cbr>\u003cbr>Cấu hình context_management nào đạt được điều này?"},"options":[{"k":"A","t":{"en":"Configure a clear_tool_uses_20250919 edit with trigger set to 30000 input tokens, keep 3 tool uses, exclude_tools set to web_search.","vi":"Cấu hình một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep 3 tool use, exclude_tools đặt là web_search."}},{"k":"B","t":{"en":"A clear_thinking_20251015 edit with trigger set to 30000 input tokens, keep set to 3 thinking turns, and exclude_tools set to web_search should be used.","vi":"Nên dùng một edit clear_thinking_20251015 với trigger đặt ở 30000 input token, keep đặt là 3 lượt thinking, và exclude_tools đặt là web_search."}},{"k":"C","t":{"en":"A clear_tool_uses_20250919 edit with trigger set to tool_uses 30000, with no keep value explicitly set, and with no exclude_tools value explicitly set.","vi":"Một edit clear_tool_uses_20250919 với trigger đặt là tool_uses 30000, không đặt tường minh giá trị keep, và không đặt tường minh giá trị exclude_tools."}},{"k":"D","t":{"en":"A clear_tool_uses_20250919 edit with trigger set to 30000 input tokens, keep set to 3 tool uses, and exclude_tools set to file_read should be used.","vi":"Nên dùng một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep đặt là 3 tool use, và exclude_tools đặt là file_read."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Cấu hình một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep 3 tool use, exclude_tools đặt là web_search.\u003cbr>\u003cbr>clear_tool_uses_20250919 với trigger input_tokens = 30000 kích hoạt theo dung lượng đầu vào; keep tool_uses = 3 giữ ba trao đổi gần nhất. exclude_tools chứa web_search bảo vệ kết quả tìm kiếm khỏi dọn. Ba tham số khớp ba yêu cầu riêng.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Nên dùng một edit clear_thinking_20251015 với trigger đặt ở 30000 input token, keep đặt là 3 lượt thinking, và exclude_tools đặt là web_search.\u003c/strong>: clear_thinking quản lý thinking blocks, không dọn kết quả file-read cũ.\u003cbr>- \u003cstrong>Một edit clear_tool_uses_20250919 với trigger đặt là tool_uses 30000, không đặt tường minh giá trị keep, và không đặt tường minh giá trị exclude_tools.\u003c/strong>: Ngưỡng tool_uses đếm lần dùng tool thay vì input token; thiếu danh sách ngoại lệ web_search.\u003cbr>- \u003cstrong>Nên dùng một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep đặt là 3 tool use, và exclude_tools đặt là file_read.\u003c/strong>: Loại trừ file_read bảo vệ sai tool và vẫn cho phép dọn web_search.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-editing\" target=\"_blank\" rel=\"noopener noreferrer\">Context editing\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":15,"sourceN":141},{"id":"diff-learning-142","n":142,"topic":2,"type":"mcq","multi":false,"answer":["B"],"stem":{"en":"A code-review prompt needs Claude to generate a fix, verify the fix against a set of criteria, and then refine the fix if criteria are not met.\u003cbr>\u003cbr>The team wants to inspect the intermediate review step and log it separately before the final refinement is produced.\u003cbr>\u003cbr>Which approach best fits this requirement?","vi":"Một prompt rà soát mã (code review) cần Claude tạo ra một bản sửa lỗi, kiểm chứng bản sửa đó theo một bộ tiêu chí, rồi tinh chỉnh bản sửa nếu chưa đạt tiêu chí.\u003cbr>\u003cbr>Nhóm muốn xem xét bước rà soát trung gian và ghi log nó riêng trước khi bản tinh chỉnh cuối cùng được tạo ra.\u003cbr>\u003cbr>Cách tiếp cận nào phù hợp nhất với yêu cầu này?"},"options":[{"k":"A","t":{"en":"Ask Claude to generate, verify, and refine the fix in one response using extended reasoning, but this keeps the review internal and unloggable.","vi":"Yêu cầu Claude tạo, kiểm chứng và tinh chỉnh bản sửa trong một phản hồi duy nhất bằng suy luận mở rộng (extended reasoning), nhưng cách này giữ bước rà soát ở bên trong và không thể ghi log."}},{"k":"B","t":{"en":"Break the task into separate API calls: generate a fix, review it against the criteria, then refine the fix, so each step can be logged independently.","vi":"Chia tác vụ thành các lệnh gọi API riêng biệt: tạo bản sửa, rà soát nó theo các tiêu chí, rồi tinh chỉnh bản sửa, để mỗi bước có thể được ghi log độc lập."}},{"k":"C","t":{"en":"Add tags around the review step so Claude places the review inside and the fix outside, and the review can be extracted and logged apart.","vi":"Thêm thẻ (tag) bao quanh bước rà soát để Claude đặt phần rà soát bên trong và bản sửa bên ngoài, nhờ đó phần rà soát có thể được tách ra và ghi log riêng."}},{"k":"D","t":{"en":"Provide five few-shot examples of correct fixes for Claude to mimic, bypassing the review step, removing the intermediate step and preventing logging.","vi":"Cung cấp năm ví dụ few-shot về các bản sửa đúng để Claude bắt chước, bỏ qua bước rà soát, loại bỏ bước trung gian và khiến không thể ghi log."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Chia tác vụ thành các lệnh gọi API riêng biệt: tạo bản sửa, rà soát nó theo các tiêu chí, rồi tinh chỉnh bản sửa, để mỗi bước có thể được ghi log độc lập.\u003cbr>\u003cbr>Tách generate, review và refine thành các API call tạo ra một kết quả review rõ ràng mà ứng dụng có thể lưu trước khi gửi sang bước sửa tiếp. Cấu trúc này cho phép kiểm tra từng chặng thay vì phụ thuộc vào suy luận nội bộ của một phản hồi.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Yêu cầu Claude tạo, kiểm chứng và tinh chỉnh bản sửa trong một phản hồi duy nhất bằng suy luận mở rộng (extended reasoning), nhưng cách này giữ bước rà soát ở bên trong và không thể ghi log.\u003c/strong>: Một phản hồi có thể chứa review công khai nếu yêu cầu, nhưng không tạo checkpoint riêng trước refinement như đề muốn; suy luận nội bộ không phải log kiểm chứng.\u003cbr>- \u003cstrong>Thêm thẻ (tag) bao quanh bước rà soát để Claude đặt phần rà soát bên trong và bản sửa bên ngoài, nhờ đó phần rà soát có thể được tách ra và ghi log riêng.\u003c/strong>: Tag thinking chỉ là markup, không bảo đảm suy luận nội bộ được xuất hoặc có bước dừng để log trước refine.\u003cbr>- \u003cstrong>Cung cấp năm ví dụ few-shot về các bản sửa đúng để Claude bắt chước, bỏ qua bước rà soát, loại bỏ bước trung gian và khiến không thể ghi log.\u003c/strong>: Ví dụ fix mẫu không tạo review trung gian theo tiêu chí.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices\" target=\"_blank\" rel=\"noopener noreferrer\">Prompting best practices\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":16,"sourceN":142},{"id":"diff-learning-143","n":143,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A platform wants Claude to discover tools using an existing embeddings index rather than the built-in regex or BM25 matching, because tool descriptions are sparse but semantically related through the embedding space.\u003cbr>\u003cbr>Which implementation matches this requirement?","vi":"Một nền tảng muốn Claude khám phá tool bằng một chỉ mục embedding (embeddings index) sẵn có thay vì cơ chế so khớp regex hoặc BM25 tích hợp sẵn, vì phần mô tả tool khá sơ sài nhưng có liên hệ ngữ nghĩa với nhau thông qua không gian embedding.\u003cbr>\u003cbr>Cách triển khai nào đáp ứng yêu cầu này?"},"options":[{"k":"A","t":{"en":"Build a custom tool that runs the embeddings search and returns tool_reference blocks in its tool_result for Claude to expand.","vi":"Xây dựng một tool tùy chỉnh chạy tìm kiếm embedding và trả về các block tool_reference trong tool_result của nó để Claude mở rộng (expand)."}},{"k":"B","t":{"en":"Enable the built-in BM25 tool search variant, since BM25 ranking approximates embedding-based semantic similarity closely enough.","vi":"Bật biến thể tool search BM25 tích hợp sẵn, vì xếp hạng BM25 xấp xỉ đủ sát với độ tương đồng ngữ nghĩa dựa trên embedding."}},{"k":"C","t":{"en":"Enable the built-in regex tool search variant and rely on broad wildcard patterns to approximate semantic matching.","vi":"Bật biến thể tool search regex tích hợp sẵn và dựa vào các mẫu wildcard rộng để xấp xỉ việc so khớp ngữ nghĩa."}},{"k":"D","t":{"en":"Disable tool search and load every tool definition up front so the embeddings index becomes unnecessary.","vi":"Tắt tool search và nạp trước toàn bộ định nghĩa tool ngay từ đầu để chỉ mục embedding trở nên không cần thiết."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Xây dựng một tool tùy chỉnh chạy tìm kiếm embedding và trả về các block tool_reference trong tool_result của nó để Claude mở rộng (expand).\u003cbr>\u003cbr>Custom search tool có thể gọi embeddings index sẵn có và trả tool_reference blocks trong tool_result. Claude dùng các tham chiếu đó để mở định nghĩa cần thiết, nên thuật toán tìm tool có thể theo ngữ nghĩa thay vì bị ràng buộc bởi matcher tích hợp.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Bật biến thể tool search BM25 tích hợp sẵn, vì xếp hạng BM25 xấp xỉ đủ sát với độ tương đồng ngữ nghĩa dựa trên embedding.\u003c/strong>: BM25 xếp hạng theo từ vựng; không thực hiện tìm kiếm trên embeddings index của nhóm.\u003cbr>- \u003cstrong>Bật biến thể tool search regex tích hợp sẵn và dựa vào các mẫu wildcard rộng để xấp xỉ việc so khớp ngữ nghĩa.\u003c/strong>: Regex khớp mẫu ký tự, không khai thác khoảng cách ngữ nghĩa của vector.\u003cbr>- \u003cstrong>Tắt tool search và nạp trước toàn bộ định nghĩa tool ngay từ đầu để chỉ mục embedding trở nên không cần thiết.\u003c/strong>: Nạp toàn bộ tool bỏ yêu cầu dùng index và làm tăng context ban đầu.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool\" target=\"_blank\" rel=\"noopener noreferrer\">Tool search tool\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":17,"sourceN":143},{"id":"diff-learning-144","n":144,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A support-ticket assistant retrieves passages from a 500-document internal knowledge base for each incoming ticket and must cite the exact source passage in every reply, without re-sending the entire corpus on each request.\u003cbr>\u003cbr>Which approach best matches this data shape and query pattern?","vi":"Một trợ lý xử lý ticket hỗ trợ truy xuất các đoạn văn (passage) từ một knowledge base nội bộ gồm 500 tài liệu cho mỗi ticket gửi đến, và phải trích dẫn chính xác đoạn nguồn trong mọi câu trả lời, mà không gửi lại toàn bộ kho tài liệu (corpus) ở mỗi yêu cầu.\u003cbr>\u003cbr>Cách tiếp cận nào phù hợp nhất với dạng dữ liệu và mẫu truy vấn này?"},"options":[{"k":"A","t":{"en":"Return the retrieved passages as search result content blocks from a retrieval tool, each carrying source and title metadata, so Claude generates natural citations per ticket.","vi":"Trả về các đoạn văn đã truy xuất dưới dạng các content block search result từ một tool truy xuất, mỗi block mang metadata về nguồn (source) và tiêu đề (title), để Claude tạo trích dẫn tự nhiên cho từng ticket."}},{"k":"B","t":{"en":"Upload all 500 documents as citable text documents in the system prompt so that Claude can reference any passage directly, and then instruct it to cite the source document and section for every reply.","vi":"Tải toàn bộ 500 tài liệu lên dưới dạng các tài liệu văn bản có thể trích dẫn trong system prompt để Claude có thể tham chiếu trực tiếp bất kỳ đoạn nào, rồi hướng dẫn nó trích dẫn tài liệu nguồn và mục tương ứng trong mọi câu trả lời."}},{"k":"C","t":{"en":"Concatenate the full corpus into a single long-context user message with all 500 documents separated by titles, then prompt Claude to extract the relevant passage and cite its source.","vi":"Ghép toàn bộ kho tài liệu thành một user message ngữ cảnh dài duy nhất với cả 500 tài liệu được phân tách bằng tiêu đề, rồi prompt Claude trích xuất đoạn liên quan và trích dẫn nguồn của nó."}},{"k":"D","t":{"en":"Store the corpus in the memory tool by saving each document as a separate entry, configure assistant to load all entries before answering, and prompt it to cite source document for any retrieved passage.","vi":"Lưu kho tài liệu vào memory tool bằng cách lưu mỗi tài liệu thành một mục riêng, cấu hình trợ lý nạp tất cả các mục trước khi trả lời, và prompt nó trích dẫn tài liệu nguồn cho bất kỳ đoạn nào được truy xuất."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Trả về các đoạn văn đã truy xuất dưới dạng các content block search result từ một tool truy xuất, mỗi block mang metadata về nguồn (source) và tiêu đề (title), để Claude tạo trích dẫn tự nhiên cho từng ticket.\u003cbr>\u003cbr>Truy hồi theo từng ticket chỉ đưa đoạn liên quan vào context. Search result blocks kèm source, title và nội dung cho phép attribution đến đoạn được trả về, đáp ứng yêu cầu citation mà không gửi lại cả 500 tài liệu. Cần bật citations cho các search result blocks được trả về.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Tải toàn bộ 500 tài liệu lên dưới dạng các tài liệu văn bản có thể trích dẫn trong system prompt để Claude có thể tham chiếu trực tiếp bất kỳ đoạn nào, rồi hướng dẫn nó trích dẫn tài liệu nguồn và mục tương ứng trong mọi câu trả lời.\u003c/strong>: Đưa cả 500 tài liệu vào prompt vẫn gửi toàn kho, trái hình dạng truy vấn theo ticket.\u003cbr>- \u003cstrong>Ghép toàn bộ kho tài liệu thành một user message ngữ cảnh dài duy nhất với cả 500 tài liệu được phân tách bằng tiêu đề, rồi prompt Claude trích xuất đoạn liên quan và trích dẫn nguồn của nó.\u003c/strong>: Nối toàn kho tiêu tốn context và không thực hiện lựa chọn đoạn liên quan trước khi gọi model.\u003cbr>- \u003cstrong>Lưu kho tài liệu vào memory tool bằng cách lưu mỗi tài liệu thành một mục riêng, cấu hình trợ lý nạp tất cả các mục trước khi trả lời, và prompt nó trích dẫn tài liệu nguồn cho bất kỳ đoạn nào được truy xuất.\u003c/strong>: Memory không phải thay thế vector index; nạp mọi entry vẫn đưa toàn kho vào mỗi lượt.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/search-results\" target=\"_blank\" rel=\"noopener noreferrer\">Search results\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":18,"sourceN":144},{"id":"diff-learning-145","n":145,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team originally split their onboarding manual into fixed 500-character chunks with no overlap.\u003cbr>\u003cbr>They now find that many chunks begin or end mid-sentence, and answers near a chunk boundary are frequently missed because the relevant sentence is split across two separate embeddings.\u003cbr>\u003cbr>Which chunking adjustment most directly addresses this specific failure?","vi":"Ban đầu, một nhóm chia sổ tay hướng dẫn nhân viên mới (onboarding manual) thành các chunk cố định 500 ký tự, không có chồng lấn (overlap).\u003cbr>\u003cbr>Giờ họ nhận thấy nhiều chunk bắt đầu hoặc kết thúc giữa câu, và các câu trả lời nằm gần ranh giới chunk thường bị bỏ sót vì câu liên quan bị tách ra giữa hai embedding riêng biệt.\u003cbr>\u003cbr>Điều chỉnh chunking nào giải quyết trực tiếp nhất lỗi cụ thể này?"},"options":[{"k":"A","t":{"en":"Split chunks along natural boundaries such as paragraphs or sections, and add a small overlap between adjacent chunks so boundary sentences appear intact in at least one chunk.","vi":"Chia chunk theo các ranh giới tự nhiên như đoạn văn hoặc mục (section), và thêm một phần chồng lấn nhỏ giữa các chunk liền kề để các câu ở ranh giới xuất hiện nguyên vẹn trong ít nhất một chunk."}},{"k":"B","t":{"en":"Reduce the chunk size so each chunk contains exactly one sentence, splitting on punctuation such as periods or exclamation points, and drop the fixed character limit to prevent mid-sentence breaks.","vi":"Giảm kích thước chunk để mỗi chunk chứa đúng một câu, tách theo dấu câu như dấu chấm hoặc dấu chấm than, và bỏ giới hạn ký tự cố định để tránh bị cắt giữa câu."}},{"k":"C","t":{"en":"Remove overlap and set a smaller fixed chunk size, such as 250 characters, to lower the vector index count and accelerate semantic search without changing how sentences are split.","vi":"Bỏ phần chồng lấn và đặt kích thước chunk cố định nhỏ hơn, chẳng hạn 250 ký tự, để giảm số lượng vector trong chỉ mục và tăng tốc tìm kiếm ngữ nghĩa mà không thay đổi cách tách câu."}},{"k":"D","t":{"en":"Keep the fixed 500-character boundaries and increase the embedding model's context window so that each vector encodes more surrounding text, reducing missed answers near splits.","vi":"Giữ ranh giới cố định 500 ký tự và tăng context window của model embedding để mỗi vector mã hóa thêm phần văn bản xung quanh, giảm số câu trả lời bị bỏ sót gần các điểm cắt."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Chia chunk theo các ranh giới tự nhiên như đoạn văn hoặc mục (section), và thêm một phần chồng lấn nhỏ giữa các chunk liền kề để các câu ở ranh giới xuất hiện nguyên vẹn trong ít nhất một chunk.\u003cbr>\u003cbr>Chia theo đoạn hoặc mục giữ đơn vị ý nghĩa liền mạch; overlap nhỏ giúp câu gần ranh giới xuất hiện đủ trong ít nhất một chunk. Đây là cách sửa trực tiếp lỗi câu bị cắt của đề. Kích thước và overlap cần đo trên dữ liệu thực, không có một giá trị tối ưu cho mọi kho.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Giảm kích thước chunk để mỗi chunk chứa đúng một câu, tách theo dấu câu như dấu chấm hoặc dấu chấm than, và bỏ giới hạn ký tự cố định để tránh bị cắt giữa câu.\u003c/strong>: Một câu mỗi chunk tránh cắt câu nhưng dễ mất ngữ cảnh nối nhiều câu; không bổ sung liên tục qua ranh giới như phương án phù hợp hơn.\u003cbr>- \u003cstrong>Bỏ phần chồng lấn và đặt kích thước chunk cố định nhỏ hơn, chẳng hạn 250 ký tự, để giảm số lượng vector trong chỉ mục và tăng tốc tìm kiếm ngữ nghĩa mà không thay đổi cách tách câu.\u003c/strong>: Chunk nhỏ hơn làm tăng số vector với cùng tài liệu, không giảm; vẫn cắt câu nếu giữ cách chia ký tự.\u003cbr>- \u003cstrong>Giữ ranh giới cố định 500 ký tự và tăng context window của model embedding để mỗi vector mã hóa thêm phần văn bản xung quanh, giảm số câu trả lời bị bỏ sót gần các điểm cắt.\u003c/strong>: Cửa sổ embedding lớn hơn không tự thêm văn bản nằm ngoài chunk đã truyền.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents\" target=\"_blank\" rel=\"noopener noreferrer\">Chunk documents for vector search\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":19,"sourceN":145},{"id":"diff-learning-146","n":146,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"An agent's project has accumulated a dozen skills, several of which perform side-effecting actions such as sending Slack messages or deleting stale branches.\u003cbr>\u003cbr>Reviewers notice Claude occasionally auto-triggers these side-effecting skills based on vague description matches, and want to reduce the agent's effective capability surface so these skills only run when a person explicitly invokes them.\u003cbr>\u003cbr>What is the most direct fix?","vi":"Dự án của một agent đã tích lũy khoảng một tá skill, trong đó một số skill thực hiện các hành động có tác dụng phụ (side effect) như gửi tin nhắn Slack hoặc xóa các branch đã cũ.\u003cbr>\u003cbr>Người rà soát nhận thấy Claude đôi khi tự động kích hoạt các skill có tác dụng phụ này dựa trên việc khớp mô tả một cách mơ hồ, và muốn thu hẹp phạm vi năng lực thực tế của agent để các skill này chỉ chạy khi có người chủ động gọi chúng.\u003cbr>\u003cbr>Cách khắc phục trực tiếp nhất là gì?"},"options":[{"k":"A","t":{"en":"Set disable-model-invocation: true in the frontmatter of each side-effecting skill so Claude cannot select them automatically and only the user can invoke them with /name.","vi":"Đặt disable-model-invocation: true trong frontmatter của từng skill có tác dụng phụ để Claude không thể tự động chọn chúng và chỉ người dùng mới có thể gọi chúng bằng /name."}},{"k":"B","t":{"en":"Delete the skill descriptions from the frontmatter of each side-effecting skill so Claude has no basis for automatic matching and only the user can invoke those skills by name.","vi":"Xóa phần mô tả skill khỏi frontmatter của từng skill có tác dụng phụ để Claude không có cơ sở tự động khớp và chỉ người dùng mới có thể gọi các skill đó theo tên."}},{"k":"C","t":{"en":"Move the side-effecting skills into CLAUDE.md so they load as always-on context, which ensures Claude only uses them when the user explicitly invokes them by name in a request.","vi":"Chuyển các skill có tác dụng phụ vào CLAUDE.md để chúng được nạp như context luôn bật, điều này bảo đảm Claude chỉ dùng chúng khi người dùng chủ động gọi theo tên trong một yêu cầu."}},{"k":"D","t":{"en":"Rewrite the instructions of each side-effecting skill to instruct Claude to ask for confirmation before performing the side effect, without modifying frontmatter fields.","vi":"Viết lại phần hướng dẫn của từng skill có tác dụng phụ để yêu cầu Claude xin xác nhận trước khi thực hiện tác dụng phụ, mà không sửa các trường frontmatter."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Đặt disable-model-invocation: true trong frontmatter của từng skill có tác dụng phụ để Claude không thể tự động chọn chúng và chỉ người dùng mới có thể gọi chúng bằng /name.\u003cbr>\u003cbr>disable-model-invocation: true chặn Claude tự chọn skill và dành việc gọi /name cho người dùng. Đây là cấu hình đúng điểm ra quyết định kích hoạt, giảm khả năng skill có side effect chạy chỉ vì mô tả khớp mơ hồ.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Xóa phần mô tả skill khỏi frontmatter của từng skill có tác dụng phụ để Claude không có cơ sở tự động khớp và chỉ người dùng mới có thể gọi các skill đó theo tên.\u003c/strong>: Bỏ mô tả làm discovery kém rõ nhưng không phải cơ chế disable invocation được hỗ trợ.\u003cbr>- \u003cstrong>Chuyển các skill có tác dụng phụ vào CLAUDE.md để chúng được nạp như context luôn bật, điều này bảo đảm Claude chỉ dùng chúng khi người dùng chủ động gọi theo tên trong một yêu cầu.\u003c/strong>: CLAUDE.md đưa chỉ dẫn vào ngữ cảnh thường trực, không thiết lập chế độ chỉ gọi thủ công.\u003cbr>- \u003cstrong>Viết lại phần hướng dẫn của từng skill có tác dụng phụ để yêu cầu Claude xin xác nhận trước khi thực hiện tác dụng phụ, mà không sửa các trường frontmatter.\u003c/strong>: Yêu cầu hỏi xác nhận điều khiển hành động sau khi skill đã kích hoạt, không ngăn auto-trigger.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/skills\" target=\"_blank\" rel=\"noopener noreferrer\">Extend Claude with skills\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":20,"sourceN":146},{"id":"diff-learning-147","n":147,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team is defining the success criteria for a new claims-summarization feature before building the evaluation dataset.\u003cbr>\u003cbr>The current draft criterion reads: &quot;the summaries should be concise and helpful.&quot;\u003cbr>\u003cbr>Which revised criterion best follows the SMART framework for evaluation design?","vi":"Một nhóm đang xác định tiêu chí thành công cho một tính năng tóm tắt hồ sơ bồi thường (claims) mới trước khi xây dựng tập dữ liệu đánh giá.\u003cbr>\u003cbr>Tiêu chí bản nháp hiện tại ghi: &quot;các bản tóm tắt phải ngắn gọn và hữu ích.&quot;\u003cbr>\u003cbr>Tiêu chí sửa đổi nào tuân theo khung SMART cho thiết kế đánh giá tốt nhất?"},"options":[{"k":"A","t":{"en":"Require summaries to average at least 4 out of 5 on a completeness rubric across a 500-claim sample","vi":"Yêu cầu các bản tóm tắt đạt trung bình ít nhất 4/5 điểm theo một rubric về độ đầy đủ trên một mẫu gồm 500 hồ sơ bồi thường"}},{"k":"B","t":{"en":"Require summaries to earn a perfect 5 out of 5 completeness score from every adjuster in the sample","vi":"Yêu cầu các bản tóm tắt đạt điểm tuyệt đối 5/5 về độ đầy đủ từ mọi chuyên viên thẩm định (adjuster) trong mẫu"}},{"k":"C","t":{"en":"Require summaries to sound less robotic and read more naturally to the adjusters who review them","vi":"Yêu cầu các bản tóm tắt nghe bớt máy móc và đọc tự nhiên hơn đối với các chuyên viên thẩm định rà soát chúng"}},{"k":"D","t":{"en":"Require every summary to be signed off by a senior adjuster before it counts as acceptable","vi":"Yêu cầu mọi bản tóm tắt phải được một chuyên viên thẩm định cấp cao phê duyệt trước khi được xem là chấp nhận được"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Yêu cầu các bản tóm tắt đạt trung bình ít nhất 4/5 điểm theo một rubric về độ đầy đủ trên một mẫu gồm 500 hồ sơ bồi thường\u003cbr>\u003cbr>Điểm completeness trung bình tối thiểu 4/5 trên mẫu 500 claim cho phép chấm theo rubric và kiểm tra kết quả cụ thể, tốt hơn “ngắn gọn và hữu ích”. Tuy vậy, lựa chọn này chưa nêu thời hạn hoặc chứng minh khả thi, nên không nên gọi là đầy đủ mọi yếu tố SMART.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Yêu cầu các bản tóm tắt đạt điểm tuyệt đối 5/5 về độ đầy đủ từ mọi chuyên viên thẩm định (adjuster) trong mẫu\u003c/strong>: Đòi mọi người chấm tuyệt đối 5/5 là ngưỡng khắt khe chưa có bằng chứng khả thi.\u003cbr>- \u003cstrong>Yêu cầu các bản tóm tắt nghe bớt máy móc và đọc tự nhiên hơn đối với các chuyên viên thẩm định rà soát chúng\u003c/strong>: Bớt máy móc và tự nhiên hơn vẫn thiếu rubric hoặc ngưỡng đo.\u003cbr>- \u003cstrong>Yêu cầu mọi bản tóm tắt phải được một chuyên viên thẩm định cấp cao phê duyệt trước khi được xem là chấp nhận được\u003c/strong>: Chữ ký cấp cao là bước quản trị, không định lượng chất lượng tóm tắt.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Lựa chọn nguồn tốt nhất nhưng chưa thể hiện đầy đủ SMART: thiếu time-bound và bằng chứng achievable. Không dạy rằng chỉ có điểm số và cỡ mẫu là đủ SMART.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success and build evaluations\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":21,"sourceN":147},{"id":"diff-learning-148","n":148,"topic":2,"type":"mcq","multi":false,"answer":["B"],"stem":{"en":"A platform engineer sets CLAUDE_CODE_ENABLE_TELEMETRY=1 on every CI runner but the team's OTLP collector never receives any spans, metrics, or logs from Claude Code jobs.\u003cbr>\u003cbr>No other telemetry variables were configured.\u003cbr>\u003cbr>What is the most likely cause of the missing data?","vi":"Một kỹ sư nền tảng đặt CLAUDE_CODE_ENABLE_TELEMETRY=1 trên mọi CI runner nhưng OTLP collector của nhóm không bao giờ nhận được bất kỳ span, metric hay log nào từ các job Claude Code.\u003cbr>\u003cbr>Không có biến telemetry nào khác được cấu hình.\u003cbr>\u003cbr>Nguyên nhân có khả năng nhất khiến dữ liệu bị thiếu là gì?"},"options":[{"k":"A","t":{"en":"The collector rejects every signal until CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 is also set, regardless of which exporters are chosen","vi":"Collector từ chối mọi tín hiệu cho đến khi CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 cũng được đặt, bất kể chọn exporter nào"}},{"k":"B","t":{"en":"Telemetry is enabled but no exporter was selected, so OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER default to producing no export at all","vi":"Telemetry đã được bật nhưng chưa chọn exporter nào, nên OTEL_METRICS_EXPORTER và OTEL_LOGS_EXPORTER mặc định không xuất (export) gì cả"}},{"k":"C","t":{"en":"The CLI only emits telemetry once the console exporter has been configured first as a required local fallback","vi":"CLI chỉ phát telemetry sau khi console exporter đã được cấu hình trước như một phương án dự phòng cục bộ bắt buộc"}},{"k":"D","t":{"en":"The organization's Admin API key must be exported through OTEL_EXPORTER_OTLP_HEADERS before the CLI will emit any signal","vi":"Admin API key của tổ chức phải được xuất qua OTEL_EXPORTER_OTLP_HEADERS thì CLI mới phát bất kỳ tín hiệu nào"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Telemetry đã được bật nhưng chưa chọn exporter nào, nên OTEL_METRICS_EXPORTER và OTEL_LOGS_EXPORTER mặc định không xuất (export) gì cả\u003cbr>\u003cbr>CLAUDE_CODE_ENABLE_TELEMETRY=1 bật thu telemetry nhưng chưa chọn nơi xuất. Cần đặt OTEL_METRICS_EXPORTER và OTEL_LOGS_EXPORTER phù hợp, ch
