ẳng hạn otlp, cùng endpoint/protocol. Không nên suy ra chỉ bật cờ là mọi loại signal sẽ được gửi đến collector.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Collector từ chối mọi tín hiệu cho đến khi CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 cũng được đặt, bất kể chọn exporter nào\u003c/strong>: Enhanced telemetry không thay cho việc cấu hình exporter cơ bản.\u003cbr>- \u003cstrong>CLI chỉ phát telemetry sau khi console exporter đã được cấu hình trước như một phương án dự phòng cục bộ bắt buộc\u003c/strong>: Console không phải bước bắt buộc trước OTLP; có thể chọn OTLP trực tiếp.\u003cbr>- \u003cstrong>Admin API key của tổ chức phải được xuất qua OTEL_EXPORTER_OTLP_HEADERS thì CLI mới phát bất kỳ tín hiệu nào\u003c/strong>: Admin API key không phải điều kiện chung để phát telemetry; header tùy yêu cầu xác thực collector.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\" target=\"_blank\" rel=\"noopener noreferrer\">Monitoring\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":22,"sourceN":148},{"id":"diff-learning-149","n":149,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"An agentic coding assistant runs long sessions that accumulate hundreds of tool calls, and the conversation regularly approaches the model's context window limit before the task is finished.\u003cbr>\u003cbr>Engineers want strategies that let the session continue productively without losing critical state.\u003cbr>\u003cbr>Which approaches address this goal?","vi":"Một trợ lý lập trình dạng agent (agentic coding assistant) chạy các phiên dài tích lũy hàng trăm lệnh gọi tool, và cuộc hội thoại thường xuyên tiến gần giới hạn context window của model trước khi tác vụ hoàn thành.\u003cbr>\u003cbr>Các kỹ sư muốn có các chiến lược giúp phiên tiếp tục hiệu quả mà không mất trạng thái quan trọng.\u003cbr>\u003cbr>Những cách tiếp cận nào giải quyết mục tiêu này?"},"options":[{"k":"A","t":{"en":"Enable server-side compaction so earlier turns are automatically summarized once the conversation nears the context window limit","vi":"Bật compaction phía server (server-side) để các lượt trước đó được tự động tóm tắt khi cuộc hội thoại gần chạm giới hạn context window"}},{"k":"B","t":{"en":"Configure context editing to clear old tool results once a token threshold is reached, keeping only recent tool use/result pairs","vi":"Cấu hình context editing để xóa các kết quả tool cũ khi đạt đến một ngưỡng token, chỉ giữ lại các cặp tool use/result gần đây"}},{"k":"C","t":{"en":"Use the memory tool to persist critical state to durable storage before old context is cleared, so a session recovers quickly","vi":"Dùng memory tool để lưu trạng thái quan trọng vào kho lưu trữ bền vững trước khi context cũ bị xóa, nhờ đó phiên khôi phục nhanh chóng"}},{"k":"D","t":{"en":"Lower the effort parameter to low so Claude generates shorter replies, preventing the context window from ever filling up","vi":"Hạ tham số effort xuống low để Claude tạo các phản hồi ngắn hơn, ngăn context window không bao giờ bị đầy"}},{"k":"E","t":{"en":"Switch the session to the Message Batches API so each turn runs as an independent asynchronous request with fresh context","vi":"Chuyển phiên sang Message Batches API để mỗi lượt chạy như một yêu cầu bất đồng bộ độc lập với context mới"}},{"k":"F","t":{"en":"Increase the effort parameter to max so Claude reasons more thoroughly and needs fewer total turns to finish the task","vi":"Tăng tham số effort lên max để Claude suy luận kỹ lưỡng hơn và cần ít lượt hơn để hoàn thành tác vụ"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Bật compaction phía server (server-side) để các lượt trước đó được tự động tóm tắt khi cuộc hội thoại gần chạm giới hạn context window\u003cbr>\u003cbr>Server-side compaction thay lịch sử dài bằng bản tóm tắt khi gần ngưỡng, tạo chỗ để agent tiếp tục. Context editing để bỏ kết quả tool cũ và memory để lưu trạng thái bền vững cũng phù hợp, nhưng khóa chỉ chọn compaction. Những cơ chế này cần giữ thông tin quan trọng có chủ đích, không hứa không mất dữ liệu.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Cấu hình context editing để xóa các kết quả tool cũ khi đạt đến một ngưỡng token, chỉ giữ lại các cặp tool use/result gần đây\u003c/strong>: Context editing cũng đúng: dọn kết quả cũ và giữ phần gần đây giảm áp lực context; khóa đang thiếu.\u003cbr>- \u003cstrong>Dùng memory tool để lưu trạng thái quan trọng vào kho lưu trữ bền vững trước khi context cũ bị xóa, nhờ đó phiên khôi phục nhanh chóng\u003c/strong>: Memory cũng đúng khi ứng dụng lưu bền vững và truy hồi trạng thái cần thiết trước khi dọn; khóa đang thiếu.\u003cbr>- \u003cstrong>Hạ tham số effort xuống low để Claude tạo các phản hồi ngắn hơn, ngăn context window không bao giờ bị đầy\u003c/strong>: Effort thấp có thể giảm output nhưng input và tool vẫn tích lũy, nên không ngăn context đầy mãi mãi.\u003cbr>- \u003cstrong>Chuyển phiên sang Message Batches API để mỗi lượt chạy như một yêu cầu bất đồng bộ độc lập với context mới\u003c/strong>: Batch là cách chạy bất đồng bộ, không tự giữ liên tục trạng thái giữa các lượt agent.\u003cbr>- \u003cstrong>Tăng tham số effort lên max để Claude suy luận kỹ lưỡng hơn và cần ít lượt hơn để hoàn thành tác vụ\u003c/strong>: Effort max tăng suy luận và token, không phải cơ chế giải phóng context.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Khóa nguồn chỉ chọn compaction trong câu hỏi nhiều chiến lược. Context editing và memory cũng phù hợp; cần duyệt thêm hai nội dung này, giữ nguyên khóa hiện tại.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/compaction\" target=\"_blank\" rel=\"noopener noreferrer\">Compaction overview\u003c/a>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-editing\" target=\"_blank\" rel=\"noopener noreferrer\">Context editing\u003c/a>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\" target=\"_blank\" rel=\"noopener noreferrer\">Memory tool\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":23,"sourceN":149},{"id":"diff-learning-150","n":150,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team wants to lower per-request cost and latency for a chat feature without switching models or losing response quality on genuinely hard questions.\u003cbr>\u003cbr>They want the model itself to spend fewer tokens on easy turns while still reasoning thoroughly on complex ones.\u003cbr>\u003cbr>Which lever should they reach for first?","vi":"Một nhóm muốn giảm chi phí và độ trễ trên mỗi yêu cầu cho một tính năng chat mà không đổi model hay làm giảm chất lượng phản hồi với những câu hỏi thực sự khó.\u003cbr>\u003cbr>Họ muốn chính model tiêu tốn ít token hơn ở các lượt dễ, trong khi vẫn suy luận kỹ lưỡng ở các lượt phức tạp.\u003cbr>\u003cbr>Họ nên dùng đòn bẩy nào trước tiên?"},"options":[{"k":"A","t":{"en":"Lower the effort parameter for routine turns, since it reduces token spend while letting Claude think harder when warranted","vi":"Hạ tham số effort cho các lượt thông thường, vì nó giảm lượng token tiêu tốn trong khi vẫn cho phép Claude suy nghĩ kỹ hơn khi cần thiết"}},{"k":"B","t":{"en":"Disable prompt caching entirely, since removing all cached writes always guarantees the very lowest possible token count of all","vi":"Tắt hoàn toàn prompt caching, vì loại bỏ mọi thao tác ghi cache luôn bảo đảm số token thấp nhất có thể"}},{"k":"C","t":{"en":"Force every request through the Message Batches API, since batch requests are billed at a flat discounted rate","vi":"Buộc mọi yêu cầu đi qua Message Batches API, vì các yêu cầu batch được tính phí theo một mức chiết khấu cố định"}},{"k":"D","t":{"en":"Set max_tokens to a small fixed value on all requests so Claude cannot generate long responses on hard questions","vi":"Đặt max_tokens ở một giá trị cố định nhỏ cho mọi yêu cầu để Claude không thể tạo phản hồi dài cho các câu hỏi khó"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Hạ tham số effort cho các lượt thông thường, vì nó giảm lượng token tiêu tốn trong khi vẫn cho phép Claude suy nghĩ kỹ hơn khi cần thiết\u003cbr>\u003cbr>Effort là nút điều chỉnh lượng tài nguyên suy luận: dùng mức thấp cho lượt đơn giản và mức cao hơn cho việc khó sau khi đo chất lượng. Nó cho phép tránh tiêu tốn như nhau cho mọi câu, nhưng mức thấp không bảo đảm chất lượng luôn giữ nguyên và phải được kiểm chứng trên tác vụ thật.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Tắt hoàn toàn prompt caching, vì loại bỏ mọi thao tác ghi cache luôn bảo đảm số token thấp nhất có thể\u003c/strong>: Tắt cache loại bỏ cơ hội tái sử dụng prefix, không bảo đảm chi phí thấp nhất.\u003cbr>- \u003cstrong>Buộc mọi yêu cầu đi qua Message Batches API, vì các yêu cầu batch được tính phí theo một mức chiết khấu cố định\u003c/strong>: Batch giảm giá cho công việc chấp nhận chờ, không làm model tự phân bổ suy luận theo độ khó của chat tức thời.\u003cbr>- \u003cstrong>Đặt max_tokens ở một giá trị cố định nhỏ cho mọi yêu cầu để Claude không thể tạo phản hồi dài cho các câu hỏi khó\u003c/strong>: max_tokens nhỏ cắt trần cả câu khó, có thể làm phản hồi chưa hoàn chỉnh.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/effort\" target=\"_blank\" rel=\"noopener noreferrer\">Effort\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":24,"sourceN":150},{"id":"diff-learning-151","n":151,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"Ahead of launch, a product manager sets a success criterion requiring the model to achieve 100% accuracy on an open-ended reasoning task, with zero tolerance for any incorrect or incomplete answer, matching or exceeding what a domain expert could produce.\u003cbr>\u003cbr>What is the main problem with this success criterion, and how should it be revised?","vi":"Trước khi ra mắt, một product manager đặt tiêu chí thành công yêu cầu model đạt độ chính xác 100% trên một tác vụ suy luận mở (open-ended), không chấp nhận bất kỳ câu trả lời sai hoặc thiếu sót nào, ngang bằng hoặc vượt mức mà một chuyên gia trong lĩnh vực có thể tạo ra.\u003cbr>\u003cbr>Vấn đề chính của tiêu chí thành công này là gì, và nên sửa nó như thế nào?"},"options":[{"k":"A","t":{"en":"The target is unachievable because it exceeds realistic frontier-model capability. It should instead be grounded in benchmark results, prior experiments, or comparable industry performance.","vi":"Mục tiêu không thể đạt được vì vượt quá năng lực thực tế của các model tiên tiến nhất (frontier model). Thay vào đó, nó nên dựa trên kết quả benchmark, các thử nghiệm trước đó hoặc hiệu năng tương đương trong ngành."}},{"k":"B","t":{"en":"The target is not specific enough because it does not name a single numeric metric, so it should be replaced with a quantifiable percentage like a 95% accuracy score, regardless of feasibility.","vi":"Mục tiêu chưa đủ cụ thể vì không nêu một chỉ số định lượng duy nhất, nên cần thay bằng một tỷ lệ phần trăm định lượng được như điểm độ chính xác 95%, bất kể tính khả thi."}},{"k":"C","t":{"en":"The target is not relevant because reasoning tasks should never have accuracy targets; instead, the criterion should specify maximum latency and cost, which are the only meaningful production metrics.","vi":"Mục tiêu không phù hợp (relevant) vì các tác vụ suy luận không bao giờ nên có mục tiêu độ chính xác; thay vào đó, tiêu chí nên quy định độ trễ và chi phí tối đa, vốn là những chỉ số production duy nhất có ý nghĩa."}},{"k":"D","t":{"en":"The target is not measurable because open-ended tasks cannot be scored automatically under any circumstances, so the criterion should rely on subjective human ratings with no automated evaluation.","vi":"Mục tiêu không đo lường được vì các tác vụ mở không thể được chấm điểm tự động trong bất kỳ trường hợp nào, nên tiêu chí cần dựa vào đánh giá chủ quan của con người mà không có đánh giá tự động."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Mục tiêu không thể đạt được vì vượt quá năng lực thực tế của các model tiên tiến nhất (frontier model). Thay vào đó, nó nên dựa trên kết quả benchmark, các thử nghiệm trước đó hoặc hiệu năng tương đương trong ngành.\u003cbr>\u003cbr>Cam kết tuyệt đối 100% trên suy luận mở chưa có cơ sở khả thi, kể cả chuyên gia cũng có thể sai. Nên đặt mục tiêu từ benchmark đại diện, thử nghiệm và mức rủi ro chấp nhận, với quy tắc chấm rõ cho câu thiếu hoặc sai.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Mục tiêu chưa đủ cụ thể vì không nêu một chỉ số định lượng duy nhất, nên cần thay bằng một tỷ lệ phần trăm định lượng được như điểm độ chính xác 95%, bất kể tính khả thi.\u003c/strong>: 100% đã là số cụ thể; thay bằng 95% tùy ý vẫn chưa chứng minh khả thi.\u003cbr>- \u003cstrong>Mục tiêu không phù hợp (relevant) vì các tác vụ suy luận không bao giờ nên có mục tiêu độ chính xác; thay vào đó, tiêu chí nên quy định độ trễ và chi phí tối đa, vốn là những chỉ số production duy nhất có ý nghĩa.\u003c/strong>: Độ chính xác vẫn liên quan đến nhiệm vụ suy luận, cùng với cost và latency.\u003cbr>- \u003cstrong>Mục tiêu không đo lường được vì các tác vụ mở không thể được chấm điểm tự động trong bất kỳ trường hợp nào, nên tiêu chí cần dựa vào đánh giá chủ quan của con người mà không có đánh giá tự động.\u003c/strong>: Tác vụ mở vẫn có thể chấm bằng rubric, quy tắc hoặc grader được hiệu chuẩn; không bắt buộc hoàn toàn chủ quan.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success and build evaluations\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":25,"sourceN":151},{"id":"diff-learning-152","n":152,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team has been iterating on a claims-processing prompt using the same 200-example development set for every round of refinement.\u003cbr>\u003cbr>They now want to declare a final winning version before shipping.\u003cbr>\u003cbr>What should they do before making that final decision?","vi":"Một nhóm đã liên tục tinh chỉnh một prompt xử lý hồ sơ bồi thường (claims) bằng cùng một tập phát triển (development set) gồm 200 ví dụ cho mọi vòng tinh chỉnh.\u003cbr>\u003cbr>Giờ họ muốn chốt một phiên bản chiến thắng cuối cùng trước khi phát hành.\u003cbr>\u003cbr>Họ nên làm gì trước khi đưa ra quyết định cuối cùng đó?"},"options":[{"k":"A","t":{"en":"Evaluate the leading prompt candidate on a separate held-out test set not used during iteration to confirm that improvements generalize beyond the development set.","vi":"Đánh giá ứng viên prompt dẫn đầu trên một tập kiểm thử giữ riêng (held-out test set) tách biệt, không được dùng trong quá trình lặp, để xác nhận rằng các cải thiện có tính tổng quát hóa vượt ra ngoài tập phát triển."}},{"k":"B","t":{"en":"Run one more round of refinement on the same 200-example development set, perhaps switching to a different model or adding few-shot examples, to maximize the score before finalizing the prompt.","vi":"Chạy thêm một vòng tinh chỉnh trên cùng tập phát triển 200 ví dụ, có thể chuyển sang model khác hoặc bổ sung ví dụ few-shot, để tối đa hóa điểm số trước khi chốt prompt."}},{"k":"C","t":{"en":"Reduce the development set to only the examples that the current prompt candidate already passes, then present the accuracy on that subset as the final metric to make the score appear higher.","vi":"Thu gọn tập phát triển chỉ còn những ví dụ mà ứng viên prompt hiện tại đã vượt qua, rồi trình bày độ chính xác trên tập con đó làm chỉ số cuối cùng để điểm số trông cao hơn."}},{"k":"D","t":{"en":"Ship the candidate that achieves the highest score on the 200-example development set right away, as iteratively refining on that same set already demonstrates its production readiness.","vi":"Phát hành ngay ứng viên đạt điểm cao nhất trên tập phát triển 200 ví dụ, vì việc tinh chỉnh lặp đi lặp lại trên chính tập đó đã chứng minh mức sẵn sàng cho production."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Đánh giá ứng viên prompt dẫn đầu trên một tập kiểm thử giữ riêng (held-out test set) tách biệt, không được dùng trong quá trình lặp, để xác nhận rằng các cải thiện có tính tổng quát hóa vượt ra ngoài tập phát triển.\u003cbr>\u003cbr>Đánh giá ứng viên trên test set giữ riêng giúp kiểm tra liệu prompt học quy luật hữu ích hay chỉ được điều chỉnh khớp 200 ví dụ quen thuộc. Không dùng kết quả test để tiếp tục tinh chỉnh rồi vẫn gọi đó là phép thử độc lập.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Chạy thêm một vòng tinh chỉnh trên cùng tập phát triển 200 ví dụ, có thể chuyển sang model khác hoặc bổ sung ví dụ few-shot, để tối đa hóa điểm số trước khi chốt prompt.\u003c/strong>: Tối ưu thêm trên cùng tập chỉ tăng sự phụ thuộc vào dữ liệu đã thấy.\u003cbr>- \u003cstrong>Thu gọn tập phát triển chỉ còn những ví dụ mà ứng viên prompt hiện tại đã vượt qua, rồi trình bày độ chính xác trên tập con đó làm chỉ số cuối cùng để điểm số trông cao hơn.\u003c/strong>: Chỉ giữ ví dụ đã qua tạo thiên lệch chọn mẫu và làm metric không đại diện.\u003cbr>- \u003cstrong>Phát hành ngay ứng viên đạt điểm cao nhất trên tập phát triển 200 ví dụ, vì việc tinh chỉnh lặp đi lặp lại trên chính tập đó đã chứng minh mức sẵn sàng cho production.\u003c/strong>: Điểm development cao sau nhiều vòng không chứng minh tổng quát hóa production.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\" target=\"_blank\" rel=\"noopener noreferrer\">Define success and build evaluations\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":26,"sourceN":152},{"id":"diff-learning-153","n":153,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team currently runs a moderately complex data-extraction workflow on Claude Haiku 4.5.\u003cbr>\u003cbr>Which of the following observations would be valid evidence that the workflow has a model-capability mismatch and should be evaluated on a more capable model like Claude Opus 4.8? (Select all that apply.)","vi":"Một nhóm hiện đang chạy một workflow trích xuất dữ liệu có độ phức tạp vừa phải trên Claude Haiku 4.5.\u003cbr>\u003cbr>Những quan sát nào sau đây là bằng chứng hợp lệ cho thấy workflow gặp tình trạng không khớp về năng lực model (model-capability mismatch) và nên được đánh giá trên một model mạnh hơn như Claude Opus 4.8? (Chọn tất cả các đáp án phù hợp.)"},"options":[{"k":"A","t":{"en":"On a use-case benchmark, accuracy on multi-step reasoning subtasks stays below threshold even after prompt revisions.","vi":"Trên một benchmark theo use case, độ chính xác ở các tác vụ con suy luận nhiều bước vẫn dưới ngưỡng ngay cả sau khi đã sửa prompt."}},{"k":"B","t":{"en":"The workflow needs nuanced understanding across long chains of interdependent steps where partial errors compound.","vi":"Workflow cần khả năng hiểu tinh tế qua các chuỗi dài gồm những bước phụ thuộc lẫn nhau, nơi các lỗi nhỏ cộng dồn."}},{"k":"C","t":{"en":"Manual review shows the extraction errors resemble genuine reasoning mistakes rather than missing or truncated input.","vi":"Rà soát thủ công cho thấy các lỗi trích xuất giống lỗi suy luận thực sự chứ không phải do đầu vào bị thiếu hoặc bị cắt cụt."}},{"k":"D","t":{"en":"The team's monthly API spend for the workflow is higher than they originally budgeted for the project.","vi":"Chi phí API hằng tháng của nhóm cho workflow cao hơn ngân sách ban đầu dành cho dự án."}},{"k":"E","t":{"en":"The workflow occasionally times out because of ordinary network latency between the client and the API.","vi":"Workflow thỉnh thoảng bị timeout do độ trễ mạng thông thường giữa client và API."}},{"k":"F","t":{"en":"The workflow's prompt was designed for an older model and has not been adapted to the current model's capabilities.","vi":"Prompt của workflow được thiết kế cho một model cũ hơn và chưa được điều chỉnh theo năng lực của model hiện tại."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Trên một benchmark theo use case, độ chính xác ở các tác vụ con suy luận nhiều bước vẫn dưới ngưỡng ngay cả sau khi đã sửa prompt.\u003cbr>\u003cbr>Điểm reasoning vẫn dưới ngưỡng sau sửa prompt là bằng chứng hợp lý để thử model mạnh hơn trên cùng benchmark. Trước khi quy lỗi cho năng lực model, cần loại bỏ thiếu dữ liệu, truncation và lỗi pipeline. Nhu cầu reasoning phụ thuộc nhiều bước và lỗi reasoning được review xác nhận cũng là bằng chứng hợp lệ mà khóa Select all bỏ sót.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Workflow cần khả năng hiểu tinh tế qua các chuỗi dài gồm những bước phụ thuộc lẫn nhau, nơi các lỗi nhỏ cộng dồn.\u003c/strong>: Các bước phụ thuộc gây lỗi cộng dồn là yêu cầu năng lực hợp lệ; cần đưa vào duyệt khóa.\u003cbr>- \u003cstrong>Rà soát thủ công cho thấy các lỗi trích xuất giống lỗi suy luận thực sự chứ không phải do đầu vào bị thiếu hoặc bị cắt cụt.\u003c/strong>: Lỗi reasoning đã phân biệt với input thiếu là bằng chứng trực tiếp; khóa bỏ sót.\u003cbr>- \u003cstrong>Chi phí API hằng tháng của nhóm cho workflow cao hơn ngân sách ban đầu dành cho dự án.\u003c/strong>: Vượt ngân sách phản ánh cost, không tự chứng minh model thiếu năng lực; đổi mạnh hơn có thể tăng chi phí.\u003cbr>- \u003cstrong>Workflow thỉnh thoảng bị timeout do độ trễ mạng thông thường giữa client và API.\u003c/strong>: Timeout do mạng cần sửa đường truyền hoặc retry, không chứng minh thiếu reasoning.\u003cbr>- \u003cstrong>Prompt của workflow được thiết kế cho một model cũ hơn và chưa được điều chỉnh theo năng lực của model hiện tại.\u003c/strong>: Prompt chưa thích nghi là biến nhiễu cần xử lý trước khi kết luận mismatch.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Đề yêu cầu chọn tất cả nhưng khóa chỉ chọn accuracy dưới ngưỡng. Nhu cầu reasoning phụ thuộc sâu và lỗi reasoning đã xác nhận cũng hợp lệ; cần duyệt khóa theo nội dung, không tự đổi.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model\" target=\"_blank\" rel=\"noopener noreferrer\">Choosing the right model\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":27,"sourceN":153},{"id":"diff-learning-154","n":154,"topic":2,"type":"mcq","multi":false,"answer":["D"],"stem":{"en":"A compliance analyst asks Claude to review a 40-page vendor contract and flag every clause that conflicts with the company's data-retention policy.\u003cbr>\u003cbr>In early testing, Claude cites clause numbers and language that do not actually appear in the contract.\u003cbr>\u003cbr>Which prompting change is most effective at grounding the review in the actual document text for this kind of long-document task?","vi":"Một chuyên viên phân tích tuân thủ (compliance) yêu cầu Claude rà soát một hợp đồng nhà cung cấp dài 40 trang và gắn cờ mọi điều khoản xung đột với chính sách lưu giữ dữ liệu (data retention) của công ty.\u003cbr>\u003cbr>Trong giai đoạn thử nghiệm ban đầu, Claude trích dẫn số điều khoản và câu chữ không hề xuất hiện trong hợp đồng.\u003cbr>\u003cbr>Thay đổi prompt nào hiệu quả nhất để neo (ground) việc rà soát vào văn bản thực tế của tài liệu cho loại tác vụ tài liệu dài này?"},"options":[{"k":"A","t":{"en":"Ask Claude to answer using its general knowledge of standard contract clauses instead of the specific text, since standard clauses are usually representative","vi":"Yêu cầu Claude trả lời dựa trên kiến thức chung về các điều khoản hợp đồng tiêu chuẩn thay vì văn bản cụ thể, vì các điều khoản tiêu chuẩn thường mang tính đại diện"}},{"k":"B","t":{"en":"Instruct Claude to summarize the entire contract into three paragraphs first, then perform the compliance analysis using only that summary as its source","vi":"Hướng dẫn Claude trước tiên tóm tắt toàn bộ hợp đồng thành ba đoạn, sau đó thực hiện phân tích tuân thủ chỉ dùng bản tóm tắt đó làm nguồn"}},{"k":"C","t":{"en":"Reduce the max_tokens parameter for the response so Claude produces a shorter, more focused answer that is less likely to drift from the source contract","vi":"Giảm tham số max_tokens cho phản hồi để Claude tạo câu trả lời ngắn hơn, tập trung hơn, ít có khả năng lệch khỏi hợp đồng nguồn"}},{"k":"D","t":{"en":"Instruct Claude to first extract exact, word-for-word quotes relevant to data retention, and only then analyze compliance by referencing those extracted quotes","vi":"Hướng dẫn Claude trước tiên trích xuất các trích dẫn chính xác, nguyên văn từng chữ liên quan đến việc lưu giữ dữ liệu, và chỉ sau đó mới phân tích tuân thủ bằng cách tham chiếu các trích dẫn đã trích xuất đó"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Hướng dẫn Claude trước tiên trích xuất các trích dẫn chính xác, nguyên văn từng chữ liên quan đến việc lưu giữ dữ liệu, và chỉ sau đó mới phân tích tuân thủ bằng cách tham chiếu các trích dẫn đã trích xuất đó\u003cbr>\u003cbr>Trích nguyên văn điều khoản liên quan trước tạo tập bằng chứng kiểm tra được ngay trong hợp đồng. Bước phân tích sau phải gắn từng kết luận vào các trích đoạn đó, giúp phát hiện số điều hoặc câu chữ bị bịa; vẫn cần kiểm tra độ đầy đủ của việc tìm điều khoản.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Yêu cầu Claude trả lời dựa trên kiến thức chung về các điều khoản hợp đồng tiêu chuẩn thay vì văn bản cụ thể, vì các điều khoản tiêu chuẩn thường mang tính đại diện\u003c/strong>: Kiến thức hợp đồng chung không chứng minh điều khoản thực tế của hợp đồng này.\u003cbr>- \u003cstrong>Hướng dẫn Claude trước tiên tóm tắt toàn bộ hợp đồng thành ba đoạn, sau đó thực hiện phân tích tuân thủ chỉ dùng bản tóm tắt đó làm nguồn\u003c/strong>: Tóm tắt ba đoạn có thể bỏ chính điều khoản cần kiểm tra và mất nguồn nguyên văn.\u003cbr>- \u003cstrong>Giảm tham số max_tokens cho phản hồi để Claude tạo câu trả lời ngắn hơn, tập trung hơn, ít có khả năng lệch khỏi hợp đồng nguồn\u003c/strong>: Giảm max_tokens không thêm bằng chứng nguồn và có thể cắt mất phân tích.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices\" target=\"_blank\" rel=\"noopener noreferrer\">Prompting best practices\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":28,"sourceN":154},{"id":"diff-learning-155","n":155,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A fintech company's Claude-powered agent can initiate wire transfers through a custom MCP tool.\u003cbr>\u003cbr>Even though the operations team has configured allowedTools to auto-approve most read and reporting tools, they want every wire-transfer tool call to require a human's explicit approval no matter what permission mode the session is later switched to, including bypassPermissions.\u003cbr>\u003cbr>Which approach best satisfies this requirement?","vi":"Agent chạy bằng Claude của một công ty fintech có thể khởi tạo các giao dịch chuyển khoản (wire transfer) thông qua một MCP tool tùy chỉnh.\u003cbr>\u003cbr>Mặc dù nhóm vận hành đã cấu hình allowedTools để tự động phê duyệt hầu hết các tool đọc và báo cáo, họ muốn mọi lệnh gọi tool chuyển khoản đều phải có sự phê duyệt tường minh của con người, bất kể phiên sau đó được chuyển sang permission mode nào, kể cả bypassPermissions.\u003cbr>\u003cbr>Cách tiếp cận nào đáp ứng tốt nhất yêu cầu này?"},"options":[{"k":"A","t":{"en":"Register a PreToolUse hook scoped to the wire-transfer tool that returns permissionDecision &quot;ask&quot; for every call, since hooks execute before deny rules, ask rules, the permission mode check, and allow rules, and their decision holds even under bypassPermissions.","vi":"Đăng ký một PreToolUse hook giới hạn cho tool chuyển khoản, trả về permissionDecision &quot;ask&quot; cho mọi lệnh gọi, vì hook được thực thi trước các deny rule, ask rule, bước kiểm tra permission mode và các allow rule, và quyết định của nó vẫn có hiệu lực ngay cả khi ở bypassPermissions."}},{"k":"B","t":{"en":"Add a bare allowedTools entry for the wire-transfer tool so it auto-approves, then depend on the canUseTool callback to intercept it, since bare allow rules approve every matching call before canUseTool is ever consulted, so the callback never runs for that tool.","vi":"Thêm một mục allowedTools trần (bare) cho tool chuyển khoản để nó được tự động phê duyệt, rồi dựa vào callback canUseTool để chặn nó, trong khi các allow rule trần phê duyệt mọi lệnh gọi khớp trước khi canUseTool kịp được tham vấn, nên callback không bao giờ chạy cho tool đó."}},{"k":"C","t":{"en":"Switch the session's permission mode to acceptEdits, expecting the wire-transfer tool to fall outside its file-edit scope and always route to canUseTool, though other tools under acceptEdits still fall through to any allow rules that already approve them.","vi":"Chuyển permission mode của phiên sang acceptEdits, kỳ vọng tool chuyển khoản nằm ngoài phạm vi sửa file của chế độ này và luôn được chuyển tới canUseTool, dù các tool khác dưới acceptEdits vẫn rơi xuống bất kỳ allow rule nào đã phê duyệt chúng."}},{"k":"D","t":{"en":"Add the wire-transfer tool to disallowed_tools with a wildcard pattern so it is blocked by default, then have the canUseTool callback lift the deny rule per call, though deny rules are evaluated before canUseTool runs and cannot be reversed from inside that callback.","vi":"Thêm tool chuyển khoản vào disallowed_tools với một mẫu wildcard để nó bị chặn mặc định, rồi để callback canUseTool gỡ deny rule cho từng lệnh gọi, dù các deny rule được đánh giá trước khi canUseTool chạy và không thể bị đảo ngược từ bên trong callback đó."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Đăng ký một PreToolUse hook giới hạn cho tool chuyển khoản, trả về permissionDecision &quot;ask&quot; cho mọi lệnh gọi, vì hook được thực thi trước các deny rule, ask rule, bước kiểm tra permission mode và các allow rule, và quyết định của nó vẫn có hiệu lực ngay cả khi ở bypassPermissions.\u003cbr>\u003cbr>PreToolUse gắn đúng tool chuyển tiền có thể trả permissionDecision=&quot;ask&quot; để yêu cầu xác nhận trước khi gọi. Tuy nhiên, khóa khẳng định hook luôn thắng mọi quy tắc và mọi mode là quá rộng: tài liệu hiện vẫn xét deny/ask rules. Với yêu cầu bất biến cho giao dịch, cần cổng phê duyệt do ứng dụng/tool kiểm soát và kiểm thử theo phiên bản, không chỉ tin vào thay đổi mode.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Thêm một mục allowedTools trần (bare) cho tool chuyển khoản để nó được tự động phê duyệt, rồi dựa vào callback canUseTool để chặn nó, trong khi các allow rule trần phê duyệt mọi lệnh gọi khớp trước khi canUseTool kịp được tham vấn, nên callback không bao giờ chạy cho tool đó.\u003c/strong>: Auto-allow tool chuyển tiền đi ngược yêu cầu phê duyệt; callback không đáng tin để chặn call đã được cho qua trước đó.\u003cbr>- \u003cstrong>Chuyển permission mode của phiên sang acceptEdits, kỳ vọng tool chuyển khoản nằm ngoài phạm vi sửa file của chế độ này và luôn được chuyển tới canUseTool, dù các tool khác dưới acceptEdits vẫn rơi xuống bất kỳ allow rule nào đã phê duyệt chúng.\u003c/strong>: acceptEdits chỉ đổi mặc định quyền sửa file, không cưỡng chế phê duyệt MCP bất kể rule hiện có.\u003cbr>- \u003cstrong>Thêm tool chuyển khoản vào disallowed_tools với một mẫu wildcard để nó bị chặn mặc định, rồi để callback canUseTool gỡ deny rule cho từng lệnh gọi, dù các deny rule được đánh giá trước khi canUseTool chạy và không thể bị đảo ngược từ bên trong callback đó.\u003c/strong>: Deny rule chặn trước callback; callback không phải cơ chế nâng deny thành quyền cho từng lần.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Đáp án nguồn khẳng định thứ tự quyền quá rộng. Docs hiện nói deny/ask rules vẫn được xét bất kể hook trả gì và còn có mods. Cần viết lại câu theo phiên bản triển khai; không xem hook là bảo đảm bất biến dưới mọi mode.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/hooks\" target=\"_blank\" rel=\"noopener noreferrer\">Hooks reference\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":29,"sourceN":155},{"id":"diff-learning-156","n":156,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A solutions architect is scoping the ethical-risk controls for a Claude-based assistant that will draft internal performance-review summaries from manager notes across a multinational workforce.\u003cbr>\u003cbr>The compliance team wants a set of concrete measures that address bias, fairness, and transparency before launch.\u003cbr>\u003cbr>Which of the following measures should be included? (Select 3)","vi":"Một kiến trúc sư giải pháp đang xác định phạm vi các biện pháp kiểm soát rủi ro đạo đức cho một trợ lý dựa trên Claude sẽ soạn các bản tóm tắt đánh giá hiệu suất nội bộ từ ghi chú của quản lý trên toàn bộ lực lượng lao động đa quốc gia.\u003cbr>\u003cbr>Nhóm tuân thủ muốn có một bộ biện pháp cụ thể giải quyết các vấn đề thiên lệch (bias), công bằng (fairness) và minh bạch (transparency) trước khi ra mắt.\u003cbr>\u003cbr>Những biện pháp nào sau đây nên được đưa vào? (Chọn ba.)"},"options":[{"k":"A","t":{"en":"Run paired-scenario evaluations comparing summary tone and detail across employee groups given identical underlying performance notes.","vi":"Chạy các đánh giá theo kịch bản cặp (paired-scenario) để so sánh giọng điệu và mức độ chi tiết của bản tóm tắt giữa các nhóm nhân viên khi có cùng ghi chú hiệu suất nền tảng giống hệt nhau."}},{"k":"B","t":{"en":"Document, in a form reviewers can inspect, which specific decision factors the assistant is instructed to weigh whenever it drafts a summary.","vi":"Ghi lại, dưới dạng người rà soát có thể kiểm tra, những yếu tố quyết định cụ thể mà trợ lý được hướng dẫn cân nhắc mỗi khi soạn một bản tóm tắt."}},{"k":"C","t":{"en":"Give every employee, regardless of role or seniority, a mechanism to request the specific factors that shaped their own summary.","vi":"Cung cấp cho mọi nhân viên, bất kể vai trò hay thâm niên, một cơ chế để yêu cầu xem các yếu tố cụ thể đã định hình bản tóm tắt của chính họ."}},{"k":"D","t":{"en":"Skip bias testing across the initial launch region and only extend testing later if formal complaints get filed after go-live.","vi":"Bỏ qua kiểm thử thiên lệch ở khu vực ra mắt ban đầu và chỉ mở rộng kiểm thử sau này nếu có khiếu nại chính thức được gửi sau khi go-live."}},{"k":"E","t":{"en":"Let each manager's personal phrasing preferences silently override the standardized summary template with absolutely no logging kept.","vi":"Để sở thích diễn đạt cá nhân của từng quản lý âm thầm ghi đè template tóm tắt chuẩn hóa mà hoàn toàn không lưu log."}},{"k":"F","t":{"en":"Restrict summary review access to a single manager with no secondary sign-off, to keep the rollout process deliberately lightweight.","vi":"Giới hạn quyền rà soát bản tóm tắt cho một quản lý duy nhất, không có phê duyệt thứ cấp, để giữ quy trình triển khai gọn nhẹ một cách có chủ đích."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Chạy các đánh giá theo kịch bản cặp (paired-scenario) để so sánh giọng điệu và mức độ chi tiết của bản tóm tắt giữa các nhóm nhân viên khi có cùng ghi chú hiệu suất nền tảng giống hệt nhau.\u003cbr>\u003cbr>Paired-scenario evaluation giữ nội dung hiệu suất giống nhau và so tone, chi tiết giữa các nhóm để tìm thiên lệch không do dữ liệu công việc. Minh bạch còn cần ghi rõ yếu tố hệ thống cân nhắc và cho nhân viên xem yếu tố ảnh hưởng bản tóm tắt của mình. Hai biện pháp này cũng phù hợp với yêu cầu chọn ba nhưng bị khóa bỏ sót.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Ghi lại, dưới dạng người rà soát có thể kiểm tra, những yếu tố quyết định cụ thể mà trợ lý được hướng dẫn cân nhắc mỗi khi soạn một bản tóm tắt.\u003c/strong>: Ghi yếu tố được cân nhắc giúp reviewer kiểm tra và là lựa chọn đúng bị thiếu.\u003cbr>- \u003cstrong>Cung cấp cho mọi nhân viên, bất kể vai trò hay thâm niên, một cơ chế để yêu cầu xem các yếu tố cụ thể đã định hình bản tóm tắt của chính họ.\u003c/strong>: Cho nhân viên tiếp cận yếu tố của bản tóm tắt riêng đáp ứng minh bạch và là lựa chọn đúng bị thiếu.\u003cbr>- \u003cstrong>Bỏ qua kiểm thử thiên lệch ở khu vực ra mắt ban đầu và chỉ mở rộng kiểm thử sau này nếu có khiếu nại chính thức được gửi sau khi go-live.\u003c/strong>: Đợi khiếu nại mới kiểm tra để rủi ro thiên lệch đi vào launch mà không đo trước.\u003cbr>- \u003cstrong>Để sở thích diễn đạt cá nhân của từng quản lý âm thầm ghi đè template tóm tắt chuẩn hóa mà hoàn toàn không lưu log.\u003c/strong>: Override âm thầm không log làm mất nhất quán và khả năng truy vết.\u003cbr>- \u003cstrong>Giới hạn quyền rà soát bản tóm tắt cho một quản lý duy nhất, không có phê duyệt thứ cấp, để giữ quy trình triển khai gọn nhẹ một cách có chủ đích.\u003c/strong>: Một người duyệt không có kiểm tra thứ hai làm yếu khả năng phát hiện thiên lệch.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Đề yêu cầu ba lựa chọn nhưng khóa chỉ có paired-scenario evaluations. Tài liệu hóa yếu tố và cơ chế minh bạch cho nhân viên cũng phù hợp; cần duyệt đủ ba nội dung.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">AI Risk Management Framework\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":30,"sourceN":156},{"id":"diff-learning-157","n":157,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A solutions architect is running the first discovery session with a new prospect before recommending any specific Claude model. According to Anthropic's model-selection guidance, which factors should the architect establish as key criteria during this session?","vi":"Một kiến trúc sư giải pháp đang thực hiện buổi khảo sát (discovery session) đầu tiên với một khách hàng tiềm năng mới trước khi khuyến nghị bất kỳ model Claude cụ thể nào. Theo hướng dẫn chọn model của Anthropic, kiến trúc sư nên xác lập những yếu tố nào làm tiêu chí chính trong buổi này?"},"options":[{"k":"A","t":{"en":"The specific capabilities the model must have to meet the prospect's needs","vi":"Các năng lực cụ thể mà model phải có để đáp ứng nhu cầu của khách hàng tiềm năng"}},{"k":"B","t":{"en":"How quickly the model must respond within the prospect's application","vi":"Model phải phản hồi nhanh đến mức nào trong ứng dụng của khách hàng tiềm năng"}},{"k":"C","t":{"en":"The prospect's available budget for development and production usage","vi":"Ngân sách sẵn có của khách hàng tiềm năng cho việc phát triển và sử dụng trong production"}},{"k":"D","t":{"en":"The exact number of employees currently working in the prospect's IT department","vi":"Số lượng chính xác nhân viên hiện đang làm việc trong bộ phận IT của khách hàng tiềm năng"}},{"k":"E","t":{"en":"Which social media platforms the prospect uses for customer marketing","vi":"Những nền tảng mạng xã hội mà khách hàng tiềm năng dùng để marketing tới khách hàng"}},{"k":"F","t":{"en":"The version number of the prospect's internal ticketing software","vi":"Số phiên bản của phần mềm quản lý ticket nội bộ của khách hàng tiềm năng"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Các năng lực cụ thể mà model phải có để đáp ứng nhu cầu của khách hàng tiềm năng\u003cbr>\u003cbr>Khám phá trước hết phải xác định model cần làm được việc gì. Thời gian phản hồi và ngân sách phát triển/vận hành cũng giới hạn lựa chọn, nên không thể đưa đề xuất chỉ từ năng lực. Khóa hiện chọn một tiêu chí trong khi câu hỏi hỏi nhiều tiêu chí phù hợp.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Model phải phản hồi nhanh đến mức nào trong ứng dụng của khách hàng tiềm năng\u003c/strong>: Latency là tiêu chí lựa chọn trực tiếp, hợp lệ nhưng khóa bỏ sót.\u003cbr>- \u003cstrong>Ngân sách sẵn có của khách hàng tiềm năng cho việc phát triển và sử dụng trong production\u003c/strong>: Ngân sách là tiêu chí lựa chọn trực tiếp, hợp lệ nhưng khóa bỏ sót.\u003cbr>- \u003cstrong>Số lượng chính xác nhân viên hiện đang làm việc trong bộ phận IT của khách hàng tiềm năng\u003c/strong>: Số nhân viên IT có thể ảnh hưởng rollout nhưng không tự xác định năng lực, latency hay cost model cần có.\u003cbr>- \u003cstrong>Những nền tảng mạng xã hội mà khách hàng tiềm năng dùng để marketing tới khách hàng\u003c/strong>: Kênh marketing không tự liên quan yêu cầu model của ứng dụng đang khảo sát.\u003cbr>- \u003cstrong>Số phiên bản của phần mềm quản lý ticket nội bộ của khách hàng tiềm năng\u003c/strong>: Version ticketing chỉ quan trọng nếu có ràng buộc tích hợp cụ thể; đề chưa nêu.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Khóa chỉ chọn năng lực dù câu hỏi hỏi nhiều tiêu chí. Tốc độ phản hồi và ngân sách cũng được tài liệu chọn model nêu rõ; cần duyệt thêm theo nội dung.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/choosing-a-model\" target=\"_blank\" rel=\"noopener noreferrer\">Choosing the right model\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":31,"sourceN":157},{"id":"diff-learning-158","n":158,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A financial services customer's compliance team says every AI-generated answer referencing internal policy documents must point to the exact sentence it was drawn from, so auditors can verify the source without re-reading the whole document.\u003cbr>\u003cbr>Which capability addresses this discovery finding?","vi":"Nhóm tuân thủ của một khách hàng dịch vụ tài chính cho biết mọi câu trả lời do AI tạo ra có tham chiếu tới tài liệu chính sách nội bộ đều phải chỉ ra chính xác câu mà nó được rút ra, để kiểm toán viên có thể xác minh nguồn mà không phải đọc lại toàn bộ tài liệu.\u003cbr>\u003cbr>Năng lực nào giải quyết phát hiện này từ giai đoạn khảo sát (discovery)?"},"options":[{"k":"A","t":{"en":"Citations, which let Claude reference the exact sentences and passages in source documents used to generate a response","vi":"Citations, cho phép Claude tham chiếu chính xác các câu và đoạn trong tài liệu nguồn được dùng để tạo ra phản hồi"}},{"k":"B","t":{"en":"Search results, which enable natural citations for RAG applications by attaching proper source attribution to search results","vi":"Search results, cho phép tạo trích dẫn tự nhiên cho các ứng dụng RAG bằng cách gắn thông tin ghi nguồn phù hợp vào kết quả tìm kiếm"}},{"k":"C","t":{"en":"Token counting, which determines the number of tokens in a message before it is sent to Claude","vi":"Token counting, xác định số lượng token trong một message trước khi nó được gửi tới Claude"}},{"k":"D","t":{"en":"The Files API, which uploads and manages documents so they do not need to be re-sent with every request","vi":"Files API, tải lên và quản lý tài liệu để chúng không cần được gửi lại cùng mọi yêu cầu"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Citations, cho phép Claude tham chiếu chính xác các câu và đoạn trong tài liệu nguồn được dùng để tạo ra phản hồi\u003cbr>\u003cbr>Citations gắn phản hồi với đoạn văn nguồn trong tài liệu citable để auditor mở đúng chỗ thay vì đọc cả tài liệu. Cơ chế xác định vị trí nguồn hỗ trợ kiểm chứng, không tự đảm bảo suy luận đúng. Nếu tài liệu vào qua RAG search result blocks, Search results cũng có thể đáp ứng nên cần làm rõ kiến trúc.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Search results, cho phép tạo trích dẫn tự nhiên cho các ứng dụng RAG bằng cách gắn thông tin ghi nguồn phù hợp vào kết quả tìm kiếm\u003c/strong>: Search results cũng có thể tạo attribution ở đoạn truy hồi, là phương án khả thi bị bỏ qua nếu dùng RAG.\u003cbr>- \u003cstrong>Token counting, xác định số lượng token trong một message trước khi nó được gửi tới Claude\u003c/strong>: Token counting đo dung lượng message, không chỉ vị trí câu nguồn.\u003cbr>- \u003cstrong>Files API, tải lên và quản lý tài liệu để chúng không cần được gửi lại cùng mọi yêu cầu\u003c/strong>: Files API quản lý upload và tham chiếu file, không tự tạo citation chính xác.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Citations là đáp án capability tổng quát; Search results cũng có thể thỏa yêu cầu trong RAG. Đề cần nói rõ tài liệu citable trực tiếp hay retrieved search-result blocks để phân biệt chắc chắn.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/citations\" target=\"_blank\" rel=\"noopener noreferrer\">Citations\u003c/a>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/search-results\" target=\"_blank\" rel=\"noopener noreferrer\">Search results\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":32,"sourceN":158},{"id":"diff-learning-159","n":159,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A customer support tooling vendor still runs Claude Haiku 3.5 in a legacy component and receives Anthropic's notice that the model is retired outside of Bedrock and Google Cloud.\u003cbr>\u003cbr>Their engineering stakeholders want to know how this affects their committed timeline.\u003cbr>\u003cbr>What is the accurate expectation to set?","vi":"Một nhà cung cấp công cụ hỗ trợ khách hàng vẫn đang chạy Claude Haiku 3.5 trong một thành phần cũ (legacy) và nhận được thông báo từ Anthropic rằng model này đã ngừng hoạt động (retired) bên ngoài Bedrock và Google Cloud.\u003cbr>\u003cbr>Các bên liên quan phía kỹ thuật của họ muốn biết điều này ảnh hưởng thế nào đến tiến độ đã cam kết.\u003cbr>\u003cbr>Kỳ vọng chính xác cần thiết lập là gì?"},"options":[{"k":"A","t":{"en":"Direct API and other non-Bedrock/Vertex-hosted traffic on Haiku 3.5 must migrate to a supported model before retirement, while deployments specifically on Bedrock or Google Cloud can keep running it under those platforms' own timelines","vi":"Lưu lượng gọi API trực tiếp và các lưu lượng khác không được host trên Bedrock/Vertex dùng Haiku 3.5 phải chuyển sang một model được hỗ trợ trước thời điểm ngừng hoạt động, trong khi các triển khai cụ thể trên Bedrock hoặc Google Cloud có thể tiếp tục chạy model này theo lịch trình riêng của các nền tảng đó"}},{"k":"B","t":{"en":"The retirement notice only affects new customers who sign up after the announcement date, so the vendor's existing production traffic is permanently exempt regardless of hosting platform","vi":"Thông báo ngừng hoạt động chỉ ảnh hưởng đến khách hàng mới đăng ký sau ngày công bố, nên lưu lượng production hiện có của nhà cung cấp được miễn trừ vĩnh viễn bất kể nền tảng host"}},{"k":"C","t":{"en":"Retirement notices apply uniformly across every hosting platform including Bedrock and Google Cloud, so all deployments of Haiku 3.5 everywhere must migrate by the same date","vi":"Thông báo ngừng hoạt động áp dụng đồng loạt trên mọi nền tảng host, kể cả Bedrock và Google Cloud, nên mọi triển khai Haiku 3.5 ở mọi nơi đều phải chuyển đổi trước cùng một ngày"}},{"k":"D","t":{"en":"Model retirement only restricts access to the Console UI for prompting Haiku 3.5, while direct Messages API traffic on any platform continues indefinitely unaffected","vi":"Việc ngừng hoạt động model chỉ hạn chế truy cập giao diện Console để prompt Haiku 3.5, trong khi lưu lượng Messages API trực tiếp trên mọi nền tảng vẫn tiếp tục vô thời hạn mà không bị ảnh hưởng"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Lưu lượng gọi API trực tiếp và các lưu lượng khác không được host trên Bedrock/Vertex dùng Haiku 3.5 phải chuyển sang một model được hỗ trợ trước thời điểm ngừng hoạt động, trong khi các triển khai cụ thể trên Bedrock hoặc Google Cloud có thể tiếp tục chạy model này theo lịch trình riêng của các nền tảng đó\u003cbr>\u003cbr>Retirement yêu cầu traffic thuộc nền tảng áp dụng chuyển sang model được hỗ trợ trước hạn; khách hàng cũ không được miễn vĩnh viễn. Với Haiku 3.5, cần phân biệt Claude API với Bedrock và các dạng Google Cloud theo lịch từng nhà cung cấp. Cụm Google Cloud trong lựa chọn quá rộng để cam kết mọi deployment tiếp tục chạy.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Thông báo ngừng hoạt động chỉ ảnh hưởng đến khách hàng mới đăng ký sau ngày công bố, nên lưu lượng production hiện có của nhà cung cấp được miễn trừ vĩnh viễn bất kể nền tảng host\u003c/strong>: Khách hàng đang dùng vẫn chịu lifecycle model, không có miễn trừ vĩnh viễn vì đã production.\u003cbr>- \u003cstrong>Thông báo ngừng hoạt động áp dụng đồng loạt trên mọi nền tảng host, kể cả Bedrock và Google Cloud, nên mọi triển khai Haiku 3.5 ở mọi nơi đều phải chuyển đổi trước cùng một ngày\u003c/strong>: Các nền tảng có lịch phục vụ riêng; không được áp một ngày duy nhất mà chưa kiểm tra.\u003cbr>- \u003cstrong>Việc ngừng hoạt động model chỉ hạn chế truy cập giao diện Console để prompt Haiku 3.5, trong khi lưu lượng Messages API trực tiếp trên mọi nền tảng vẫn tiếp tục vô thời hạn mà không bị ảnh hưởng\u003c/strong>: Retirement có thể dừng Messages API cho model, không chỉ ẩn Console UI.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Lựa chọn nguồn nói Google Cloud quá rộng. Docs hiện phân biệt Google-managed và Anthropic-managed trên Google Cloud; kiểm tra nền tảng, model ID và ngày ngừng trước khi dùng câu.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/about-claude/model-deprecations\" target=\"_blank\" rel=\"noopener noreferrer\">Model deprecations\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":33,"sourceN":159},{"id":"diff-learning-160","n":160,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"Two months after a customer support assistant goes live, the operations team notices their monthly Claude spend has grown faster than ticket volume and wants to identify which workspace and model combination is driving the increase.\u003cbr>\u003cbr>Which monitoring approach addresses this?","vi":"Hai tháng sau khi một trợ lý hỗ trợ khách hàng đi vào vận hành, nhóm vận hành nhận thấy chi phí Claude hằng tháng tăng nhanh hơn khối lượng ticket và muốn xác định tổ hợp workspace và model nào đang gây ra mức tăng này.\u003cbr>\u003cbr>Cách giám sát nào giải quyết được vấn đề này?"},"options":[{"k":"A","t":{"en":"Query the Usage and Cost Admin API grouped by workspace and model to reconcile spend against token consumption","vi":"Truy vấn Usage and Cost Admin API, nhóm theo workspace và model, để đối chiếu chi phí với lượng token tiêu thụ"}},{"k":"B","t":{"en":"Re-run the original evaluation set from the design phase to check whether output quality has regressed","vi":"Chạy lại tập đánh giá ban đầu từ giai đoạn thiết kế để kiểm tra xem chất lượng đầu ra có bị suy giảm hay không"}},{"k":"C","t":{"en":"Increase the agent's allowed_tools scope so it can investigate its own billing records directly","vi":"Mở rộng phạm vi allowed_tools của agent để nó có thể tự điều tra trực tiếp hồ sơ thanh toán của chính mình"}},{"k":"D","t":{"en":"Ask the support team to manually count tickets handled per day and compare that figure to the invoice total","vi":"Yêu cầu nhóm hỗ trợ đếm thủ công số ticket được xử lý mỗi ngày và so sánh con số đó với tổng hóa đơn"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Truy vấn Usage and Cost Admin API, nhóm theo workspace và model, để đối chiếu chi phí với lượng token tiêu thụ\u003cbr>\u003cbr>Usage and Cost Admin API cho phép đối chiếu lượng token và chi phí theo workspace/model qua thời gian. Usage có thể group theo model và workspace; cost dùng workspace và description chứa trường model. So số liệu cùng kỳ và phân trang đầy đủ để tìm nhánh tăng chi tiêu.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Chạy lại tập đánh giá ban đầu từ giai đoạn thiết kế để kiểm tra xem chất lượng đầu ra có bị suy giảm hay không\u003c/strong>: Chạy lại eval kiểm tra chất lượng, không phân bổ spend theo workspace và model.\u003cbr>- \u003cstrong>Mở rộng phạm vi allowed_tools của agent để nó có thể tự điều tra trực tiếp hồ sơ thanh toán của chính mình\u003c/strong>: Nới tool agent không cần thiết để vận hành báo cáo billing và tăng quyền ngoài phạm vi.\u003cbr>- \u003cstrong>Yêu cầu nhóm hỗ trợ đếm thủ công số ticket được xử lý mỗi ngày và so sánh con số đó với tổng hóa đơn\u003c/strong>: Đếm ticket chỉ cho mẫu số workload, không tách token hoặc model gây tăng chi phí.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/usage-cost-api\" target=\"_blank\" rel=\"noopener noreferrer\">Usage and Cost API\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":34,"sourceN":160},{"id":"diff-learning-161","n":161,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team is documenting the caching architecture for a service where the same large system prompt and tool definitions are sent with nearly every request.\u003cbr>\u003cbr>The implementation guidance needs to explain how to cut repeated processing cost and latency for that static content.\u003cbr>\u003cbr>What should the guidance recommend?","vi":"Một nhóm đang viết tài liệu về kiến trúc caching cho một dịch vụ, trong đó cùng một system prompt lớn và các định nghĩa tool được gửi kèm gần như mọi yêu cầu.\u003cbr>\u003cbr>Hướng dẫn triển khai cần giải thích cách cắt giảm chi phí xử lý lặp lại và độ trễ cho phần nội dung tĩnh đó.\u003cbr>\u003cbr>Hướng dẫn nên khuyến nghị điều gì?"},"options":[{"k":"A","t":{"en":"Mark the reusable system prompt and tool definitions as cached blocks so repeated requests reuse the prefix instead of reprocessing it.","vi":"Đánh dấu system prompt và các định nghĩa tool có thể tái sử dụng là các block được cache để các yêu cầu lặp lại tái sử dụng tiền tố (prefix) thay vì xử lý lại nó."}},{"k":"B","t":{"en":"Increase the context window to 1M tokens so the large system prompt fits entirely without ever needing to be truncated across requests.","vi":"Tăng context window lên 1M token để system prompt lớn vừa trọn vẹn mà không bao giờ cần bị cắt bớt qua các yêu cầu."}},{"k":"C","t":{"en":"Move the system prompt into the Files API so it uploads once and Claude re-reads it fresh from storage on every single request.","vi":"Chuyển system prompt vào Files API để nó được tải lên một lần và Claude đọc lại nó từ kho lưu trữ ở mỗi yêu cầu."}},{"k":"D","t":{"en":"Enable batch processing so every request carrying the large system prompt is queued and billed at half price automatically.","vi":"Bật batch processing để mọi yêu cầu mang system prompt lớn được đưa vào hàng đợi và tự động tính phí ở mức một nửa giá."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Đánh dấu system prompt và các định nghĩa tool có thể tái sử dụng là các block được cache để các yêu cầu lặp lại tái sử dụng tiền tố (prefix) thay vì xử lý lại nó.\u003cbr>\u003cbr>Đặt cache breakpoint cho prefix gồm tool definitions và system prompt ổn định để các request sau có thể đọc cache. Cache hit giảm tính toán lặp của phần giống nhau; hiệu quả còn phụ thuộc prefix khớp, thời hạn và điều kiện cache của model.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Tăng context window lên 1M token để system prompt lớn vừa trọn vẹn mà không bao giờ cần bị cắt bớt qua các yêu cầu.\u003c/strong>: Context window lớn chỉ cho chứa nhiều token, không làm xử lý prefix miễn phí.\u003cbr>- \u003cstrong>Chuyển system prompt vào Files API để nó được tải lên một lần và Claude đọc lại nó từ kho lưu trữ ở mỗi yêu cầu.\u003c/strong>: Files API tránh upload lặp, không đồng nghĩa tái sử dụng tính toán system prompt.\u003cbr>- \u003cstrong>Bật batch processing để mọi yêu cầu mang system prompt lớn được đưa vào hàng đợi và tự động tính phí ở mức một nửa giá.\u003c/strong>: Batch có discount khi dùng endpoint batch, không tự cache và không tự áp cho mọi request thường.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\" target=\"_blank\" rel=\"noopener noreferrer\">Prompt caching\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":35,"sourceN":161},{"id":"diff-learning-162","n":162,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"Your coding-agent product is exceeding its latency budget on Claude Opus 4.8.\u003cbr>\u003cbr>Before proposing a switch to a smaller model, a colleague suggests first tuning the effort parameter.\u003cbr>\u003cbr>How should you frame this trade-off to the team?","vi":"Sản phẩm coding agent của bạn đang vượt ngân sách độ trễ (latency budget) trên Claude Opus 4.8.\u003cbr>\u003cbr>Trước khi đề xuất chuyển sang một model nhỏ hơn, một đồng nghiệp gợi ý trước tiên hãy tinh chỉnh tham số effort.\u003cbr>\u003cbr>Bạn nên trình bày sự đánh đổi này với nhóm như thế nào?"},"options":[{"k":"A","t":{"en":"Adjusting effort trades intelligence for latency and cost within the same model; lowering it from the default may recover budget without the accuracy loss that comes from switching to a different, less capable model.","vi":"Điều chỉnh effort là đánh đổi mức độ thông minh lấy độ trễ và chi phí trong cùng một model; hạ nó xuống dưới mức mặc định có thể lấy lại ngân sách mà không bị mất độ chính xác như khi chuyển sang một model khác kém năng lực hơn."}},{"k":"B","t":{"en":"The effort parameter governs only tool-call count per turn, not the model's raw inference latency, so the team should focus on switching to a smaller model that fits the latency budget for the coding-agent product.","vi":"Tham số effort chỉ điều chỉnh số lệnh gọi tool mỗi lượt, không phải độ trễ suy luận thô của model, nên nhóm nên tập trung vào việc chuyển sang một model nhỏ hơn phù hợp với ngân sách độ trễ của sản phẩm coding agent."}},{"k":"C","t":{"en":"Effort on Claude Opus 4.8 can only be increased, never decreased, which prevents the team from lowering latency through this parameter; therefore, the migration to a model family that offers a tunable effort floor is the correct path to meet the latency budget.","vi":"Effort trên Claude Opus 4.8 chỉ có thể tăng, không bao giờ giảm, điều này khiến nhóm không thể giảm độ trễ thông qua tham số này; do đó, chuyển sang một dòng model (model family) có mức effort tối thiểu điều chỉnh được là con đường đúng để đáp ứng ngân sách độ trễ."}},{"k":"D","t":{"en":"Effort tuning is only available via the Claude API, not in Claude Code, so the coding-agent product cannot lower latency this way; the team should switch to a model family with native effort controls in Claude Code.","vi":"Tinh chỉnh effort chỉ khả dụng qua Claude API, không có trong Claude Code, nên sản phẩm coding agent không thể giảm độ trễ theo cách này; nhóm nên chuyển sang một dòng model có sẵn khả năng điều khiển effort gốc trong Claude Code."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Điều chỉnh effort là đánh đổi mức độ thông minh lấy độ trễ và chi phí trong cùng một model; hạ nó xuống dưới mức mặc định có thể lấy lại ngân sách mà không bị mất độ chính xác như khi chuyển sang một model khác kém năng lực hơn.\u003cbr>\u003cbr>Tuning effort giữ cùng model nhưng thay lượng tài nguyên nó dành cho suy luận, từ đó có thể giảm latency và cost trước khi đổi model. Với Opus 4.8 có thể hạ effort; phải benchmark chất lượng tác vụ coding vì hạ effort vẫn có đánh đổi năng lực, không có bảo đảm giữ nguyên accuracy.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Tham số effort chỉ điều chỉnh số lệnh gọi tool mỗi lượt, không phải độ trễ suy luận thô của model, nên nhóm nên tập trung vào việc chuyển sang một model nhỏ hơn phù hợp với ngân sách độ trễ của sản phẩm coding agent.\u003c/strong>: Effort ảnh hưởng suy luận và token, không chỉ giới hạn số tool call.\u003cbr>- \u003cstrong>Effort trên Claude Opus 4.8 chỉ có thể tăng, không bao giờ giảm, điều này khiến nhóm không thể giảm độ trễ thông qua tham số này; do đó, chuyển sang một dòng model (model family) có mức effort tối thiểu điều chỉnh được là con đường đúng để đáp ứng ngân sách độ trễ.\u003c/strong>: Effort có thể giảm; không chỉ được tăng lên.\u003cbr>- \u003cstrong>Tinh chỉnh effort chỉ khả dụng qua Claude API, không có trong Claude Code, nên sản phẩm coding agent không thể giảm độ trễ theo cách này; nhóm nên chuyển sang một dòng model có sẵn khả năng điều khiển effort gốc trong Claude Code.\u003c/strong>: Claude Code cũng có điều khiển effort trên model hỗ trợ; API-only là khẳng định sai.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/effort\" target=\"_blank\" rel=\"noopener noreferrer\">Effort\u003c/a>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/model-config\" target=\"_blank\" rel=\"noopener noreferrer\">Model configuration\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":36,"sourceN":162},{"id":"diff-learning-163","n":163,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A solutions architect is designing the initial rollout of Claude Code for a mid-size company with no existing device management.\u003cbr>\u003cbr>The company has developers on unmanaged laptops, wants centralized visibility into token spend, and needs org-wide policy to reach both local sessions and Claude Code on the web.\u003cbr>\u003cbr>Which set of decisions correctly matches each requirement to the right mechanism? (Select 3)","vi":"Một kiến trúc sư giải pháp đang thiết kế đợt triển khai ban đầu của Claude Code cho một công ty quy mô vừa chưa có hệ thống quản lý thiết bị (device management) nào.\u003cbr>\u003cbr>Công ty có các developer dùng laptop không được quản lý, muốn có khả năng quan sát tập trung về chi phí token, và cần chính sách toàn tổ chức áp dụng cho cả các phiên cục bộ lẫn Claude Code on the web.\u003cbr>\u003cbr>Tập quyết định nào ghép đúng từng yêu cầu với cơ chế phù hợp? (Chọn ba.)"},"options":[{"k":"A","t":{"en":"Choose Claude for Teams or Enterprise as the API provider so Claude Code and claude.ai share one per-seat subscription with no infrastructure to run","vi":"Chọn Claude for Teams hoặc Enterprise làm API provider để Claude Code và claude.ai dùng chung một gói thuê bao theo từng người dùng (per-seat), không cần vận hành hạ tầng"}},{"k":"B","t":{"en":"Use server-managed settings delivered from the claude.ai admin console, since it reaches both local and web sessions without requiring MDM","vi":"Dùng server-managed settings được phân phối từ admin console của claude.ai, vì cơ chế này áp dụng cho cả phiên cục bộ lẫn phiên web mà không cần MDM"}},{"k":"C","t":{"en":"Use the usage dashboard at claude.ai/analytics/claude-code for centralized spend visibility, available on Claude for Teams and Enterprise plans","vi":"Dùng usage dashboard tại claude.ai/analytics/claude-code để quan sát tập trung chi phí, khả dụng trên các gói Claude for Teams và Enterprise"}},{"k":"D","t":{"en":"Deploy a plist-based managed-settings policy through macOS MDM as the primary policy channel, since it is the strongest enforcement mechanism available","vi":"Triển khai chính sách managed-settings dựa trên plist qua macOS MDM làm kênh chính sách chính, vì đây là cơ chế cưỡng chế mạnh nhất hiện có"}},{"k":"E","t":{"en":"Rely exclusively on project-level .claude/settings.json files committed to each repository to establish organization-wide policy","vi":"Chỉ dựa vào các file .claude/settings.json cấp project được commit vào từng repository để thiết lập chính sách toàn tổ chức"}},{"k":"F","t":{"en":"Configure Amazon Bedrock as the API provider so the company can use server-managed settings for centralized policy delivery","vi":"Cấu hình Amazon Bedrock làm API provider để công ty có thể dùng server-managed settings cho việc phân phối chính sách tập trung"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Chọn Claude for Teams hoặc Enterprise làm API provider để Claude Code và claude.ai dùng chung một gói thuê bao theo từng người dùng (per-seat), không cần vận hành hạ tầng\u003cbr>\u003cbr>Teams/Enterprise cho phép nhóm dùng Claude Code qua tài khoản tổ chức mà không phải tự vận hành hạ tầng cung cấp model. Server-managed settings là kênh phù hợp cho laptop không MDM và cloud sessions, nhưng phụ thuộc account, quyền quản trị và hỗ trợ nền tảng. Đề yêu cầu ba nhưng chỉ khóa một; analytics cũng cần phân biệt hoạt động với token/spend thực tế.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Dùng server-managed settings được phân phối từ admin console của claude.ai, vì cơ chế này áp dụng cho cả phiên cục bộ lẫn phiên web mà không cần MDM\u003c/strong>: Server-managed settings phù hợp yêu cầu local và web khi đủ điều kiện, nên là đáp án hợp lệ cần duyệt bổ sung.\u003cbr>- \u003cstrong>Dùng usage dashboard tại claude.ai/analytics/claude-code để quan sát tập trung chi phí, khả dụng trên các gói Claude for Teams và Enterprise\u003c/strong>: Analytics có thể cho usage tập trung, nhưng không được giả định mọi plan/credential đều có token và spend đầy đủ; cần duyệt wording và số đáp án.\u003cbr>- \u003cstrong>Triển khai chính sách managed-settings dựa trên plist qua macOS MDM làm kênh chính sách chính, vì đây là cơ chế cưỡng chế mạnh nhất hiện có\u003c/strong>: MDM chưa có trong tổ chức và policy trên endpoint không tự tới cloud session.\u003cbr>- \u003cstrong>Chỉ dựa vào các file .claude/settings.json cấp project được commit vào từng repository để thiết lập chính sách toàn tổ chức\u003c/strong>: File project chia sẻ mặc định theo repo, không thay chính sách tổ chức bắt buộc trên mọi session.\u003cbr>- \u003cstrong>Cấu hình Amazon Bedrock làm API provider để công ty có thể dùng server-managed settings cho việc phân phối chính sách tập trung\u003c/strong>: Bedrock không phải cơ chế cấp điều kiện server-managed settings qua tài khoản claude.ai.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Đề yêu cầu ba nhưng khóa chỉ chọn Teams/Enterprise. Server-managed settings phù hợp có điều kiện; analytics dashboard không tự bảo đảm số liệu token/cost đầy đủ. Cần sửa wording và duyệt số lượng đáp án theo credential/platform hiện tại; giữ nguyên khóa nguồn.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/server-managed-settings\" target=\"_blank\" rel=\"noopener noreferrer\">Server-managed settings\u003c/a>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/analytics\" target=\"_blank\" rel=\"noopener noreferrer\">Track team usage with analytics\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":37,"sourceN":163},{"id":"diff-learning-164","n":164,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A platform team is wiring Claude Code into a locked-down CI pipeline where no human is available to approve prompts, and only a pre-approved set of tools defined in permission rules should ever run.\u003cbr>\u003cbr>Which permission mode fits this pipeline?","vi":"Một nhóm nền tảng đang tích hợp Claude Code vào một pipeline CI bị khóa chặt (locked-down), nơi không có ai để phê duyệt các yêu cầu xác nhận (prompt), và chỉ một tập tool đã được phê duyệt trước, định nghĩa trong các permission rule, mới được phép chạy.\u003cbr>\u003cbr>Permission mode nào phù hợp với pipeline này?"},"options":[{"k":"A","t":{"en":"dontAsk mode, which auto-denies anything not covered by an explicit allow rule","vi":"Chế độ dontAsk, tự động từ chối mọi thứ không nằm trong một allow rule tường minh"}},{"k":"B","t":{"en":"acceptEdits mode, which auto-approves file edits and common filesystem commands","vi":"Chế độ acceptEdits, tự động phê duyệt các thao tác sửa file và các lệnh filesystem thông dụng"}},{"k":"C","t":{"en":"plan mode, which restricts Claude to reads and a proposed plan with no execution","vi":"Chế độ plan, giới hạn Claude ở thao tác đọc và đề xuất kế hoạch, không thực thi"}},{"k":"D","t":{"en":"auto mode, which relies on a classifier to approve most actions in real time","vi":"Chế độ auto, dựa vào một bộ phân loại (classifier) để phê duyệt hầu hết hành động theo thời gian thực"}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Chế độ dontAsk, tự động từ chối mọi thứ không nằm trong một allow rule tường minh\u003cbr>\u003cbr>dontAsk tự từ chối hành động vốn cần hỏi quyền khi không được cho phép, nên phù hợp nhất cho CI không có người trả lời. Tuy nhiên “chỉ explicit allow mới chạy” là mô tả quá tuyệt đối: hành động vốn không cần approval và một số cơ chế phê duyệt khác vẫn có thể chạy. Allowlist tuyệt đối cần chính sách công cụ/sandbox riêng.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Chế độ acceptEdits, tự động phê duyệt các thao tác sửa file và các lệnh filesystem thông dụng\u003c/strong>: acceptEdits cho qua sửa file theo mode, không giới hạn mọi hành động vào allowlist đã duyệt.\u003cbr>- \u003cstrong>Chế độ plan, giới hạn Claude ở thao tác đọc và đề xuất kế hoạch, không thực thi\u003c/strong>: plan không phù hợp pipeline cần thực thi các tool đã được phép.\u003cbr>- \u003cstrong>Chế độ auto, dựa vào một bộ phân loại (classifier) để phê duyệt hầu hết hành động theo thời gian thực\u003c/strong>: auto dùng classifier để xét hành động, không giữ ranh giới chỉ các quy tắc cho phép tĩnh.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Mô tả chỉ tool có allow rule mới chạy là quá chặt so với docs hiện tại: reads và hành động không cần approval vẫn chạy; mods còn có thể approve. Kiểm tra policy/sandbox riêng nếu cần allowlist tuyệt đối.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/permissions\" target=\"_blank\" rel=\"noopener noreferrer\">Configure permissions\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":38,"sourceN":164},{"id":"diff-learning-165","n":165,"topic":2,"type":"mcq","multi":false,"answer":["B"],"stem":{"en":"During a long debugging session, Claude Code raises &quot;Autocompact is thrashing: the context refilled to the limit...&quot; immediately after automatic compaction completes, and it stops retrying.\u003cbr>\u003cbr>The team was asking Claude to read an entire 40,000-line production log file to find the root cause of an outage.\u003cbr>\u003cbr>What is the most effective way to recover and continue the investigation?","vi":"Trong một phiên debug dài, Claude Code báo lỗi &quot;Autocompact is thrashing: the context refilled to the limit...&quot; ngay sau khi quá trình compaction tự động hoàn tất, và ngừng thử lại.\u003cbr>\u003cbr>Nhóm đang yêu cầu Claude đọc toàn bộ một file log production dài 40,000 dòng để tìm nguyên nhân gốc của một sự cố ngừng dịch vụ (outage).\u003cbr>\u003cbr>Cách hiệu quả nhất để khôi phục và tiếp tục điều tra là gì?"},"options":[{"k":"A","t":{"en":"Raise CLAUDE_CODE_MAX_RETRIES so Claude Code keeps retrying compaction until the log file finishes loading successfully.","vi":"Tăng CLAUDE_CODE_MAX_RETRIES để Claude Code tiếp tục thử lại compaction cho đến khi file log được nạp xong thành công."}},{"k":"B","t":{"en":"Ask Claude to read the log file in smaller chunks, such as a specific line range, or delegate the analysis to a subagent instead.","vi":"Yêu cầu Claude đọc file log theo từng phần nhỏ hơn, chẳng hạn một khoảng dòng cụ thể, hoặc thay vào đó ủy quyền việc phân tích cho một subagent."}},{"k":"C","t":{"en":"Set DISABLE_AUTO_COMPACT so Claude Code stops summarizing history and keeps the entire log output available for reference.","vi":"Đặt DISABLE_AUTO_COMPACT để Claude Code ngừng tóm tắt lịch sử và giữ toàn bộ đầu ra log để tham chiếu."}},{"k":"D","t":{"en":"Run /clear to discard the conversation, then paste only the final error line from the log file into a fresh session.","vi":"Chạy /clear để bỏ cuộc hội thoại, rồi chỉ dán dòng lỗi cuối cùng từ file log vào một phiên mới."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Yêu cầu Claude đọc file log theo từng phần nhỏ hơn, chẳng hạn một khoảng dòng cụ thể, hoặc thay vào đó ủy quyền việc phân tích cho một subagent.\u003cbr>\u003cbr>Đọc log theo khoảng dòng hoặc lọc phần liên quan giới hạn lượng dữ liệu mỗi lần vào context. Subagent có thể xử lý phần riêng rồi trả kết luận ngắn. Cả hai sửa nguyên nhân refilling ngay sau compact: một kết quả tool quá lớn lại lấp đầy context.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Tăng CLAUDE_CODE_MAX_RETRIES để Claude Code tiếp tục thử lại compaction cho đến khi file log được nạp xong thành công.\u003c/strong>: Tăng retry không giảm kích thước log và không sửa vòng compact rồi đầy lại.\u003cbr>- \u003cstrong>Đặt DISABLE_AUTO_COMPACT để Claude Code ngừng tóm tắt lịch sử và giữ toàn bộ đầu ra log để tham chiếu.\u003c/strong>: Tắt compact không tăng context window; giữ toàn bộ log vẫn gặp giới hạn.\u003cbr>- \u003cstrong>Chạy /clear để bỏ cuộc hội thoại, rồi chỉ dán dòng lỗi cuối cùng từ file log vào một phiên mới.\u003c/strong>: Clear có thể tạo chỗ, nhưng chỉ giữ dòng cuối làm mất chuỗi sự kiện cần điều tra nguyên nhân.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/mcp\" target=\"_blank\" rel=\"noopener noreferrer\">Connect Claude Code to tools via MCP\u003c/a>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/troubleshooting\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshooting\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":39,"sourceN":165},{"id":"diff-learning-166","n":166,"topic":2,"type":"mcq","multi":false,"answer":["A"],"stem":{"en":"A team's project relies on an internal MCP server for ticket lookups.\u003cbr>\u003cbr>Running /mcp shows the server status as connected, but Claude reports it has no tools available from that server and cannot look up tickets.\u003cbr>\u003cbr>What is the correct next step to diagnose the failure?","vi":"Dự án của một nhóm dựa vào một MCP server nội bộ để tra cứu ticket.\u003cbr>\u003cbr>Chạy /mcp cho thấy trạng thái server là connected, nhưng Claude báo rằng không có tool nào khả dụng từ server đó và không thể tra cứu ticket.\u003cbr>\u003cbr>Bước tiếp theo đúng để chẩn đoán lỗi là gì?"},"options":[{"k":"A","t":{"en":"Select Reconnect for the server from /mcp, and if the tool count stays at zero, run claude --debug mcp to see the server's stderr output.","vi":"Chọn Reconnect cho server từ /mcp, và nếu số lượng tool vẫn bằng 0, chạy claude --debug mcp để xem đầu ra stderr của server."}},{"k":"B","t":{"en":"Edit .mcp.json to change the server's command from a relative path to an absolute path, since a relative path always prevents any tools from loading.","vi":"Sửa .mcp.json để đổi command của server từ đường dẫn tương đối sang đường dẫn tuyệt đối, vì đường dẫn tương đối luôn khiến không tool nào được nạp."}},{"k":"C","t":{"en":"Approve the server from /mcp again, since project-scoped MCP servers silently stop returning tools after the one-time approval expires.","vi":"Phê duyệt lại server từ /mcp, vì các MCP server phạm vi project âm thầm ngừng trả về tool sau khi lần phê duyệt một lần hết hạn."}},{"k":"D","t":{"en":"Restart Claude Code with claude --safe-mode, since a server that reports zero tools while connected is always disabled under safe mode.","vi":"Khởi động lại Claude Code với claude --safe-mode, vì một server báo không có tool nào trong khi vẫn connected thì luôn bị vô hiệu hóa ở safe mode."}}],"explain":{"text":"\u003cstrong>Nội dung đáp án theo khóa nguồn:\u003c/strong> Chọn Reconnect cho server từ /mcp, và nếu số lượng tool vẫn bằng 0, chạy claude --debug mcp để xem đầu ra stderr của server.\u003cbr>\u003cbr>Connected chỉ xác nhận kết nối, không chứng minh tools/list đã trả tool dùng được. Reconnect từ /mcp rồi xem debug/stderr giúp kiểm tra đăng ký tool và lỗi server. Để lọc đúng category theo CLI hiện tại, dùng claude --debug=mcp; dạng cách khoảng trong lựa chọn không áp bộ lọc.\u003cbr>\u003cbr>\u003cstrong>Vì sao các phương án khác không phù hợp?\u003c/strong>\u003cbr>\u003cbr>- \u003cstrong>Sửa .mcp.json để đổi command của server từ đường dẫn tương đối sang đường dẫn tuyệt đối, vì đường dẫn tương đối luôn khiến không tool nào được nạp.\u003c/strong>: Relative path không phải lúc nào cũng lỗi; cần xem command và log thực tế thay vì kết luận luôn không nạp tool.\u003cbr>- \u003cstrong>Phê duyệt lại server từ /mcp, vì các MCP server phạm vi project âm thầm ngừng trả về tool sau khi lần phê duyệt một lần hết hạn.\u003c/strong>: Không có cơ sở cho việc approval hết hạn âm thầm; cần phân biệt trust với tool discovery.\u003cbr>- \u003cstrong>Khởi động lại Claude Code với claude --safe-mode, vì một server báo không có tool nào trong khi vẫn connected thì luôn bị vô hiệu hóa ở safe mode.\u003c/strong>: Zero tools có nhiều nguyên nhân và không chứng minh safe mode; dùng chế độ khác không phải chẩn đoán bằng log.\u003cbr>\u003cbr>\u003cstrong>Cần xem lại:\u003c/strong> Ý chẩn đoán đúng nhưng lệnh nguồn dùng --debug mcp. CLI hiện yêu cầu --debug=mcp để filter category; dạng cách khoảng chỉ bật debug không lọc. Cần sửa instruction trước khi xuất bản; hiện giữ nguyên text nguồn.\u003cbr>\u003cbr>\u003cstrong>Tham khảo:\u003c/strong>\u003cbr>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/mcp\" target=\"_blank\" rel=\"noopener noreferrer\">Connect Claude Code to tools via MCP\u003c/a>\u003cbr>- \u003ca href=\"https://code.claude.com/docs/en/cli-reference\" target=\"_blank\" rel=\"noopener noreferrer\">CLI reference\u003c/a>"},"source":"CCAR-P_learning_tool.html","sourceSet":4,"sourceI":40,"sourceN":166}]}]};
