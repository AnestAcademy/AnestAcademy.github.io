<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf3fa">
  <meta name="description" content="Chọn bộ luyện thi Claude Certified Developer hoặc Claude Certified Architect.">
  <title>Chọn bộ luyện thi Claude</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
      color: #183451;
      background: #edf3fa;
      -webkit-text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      padding: max(40px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    main {
      width: min(100%, 620px);
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    header p {
      margin: 0;
      color: #52667d;
      font-size: 16px;
      line-height: 1.6;
    }

    nav {
      display: grid;
      gap: 14px;
    }

    .exam-link {
      --accent: #245c96;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      gap: 16px;
      min-height: 80px;
      padding: 22px 24px;
      border: 1px solid #d3deeb;
      border-left: 5px solid var(--accent);
      border-radius: 24px;
      color: inherit;
      background: #fff;
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: #dbe9f8;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .exam-link.architect {
      --accent: #336c66;
    }

    .exam-link.professional {
      --accent: #665399;
    }

    .exam-code {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 26px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .exam-name {
      display: block;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .exam-level {
      display: block;
      margin-top: 4px;
      color: #52667d;
      font-size: 14px;
      line-height: 1.5;
    }

    .chevron {
      width: 28px;
      height: 28px;
      color: var(--accent);
    }

    .exam-link:focus-visible {
      outline: 3px solid #245c96;
      outline-offset: 4px;
    }

    .exam-link:active {
      background: #e6eef8;
    }

    @media (hover: hover) {
      .exam-link:hover {
        border-color: var(--accent);
        background: #f7faff;
      }
    }

    @media (max-width: 380px) {
      body {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }

      .exam-link {
        padding: 20px 18px;
        gap: 10px;
      }

      .exam-code {
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .exam-link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Luyện thi Claude</h1>
      <p>Chọn bộ câu hỏi để bắt đầu ôn luyện.</p>
    </header>

    <nav aria-label="Chọn bộ luyện thi">
      <a class="exam-link" href="./CCDV-F_trainer.html">
        <span>
          <span class="exam-code">CCDV-F</span>
          <span class="exam-name">Claude Certified Developer</span>
          <span class="exam-level">Foundations</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>

      <a class="exam-link architect" href="./CCAR-F_trainer.html">
        <span>
          <span class="exam-code">CCAR-F</span>
          <span class="exam-name">Claude Certified Architect</span>
          <span class="exam-level">Foundations</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>

      <a class="exam-link professional" href="./CCAR-P_trainer.html">
        <span>
          <span class="exam-code">CCAR-P</span>
          <span class="exam-name">Claude Certified Architect</span>
          <span class="exam-level">Professional</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>
      <a class="exam-link professional" href="./CCAR-P_52_diff.html">
        <span>
          <span class="exam-code">CCAR-P-52</span>
          <span class="exam-name">52 câu hỏi khác biệt</span>
          <span class="exam-level">Professional</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>
    </nav>
  </main>
</body>

</html>
